function spawnEnemy(){

Math.floor(Math.random()*4);

let x;
let y;

if(side===0){

Math.random()*

}

Math.random()<.5

// =========================
// JOYSTICK POSITIONS
// =========================

function joystickPos(){

joy.x=82;
joy.y=H-82;

}


function aimJoystickPos(){

aimJoy.x=W-65;
aimJoy.y=H-65;

}


// =========================
// MOVE JOYSTICK
// =========================

function setJoystick(px,py){

joystickPos();

let dx=px-joy.x;
let dy=py-joy.y;

let l=Math.hypot(dx,dy)||1;

if(l>joy.r){

dx=
dx/l*
joy.r;

dy=
dy/l*
joy.r;

}

joy.dx=dx/joy.r;
joy.dy=dy/joy.r;

joy.tx=joy.x+dx;
joy.ty=joy.y+dy;

}


// =========================
// AIM JOYSTICK
// =========================

function setAimJoystick(px,py){

aimJoystickPos();

let dx=px-aimJoy.x;
let dy=py-aimJoy.y;

let l=Math.hypot(dx,dy)||1;

if(l>aimJoy.r){

dx=
dx/l*
aimJoy.r;

dy=
dy/l*
aimJoy.r;

}

aimJoy.dx=dx/aimJoy.r;
aimJoy.dy=dy/aimJoy.r;

aimJoy.tx=aimJoy.x+dx;
aimJoy.ty=aimJoy.y+dy;


if(
Math.abs(aimJoy.dx)>.01||
Math.abs(aimJoy.dy)>.01
){

player.aimTarget=
Math.atan2(
aimJoy.dy,
aimJoy.dx
);

}

}


// =========================
// BUTTONS
// =========================

function pointInPlay(x,y){

const bw=Math.min(
260,
W-60
);

const bh=64;

const bx=(W-bw)/2;

const by=H/2+25;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}


function pointInPause(x,y){

return(
x>=W-110&&
x<=W-16&&
y>=12&&
y<=44
);

}


function pointInCard(x,y,i){

const gap=16;

const cardW=Math.min(
300,
(W-32-gap)/2
);

const totalW=
cardW*2+gap;

const startX=
(W-totalW)/2;

const cardY=
H/2-75;

const xx=
startX+
i*(cardW+gap);

return(
x>=xx&&
x<=xx+cardW&&
y>=cardY&&
y<=cardY+150
);

}


// =========================
// FIRE FAST
// =========================

function fireFast(){

if(
player.weapon!=="fast"
)
return;

if(player.reloading)
return;

if(player.ammo<=0){

startFastReload();

return;

}


const a=player.aim;


for(
let i=0;
i<player.shots;
i++
){

const aa=
a+
(
i-
(player.shots-1)/2
)*.18;


shots.push({

x:player.x,
y:player.y,

vx:
Math.cos(aa)*
player.bulletSpeed,

vy:
Math.sin(aa)*
player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage

});

}


player.ammo--;

shoot=player.fireRate;


if(player.ammo<=0){

startFastReload();

}

}


// =========================
// FAST RELOAD
// =========================

function startFastReload(){

player.ammo=0;

player.reloading=true;

player.reloadTimer=
player.reloadTime;

}


// =========================
// FIRE SCATTER
// =========================

function fireScatter(){

if(
player.weapon!=="scatter"
)
return;

if(player.scatterReloading)
return;


if(player.scatterAmmo<=0){

startScatterReload();

return;

}


const a=player.aim;

const spread=.055;


for(
let i=0;
i<player.shots;
i++
){

const offset=
(
i-
(player.shots-1)/2
)*
spread;

const aa=a+offset;


shots.push({

x:player.x,
y:player.y,

vx:
Math.cos(aa)*
player.bulletSpeed,

vy:
Math.sin(aa)*
player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage

});

}


player.scatterAmmo--;

shoot=1.5;


if(player.scatterAmmo<=0){

startScatterReload();

}

}


// =========================
// SCATTER RELOAD
// =========================

function startScatterReload(){

player.scatterAmmo=0;

player.scatterReloading=true;

player.scatterReloadTimer=
player.scatterReloadTime;

}


// =========================
// POINTER DOWN
// =========================

c.addEventListener(
"pointerdown",
e=>{

e.preventDefault();


// MENU

if(!started){

if(
pointInPlay(
e.clientX,
e.clientY
)
){

startGame();

}

return;

}


// GAME OVER

if(gameOver){

startGame();

return;

}


// WEAPON CHOICE

if(weaponChoiceOpen){

for(
let i=0;
i<2;
i++
){

if(
pointInCard(
e.clientX,
e.clientY,
i
)
){

chooseWeapon(i);

return;

}

}

return;

}


// UPGRADES

if(upgradeOpen){

for(
let i=0;
i<2;
i++
){

if(
pointInCard(
e.clientX,
e.clientY,
i
)
){

chooseUpgrade(i);

return;

}

}

return;

}


// PAUSE

if(
pointInPause(
e.clientX,
e.clientY
)
){

paused=!paused;

return;

}


if(paused)
return;


// Update joystick locations

joystickPos();
aimJoystickPos();


// AIM JOYSTICK

const aimDistance=
Math.hypot(
e.clientX-aimJoy.x,
e.clientY-aimJoy.y
);

if(
aimDistance<=
aimJoy.r+25
){

aimJoy.on=true;

aimJoy.pointerId=e.pointerId;

setAimJoystick(
e.clientX,
e.clientY
);


// FIRE IMMEDIATELY

if(
player.weapon==="fast"&&
!player.reloading&&
shoot<=0
){

fireFast();

}

if(
player.weapon==="scatter"&&
!player.scatterReloading&&
shoot<=0
){

fireScatter();

}


return;

}


// MOVE JOYSTICK

const moveDistance=
Math.hypot(
e.clientX-joy.x,
e.clientY-joy.y
);

if(
moveDistance<=
joy.r+25
){

joy.on=true;

joy.pointerId=e.pointerId;

setJoystick(
e.clientX,
e.clientY
);

return;

}

});


// =========================
// POINTER MOVE
// =========================

c.addEventListener(
"pointermove",
e=>{

e.preventDefault();


if(
aimJoy.on&&
e.pointerId===aimJoy.pointerId
){

setAimJoystick(
e.clientX,
e.clientY
);

}


if(
joy.on&&

){

setJoystick(

);

}

});


// =========================
// POINTER UP
// =========================

function releasePointer(e){

if(
aimJoy.on&&
e.pointerId===aimJoy.pointerId
){

aimJoy.on=false;

aimJoy.pointerId=null;

aimJoy.dx=1;
aimJoy.dy=0;

aimJoystickPos();

aimJoy.tx=aimJoy.x;
aimJoy.ty=aimJoy.y;

}


if(
joy.on&&
e.pointerId===joy.pointerId
){

joy.on=false;

joy.pointerId=null;

joy.dx=0;
joy.dy=0;

joystickPos();

joy.tx=joy.x;
joy.ty=joy.y;

}

}


c.addEventListener(
"pointerup",
releasePointer
);

c.addEventListener(
"pointercancel",
releasePointer
);

addEventListener(
"pointerup",
releasePointer
);

addEventListener(
"pointercancel",
releasePointer
);


// =========================
// KEYBOARD
// =========================

addEventListener(
"keydown",
e=>{

if(
e.key.toLowerCase()==="p"||
e.key==="Escape"
){

togglePause();

}

});


// =========================
// UPDATE
// =========================

function update(dt){

if(
!started||
gameOver||
paused||
upgradeOpen||
weaponChoiceOpen
)
return;


// =========================
// MOVEMENT
// =========================

if(
Math.hypot(
joy.dx,
joy.dy
)>.05
){

player.x+=
joy.dx*
player.speed*
dt;

player.y+=
joy.dy*
player.speed*
dt;

}


player.x=Math.max(
arena.left+18,
Math.min(
arena.right-18,
player.x
)
);

player.y=Math.max(
arena.top+18,
Math.min(
H-arena.bottom-18,
player.y
)
);


// =========================
// AIM ROTATION
// =========================

if(aimJoy.on){

let diff=
player.aimTarget-
player.aim;

while(
diff>Math.PI
)
diff-=Math.PI*2;

while(
diff<-Math.PI
)
diff+=Math.PI*2;


player.aim+=
diff*
Math.min(
1,
dt*10*player.aimSensitivity
);

}


// =========================
// WAVE BREAK
// =========================

if(waveBreakTimer>0){

waveBreakTimer-=dt;

if(waveBreakTimer<=0){

startWave();

}

}


// =========================
// SPAWN
// =========================

if(
waveBreakTimer<=0&&
waveSpawned<waveTotal
){

waveSpawnTimer-=dt;

if(waveSpawnTimer<=0){

spawnEnemy();

waveSpawned++;

waveSpawnTimer=
getWaveSpawnSpeed(wave);

}

}


// =========================
// WAVE COMPLETE
// =========================

if(
waveBreakTimer<=0&&
waveSpawned===waveTotal&&
enemies.length===0
){

completeWave();

}


// =========================
// SCATTER RELOAD
// =========================

if(
player.weapon==="scatter"&&
player.scatterReloading
){

player.scatterReloadTimer-=dt;

if(
player.scatterReloadTimer<=0
){

player.scatterReloadTimer=0;

player.scatterAmmo=
player.scatterMaxAmmo;

player.scatterReloading=false;

}

}


// =========================
// FAST RELOAD
// =========================

if(
player.weapon==="fast"&&
player.reloading
){

player.reloadTimer-=dt;

if(
player.reloadTimer<=0
){

player.reloadTimer=0;

player.ammo=
player.maxAmmo;

player.reloading=false;

}

}


// =========================
// FIRE TIMER
// =========================

shoot-=dt;


// =========================
// FAST PEW PEW
// =========================

if(
player.weapon==="fast"&&
aimJoy.on&&
shoot<=0&&
!player.reloading
){

fireFast();

}


// =========================
// SCATTER BLASTER
// =========================

if(
player.weapon==="scatter"&&
aimJoy.on&&
shoot<=0&&
!player.scatterReloading
){

fireScatter();

}


// =========================
// ENEMIES
// =========================

for(const e of enemies){

const a=
Math.atan2(
player.y-e.y,
player.x-e.x
);


e.x+=
Math.cos(a)*
e.speed*
dt;

e.y+=
Math.sin(a)*
e.speed*
dt;


e.shoot-=dt;


if(e.shoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*130,
vy:Math.sin(a)*130,

r:6,

life:5

});

e.shoot=2.5;

}


if(
Math.hypot(
e.x-player.x,
e.y-player.y
)
<
e.r+player.r
){

player.hp-=25;

e.x-=
Math.cos(a)*25;

e.y-=
Math.sin(a)*25;

}

}


// =========================
// PLAYER SHOTS
// =========================

for(const s of shots){

s.x+=s.vx*dt;

s.y+=s.vy*dt;

s.life-=dt;


if(
s.x<arena.left||
s.x>arena.right||
s.y<arena.top||
s.y>H-arena.bottom
){

s.life=0;

}

}


// =========================
// ENEMY SHOTS
// =========================

for(const s of enemyShots){

s.x+=s.vx*dt;

s.y+=s.vy*dt;

s.life-=dt;


if(
Math.hypot(
s.x-player.x,
s.y-player.y
)
<
s.r+player.r
){

player.hp-=15;

s.life=0;

}

}


// =========================
// COLLISIONS
// =========================

for(const s of shots){

for(const e of enemies){

if(
e.hp>0&&
Math.hypot(
s.x-e.x,
s.y-e.y
)
<
s.r+e.r
){

e.hp-=s.damage;

s.life=0;


if(e.hp<=0){

score+=10;

orbs.push({

x:e.x,
y:e.y

});

}

break;

}

}

}


// =========================
// CLEANUP
// =========================

shots=shots.filter(
s=>
s.life>0&&
s.x>arena.left&&
s.x<arena.right&&
s.y>arena.top&&
s.y<H-arena.bottom
);


enemyShots=enemyShots.filter(
s=>s.life>0
);


enemies=enemies.filter(
e=>e.hp>0
);


// =========================
// XP ORBS
// =========================

for(const o of orbs){

const dist=
Math.hypot(
o.x-player.x,
o.y-player.y
);


const maxDistance=
Math.hypot(W,H);


const closeness=
1-Math.min(
1,
dist/maxDistance
);


const speed=
25+
Math.pow(
closeness,
2
)*475;


if(dist>.1){

o.x+=
(player.x-o.x)/
dist*
speed*
dt;

o.y+=
(player.y-o.y)/
dist*
speed*
dt;

}


if(dist<18){

o.dead=true;

xp+=25;


while(xp>=xpNext){

xp-=xpNext;

level++;

xpNext=
Math.floor(
xpNext*1.25
);


if(level===2){

openWeaponChoice();

return;

}


if(level>2){

openUpgrades();

return;

}

}

}

}


orbs=orbs.filter(
o=>!o.dead
);


// =========================
// GAME OVER
// =========================

if(player.hp<=0){

gameOver=true;

}

}


// =========================
// WEAPON CHOICE
// =========================

function openWeaponChoice(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=true;

paused=false;

}


// =========================
// CHOOSE WEAPON
// =========================

function chooseWeapon(i){

if(!weaponChoiceOpen)
return;


if(i===0){

// SCATTER

player.weapon="scatter";

player.shots=1;

player.damage=20;

player.fireRate=1.5;

player.bulletSpeed=480;

player.scatterMaxAmmo=8;

player.scatterAmmo=8;

player.scatterReloadTime=3;

player.scatterReloadTimer=0;

player.scatterReloading=false;

}

else{

// FAST

player.weapon="fast";

player.shots=1;

player.damage=10;

player.fireRate=.14;

player.bulletSpeed=480;

player.maxAmmo=8;

player.ammo=8;

player.reloadTime=2;

player.reloadTimer=0;

player.reloading=false;

}


weaponChoiceOpen=false;

upgradeOpen=false;

if(!player.weapon){

upgradeOpen=true;

let pool;


if(player.weapon==="scatter"){

pool=[
...scatterBlasterUpgrades
];


if(
player.scatterPlus2>=2
){

pool=
pool.filter(
u=>u.name!=="+2 Shots"
);

}

}

else{

pool=[
...fastPewPewUpgrades
];


if(
player.fastVelocityUpgrades>=2
){

pool=
pool.filter(
u=>u.name!=="Velocity Boost"
);

}

}


while(
upgradeChoices.length<2&&
pool.length>0
){

const i=
Math.floor(
Math.random()*pool.length
);


upgradeChoices.push(
pool[i]
);

pool.splice(i,1);

}

}


// =========================

function chooseUpgrade(i){

if(
!upgradeOpen||
!upgradeChoices[i]
)
return;


upgradeChoices[i].apply();

enemyShots=[];

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;

shoot=0;

}
