<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bulletbound</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  background:#080a10;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  overscroll-behavior:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1;

let gameBottom=0;
let controlTop=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  updateArena();
}

window.addEventListener("resize",resize);

const arena={
  left:14,
  right:0,
  top:72,
  bottom:0
};

function updateArena(){
  const controlHeight=Math.min(
    185,
    Math.max(150,H*.23)
  );

  controlTop=H-controlHeight;

  arena.left=14;
  arena.right=W-14;
  arena.top=72;
  arena.bottom=controlTop;

  gameBottom=controlTop-8;
}

resize();


/* =========================
   GAME STATE
========================= */

let screen="menu";

let paused=false;
let gameOver=false;

let wave=1;
let waveTimer=0;
let waveDelay=2;

let score=0;

let level=1;
let xp=0;
let xpNeed=8;

let upgradeOpen=false;
let weaponChoiceOpen=false;

let selectedDevice="mobile";

let autoShoot=true;


/* =========================
   PLAYER
========================= */

const player={
  x:0,
  y:0,
  r:13,

  speed:175,

  hp:100,
  maxHp:100,

  damage:12,
  fireCooldown:.32,
  fireTimer:0,

  bulletSpeed:390,

  weapon:"base",

  ammo:6,
  maxAmmo:6,

  reloadTime:1.25,
  reloadTimer:0,
  reloading:false,

  aimX:1,
  aimY:0
};


/* =========================
   WEAPONS
========================= */

const weapons={
  base:{
    name:"Base Weapon",
    desc:"Reliable automatic fire.",
    damage:12,
    cooldown:.32,
    speed:390,
    ammo:6,
    reload:1.25
  },

  scatter:{
    name:"Scatter Blaster",
    desc:"Fires multiple bullets at once.",
    damage:8,
    cooldown:.55,
    speed:360,
    ammo:5,
    reload:1.45,
    tier:1,
    pierce:false
  },

  fast:{
    name:"Fast Pew Pew",
    desc:"Very fast firing with low damage.",
    damage:5,
    cooldown:.12,
    speed:460,
    ammo:18,
    reload:1.5
  }
};


/* =========================
   FAST UPGRADES
========================= */

const fastUpgrades=[
  {
    name:"Pew Pew Power",
    desc:"+3 bullet damage.",
    apply(){
      player.damage+=3;
    }
  },

  {
    name:"Rapid Fire",
    desc:"Fire 15% faster.",
    apply(){
      player.fireCooldown*=.85;
    }
  },

  {
    name:"Velocity Boost",
    desc:"+55 bullet speed.",
    apply(){
      player.bulletSpeed+=55;
    }
  },

  {
    name:"Ammo Capacity",
    desc:"+4 maximum ammo.",
    apply(){
      player.maxAmmo+=4;
      player.ammo=player.maxAmmo;
    }
  },

  {
    name:"Quick Reload",
    desc:"Reload 20% faster.",
    apply(){
      player.reloadTime*=.8;
    }
  }
];


/* =========================
   ARRAYS
========================= */

const enemies=[];
const bullets=[];
const enemyBullets=[];
const xpOrbs=[];


/* =========================
   RESET
========================= */

function applyEquippedWeapon(){
  const w=weapons[player.weapon];

  player.damage=w.damage;
  player.fireCooldown=w.cooldown;
  player.bulletSpeed=w.speed;
  player.maxAmmo=w.ammo;
  player.ammo=w.ammo;
  player.reloadTime=w.reload;
  player.fireTimer=0;
  player.reloadTimer=0;
  player.reloading=false;

  if(player.weapon==="scatter"){
    player.scatterTier=w.tier||1;
  }
}

function reset(){
  enemies.length=0;
  bullets.length=0;
  enemyBullets.length=0;
  xpOrbs.length=0;

  wave=1;
  waveTimer=0;
  score=0;

  level=1;
  xp=0;
  xpNeed=8;

  upgradeOpen=false;
  weaponChoiceOpen=false;

  gameOver=false;
  paused=false;

  player.x=W/2;
  player.y=Math.min(
    arena.bottom-70,
    arena.top+(arena.bottom-arena.top)/2
  );

  player.hp=player.maxHp;

  applyEquippedWeapon();
}


/* =========================
   START
========================= */

function startGame(){
  screen="game";
  reset();
}


/* =========================
   ENEMIES
========================= */

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=arena.left+Math.random()*(arena.right-arena.left);
    y=arena.top-20;
  }else if(side===1){
    x=arena.right+20;
    y=arena.top+Math.random()*(gameBottom-arena.top);
  }else if(side===2){
    x=arena.left+Math.random()*(arena.right-arena.left);
    y=gameBottom+20;
  }else{
    x=arena.left-20;
    y=arena.top+Math.random()*(gameBottom-arena.top);
  }

  enemies.push({
    x,
    y,
    r:12,
    hp:25+wave*4,
    maxHp:25+wave*4,
    speed:35+wave*1.5,
    boss:false
  });
}

function spawnBoss(){
  const side=Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=W/2;
    y=arena.top-45;
  }else if(side===1){
    x=arena.right+45;
    y=(arena.top+gameBottom)/2;
  }else if(side===2){
    x=W/2;
    y=gameBottom+45;
  }else{
    x=arena.left-45;
    y=(arena.top+gameBottom)/2;
  }

  const hp=500+wave*100;

  enemies.push({
    x,
    y,
    r:28,
    hp,
    maxHp:hp,
    speed:20+wave*.5,
    boss:true,
    shootTimer:2
  });
}


/* =========================
   JOYSTICKS
========================= */

const joy={
  x:0,
  y:0,
  baseX:0,
  baseY:0,
  dx:0,
  dy:0,
  on:false,
  id:null,
  r:58
};

const aimJoy={
  x:0,
  y:0,
  baseX:0,
  baseY:0,
  dx:0,
  dy:0,
  on:false,
  id:null,
  r:58
};

function updateJoystickPositions(){
  const controlY=controlTop+(H-controlTop)/2;
  const side=Math.min(78,W*.20);

  joy.x=side;
  joy.y=controlY;

  aimJoy.x=W-side;
  aimJoy.y=controlY;
}

updateJoystickPositions();

function setJoystick(j,x,y){
  const dx=x-j.x;
  const dy=y-j.y;

  const dist=Math.hypot(dx,dy);

  const max=j.r;

  if(dist>max){
    j.dx=dx/dist;
    j.dy=dy/dist;
  }else{
    j.dx=dx/max;
    j.dy=dy/max;
  }
}

function releaseJoystick(id){
  if(joy.id===id){
    joy.on=false;
    joy.id=null;
    joy.dx=0;
    joy.dy=0;
  }

  if(aimJoy.id===id){
    aimJoy.on=false;
    aimJoy.id=null;
    aimJoy.dx=0;
    aimJoy.dy=0;
  }
}


/* =========================
   BUTTONS
========================= */

function pauseRect(){
  return {
    x:W-58,
    y:14,
    w:44,
    h:44
  };
}

function pointInRect(x,y,r){
  return (
    x>=r.x &&
    x<=r.x+r.w &&
    y>=r.y &&
    y<=r.y+r.h
  );
}


/* =========================
   TOUCH
========================= */

canvas.addEventListener("touchstart",e=>{
  e.preventDefault();

  for(const t of e.changedTouches){
    const x=t.clientX;
    const y=t.clientY;

    if(screen==="menu"){
      handleMenuTouch(x,y);
      continue;
    }

    if(screen==="settings"){
      handleSettingsTouch(x,y);
      continue;
    }

    if(screen==="weapons"){
      handleWeaponTouch(x,y);
      continue;
    }

    if(screen==="gameover"){
      reset();
      screen="game";
      continue;
    }

    if(upgradeOpen){
      for(let i=0;i<upgradeChoices.length;i++){
        if(pointInUpgradeCard(x,y,i)){
          chooseUpgrade(i);
          break;
        }
      }
      continue;
    }

    if(weaponChoiceOpen){
      for(let i=0;i<weaponChoices.length;i++){
        if(pointInWeaponCard(x,y,i)){
          chooseWeapon(i);
          break;
        }
      }
      continue;
    }

    if(pointInRect(x,y,pauseRect())){
      paused=!paused;
      continue;
    }

    const distL=Math.hypot(x-joy.x,y-joy.y);
    const distR=Math.hypot(x-aimJoy.x,y-aimJoy.y);

    if(distL<joy.r*1.45){
      joy.on=true;
      joy.id=t.identifier;
      setJoystick(joy,x,y);
    }else if(distR<aimJoy.r*1.45){
      aimJoy.on=true;
      aimJoy.id=t.identifier;
      setJoystick(aimJoy,x,y);
    }
  }
},{passive:false});


canvas.addEventListener("touchmove",e=>{
  e.preventDefault();

  for(const t of e.changedTouches){
    if(joy.id===t.identifier){
      setJoystick(joy,t.clientX,t.clientY);
    }

    if(aimJoy.id===t.identifier){
      setJoystick(aimJoy,t.clientX,t.clientY);
    }
  }
},{passive:false});


canvas.addEventListener("touchend",e=>{
  e.preventDefault();

  for(const t of e.changedTouches){
    releaseJoystick(t.identifier);
  }
},{passive:false});


canvas.addEventListener("touchcancel",e=>{
  for(const t of e.changedTouches){
    releaseJoystick(t.identifier);
  }
});


/* =========================
   POINTER
========================= */

canvas.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch") return;

  const x=e.clientX;
  const y=e.clientY;

  if(screen==="menu"){
    handleMenuTouch(x,y);
    return;
  }

  if(screen==="settings"){
    handleSettingsTouch(x,y);
    return;
  }

  if(screen==="weapons"){
    handleWeaponTouch(x,y);
    return;
  }

  if(screen==="gameover"){
    reset();
    screen="game";
    return;
  }

  if(upgradeOpen){
    for(let i=0;i<upgradeChoices.length;i++){
      if(pointInUpgradeCard(x,y,i)){
        chooseUpgrade(i);
        return;
      }
    }
    return;
  }

  if(weaponChoiceOpen){
    for(let i=0;i<weaponChoices.length;i++){
      if(pointInWeaponCard(x,y,i)){
        chooseWeapon(i);
        return;
      }
    }
    return;
  }

  if(pointInRect(x,y,pauseRect())){
    paused=!paused;
  }
});


/* =========================
   KEYBOARD
========================= */

const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key==="Escape" && screen==="game"){
    paused=!paused;
  }
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});


/* =========================
   MENU
========================= */

function menuButtonRects(){
  const w=Math.min(300,W-50);
  const h=58;
  const gap=15;

  const x=(W-w)/2;
  const start=H*.48;

  return [
    {x,y:start,w,h},
    {x,y:start+h+gap,w,h},
    {x,y:start+(h+gap)*2,w,h}
  ];
}

function handleMenuTouch(x,y){
  const r=menuButtonRects();

  if(pointInRect(x,y,r[0])){
    startGame();
  }else if(pointInRect(x,y,r[1])){
    screen="weapons";
  }else if(pointInRect(x,y,r[2])){
    screen="settings";
  }
}


/* =========================
   SETTINGS
========================= */

function settingsDeviceRects(){
  const panelW=Math.min(360,W-32);
  const x=(W-panelW)/2;

  const gap=10;

  const mobileW=Math.min(
    190,
    (panelW-gap)*.56
  );

  const computerW=panelW-gap-mobileW;

  return [
    {
      x,
      y:190,
      w:mobileW,
      h:72
    },
    {
      x:x+mobileW+gap,
      y:190,
      w:computerW,
      h:72
    }
  ];
}

function handleSettingsTouch(x,y){
  const r=settingsDeviceRects();

  if(pointInRect(x,y,r[0])){
    selectedDevice="mobile";
  }else if(pointInRect(x,y,r[1])){
    selectedDevice="computer";
  }

  const back={
    x:20,
    y:20,
    w:90,
    h:45
  };

  if(pointInRect(x,y,back)){
    screen="menu";
  }

  const auto={
    x:W/2-140,
    y:300,
    w:280,
    h:60
  };

  if(pointInRect(x,y,auto)){
    autoShoot=!autoShoot;
  }
}


/* =========================
   WEAPON LOADOUT
========================= */

const weaponChoices=[
  "scatter",
  "fast"
];

function getWeaponCardRects(){
  const gap=12;

  if(H>=W){
    const cardW=Math.min(340,W-36);
    const cardH=140;

    const total=cardH*2+gap;
    const startY=H/2-total/2+10;

    return [
      {
        x:(W-cardW)/2,
        y:startY,
        w:cardW,
        h:cardH
      },
      {
        x:(W-cardW)/2,
        y:startY+cardH+gap,
        w:cardW,
        h:cardH
      }
    ];
  }

  const cardW=(W-36-gap)/2;
  const cardH=150;
  const y=H/2-cardH/2;

  return [
    {x:18,y,w:cardW,h:cardH},
    {x:18+cardW+gap,y,w:cardW,h:cardH}
  ];
}

function pointInWeaponCard(x,y,i){
  const r=getWeaponCardRects()[i];
  return r && pointInRect(x,y,r);
}

function handleWeaponTouch(x,y){
  const rects=getWeaponCardRects();

  for(let i=0;i<weaponChoices.length;i++){
    if(pointInRect(x,y,rects[i])){
      player.weapon=weaponChoices[i];
      applyEquippedWeapon();
      screen="menu";
      return;
    }
  }

  const back={
    x:20,
    y:20,
    w:90,
    h:45
  };

  if(pointInRect(x,y,back)){
    screen="menu";
  }
}


/* =========================
   SHOOTING
========================= */

function startFastReload(){
  if(player.reloading) return;

  if(player.ammo>=player.maxAmmo) return;

  player.reloading=true;
  player.reloadTimer=player.reloadTime;
}

function fireBase(){
  if(player.reloading) return;

  if(player.ammo<=0){
    startFastReload();
    return;
  }

  const dx=player.aimX;
  const dy=player.aimY;

  bullets.push({
    x:player.x,
    y:player.y,
    vx:dx*player.bulletSpeed,
    vy:dy*player.bulletSpeed,
    r:4,
    damage:player.damage,
    pierce:false
  });

  player.ammo--;

  if(player.ammo<=0){
    startFastReload();
  }
}

function fireFast(){
  if(player.reloading) return;

  if(player.ammo<=0){
    startFastReload();
    return;
  }

  bullets.push({
    x:player.x,
    y:player.y,
    vx:player.aimX*player.bulletSpeed,
    vy:player.aimY*player.bulletSpeed,
    r:3,
    damage:player.damage,
    pierce:false
  });

  player.ammo--;

  if(player.ammo<=0){
    startFastReload();
  }
}

function fireScatter(){
  if(player.reloading) return;

  if(player.ammo<=0){
    startFastReload();
    return;
  }

  const baseAngle=Math.atan2(
    player.aimY,
    player.aimX
  );

  const tier=player.scatterTier||1;

  const count=Math.min(
    2+tier,
    7
  );

  const spread=.18+(tier-1)*.045;

  for(let i=0;i<count;i++){
    const offset=
      count===1
      ? 0
      : (i/(count-1)-.5)*spread;

    const a=baseAngle+offset;

    bullets.push({
      x:player.x,
      y:player.y,
      vx:Math.cos(a)*player.bulletSpeed,
      vy:Math.sin(a)*player.bulletSpeed,
      r:4,
      damage:player.damage,
      pierce:(player.scatterTier||1)>=5
    });
  }

  player.ammo--;

  if(player.ammo<=0){
    startFastReload();
  }
}


/* =========================
   XP / LEVELING
========================= */

function gainXP(amount){
  xp+=amount;

  if(xp>=xpNeed){
    xp-=xpNeed;
    level++;

    xpNeed=Math.floor(
      xpNeed*1.35+2
    );

    if(level===2 && player.weapon==="base"){
      weaponChoiceOpen=true;
    }else{
      openUpgrade();
    }
  }
}


/* =========================
   WEAPON CHOICE
========================= */

function chooseWeapon(index){
  player.weapon=weaponChoices[index];
  applyEquippedWeapon();

  weaponChoiceOpen=false;

  openUpgrade();
}


/* =========================
   UPGRADES
========================= */

let upgradeChoices=[];

function openUpgrade(){
  const shuffled=[
    ...fastUpgrades
  ].sort(()=>Math.random()-.5);

  upgradeChoices=shuffled.slice(0,2);

  upgradeOpen=true;
}

function chooseUpgrade(index){
  const upgrade=upgradeChoices[index];

  if(!upgrade) return;

  upgrade.apply();

  upgradeOpen=false;
  upgradeChoices=[];
}


/* =========================
   UPGRADE CARD POSITIONS
========================= */

function getUpgradeCardRects(){
  const gap=12;

  if(H>=W){
    const cardW=Math.min(340,W-36);
    const cardH=145;

    const total=cardH*2+gap;
    const startY=H/2-total/2;

    return [
      {
        x:(W-cardW)/2,
        y:startY,
        w:cardW,
        h:cardH
      },
      {
        x:(W-cardW)/2,
        y:startY+cardH+gap,
        w:cardW,
        h:cardH
      }
    ];
  }

  const cardW=(W-36-gap)/2;
  const cardH=180;

  const y=H/2-cardH/2;

  return [
    {x:18,y,w:cardW,h:cardH},
    {x:18+cardW+gap,y,w:cardW,h:cardH}
  ];
}

function pointInUpgradeCard(x,y,i){
  const r=getUpgradeCardRects()[i];
  return r && pointInRect(x,y,r);
}


/* =========================
   UPDATE
========================= */

let lastTime=performance.now();

function update(dt){
  if(screen!=="game") return;
  if(paused) return;
  if(gameOver) return;
  if(upgradeOpen) return;
  if(weaponChoiceOpen) return;

  /* movement */

  let mx=0;
  let my=0;

  if(joy.on){
    mx=joy.dx;
    my=joy.dy;
  }else{
    if(keys["w"]||keys["arrowup"]) my-=1;
    if(keys["s"]||keys["arrowdown"]) my+=1;
    if(keys["a"]||keys["arrowleft"]) mx-=1;
    if(keys["d"]||keys["arrowright"]) mx+=1;
  }

  const ml=Math.hypot(mx,my);

  if(ml>1){
    mx/=ml;
    my/=ml;
  }

  player.x+=mx*player.speed*dt;
  player.y+=my*player.speed*dt;

  player.x=Math.max(
    arena.left+player.r,
    Math.min(
      arena.right-player.r,
      player.x
    )
  );

  player.y=Math.max(
    arena.top+player.r,
    Math.min(
      gameBottom-player.r,
      player.y
    )
  );


  /* aiming */

  if(aimJoy.on){
    const l=Math.hypot(
      aimJoy.dx,
      aimJoy.dy
    );

    if(l>.15){
      player.aimX=aimJoy.dx;
      player.aimY=aimJoy.dy;
    }
  }


  /* waves */

  waveTimer+=dt;

  const spawnRate=Math.max(
    .22,
    1.05-wave*.025
  );

  if(waveTimer>=spawnRate){
    waveTimer=0;

    if(wave%10===0){
      if(!enemies.some(e=>e.boss)){
        spawnBoss();
      }
    }else{
      spawnEnemy();

      if(Math.random()<Math.min(.35,wave*.01)){
        spawnEnemy();
      }
    }
  }


  /* wave progression */

  const livingNormal=enemies.some(
    e=>!e.boss
  );

  if(
    wave%10!==0 &&
    !livingNormal &&
    waveTimer>2
  ){
    wave++;
    waveTimer=0;
  }


  /* reload */

  if(player.reloading){
    player.reloadTimer-=dt;

    if(player.reloadTimer<=0){
      player.reloading=false;
      player.ammo=player.maxAmmo;
    }
  }


  /* shooting */

  player.fireTimer-=dt;

  const aimActive=aimJoy.on;

  if(
    autoShoot &&
    aimActive &&
    player.fireTimer<=0 &&
    !player.reloading
  ){
    if(player.weapon==="scatter"){
      fireScatter();

      player.fireTimer=
        wave%10===0
        ? 1
        : player.fireCooldown;
    }else if(player.weapon==="fast"){
      fireFast();
      player.fireTimer=player.fireCooldown;
    }else{
      fireBase();
      player.fireTimer=player.fireCooldown;
    }
  }


  /* bullets */

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    let remove=
      b.x<arena.left-80 ||
      b.x>arena.right+80 ||
      b.y<arena.top-80 ||
      b.y>gameBottom+80;

    for(let j=enemies.length-1;j>=0 && !remove;j--){
      const e=enemies[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      const hitDist=b.r+e.r;

      if(dx*dx+dy*dy<hitDist*hitDist){
        e.hp-=b.damage;

        if(e.hp<=0){
          score+=e.boss?500:10;

          xpOrbs.push({
            x:e.x,
            y:e.y,
            r:e.boss?9:5,
            value:e.boss?15:2
          });

          enemies.splice(j,1);
        }

        if(!b.pierce){
          remove=true;
        }
      }
    }

    if(remove){
      bullets.splice(i,1);
    }
  }


  /* enemies */

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];

    const dx=player.x-e.x;
    const dy=player.y-e.y;

    const d=Math.hypot(dx,dy)||1;

    e.x+=dx/d*e.speed*dt;
    e.y+=dy/d*e.speed*dt;

    const hit=e.r+player.r;

    if(dx*dx+dy*dy<hit*hit){
      player.hp-=
        (e.boss?30:15)*dt;

      if(player.hp<=0){
        player.hp=0;
        gameOver=true;
      }
    }

    if(e.boss){
      e.shootTimer-=dt;

      if(e.shootTimer<=0){
        e.shootTimer=1.7;

        const count=10;

        for(let k=0;k<count;k++){
          const a=
            Math.PI*2*k/count;

          enemyBullets.push({
            x:e.x,
            y:e.y,
            vx:Math.cos(a)*130,
            vy:Math.sin(a)*130,
            r:6,
            damage:10
          });
        }
      }
    }
  }


  /* enemy bullets */

  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    const dx=b.x-player.x;
    const dy=b.y-player.y;

    const hit=b.r+player.r;

    if(dx*dx+dy*dy<hit*hit){
      player.hp-=b.damage;
      enemyBullets.splice(i,1);

      if(player.hp<=0){
        player.hp=0;
        gameOver=true;
      }

      continue;
    }

    if(
      b.x<arena.left-60 ||
      b.x>arena.right+60 ||
      b.y<arena.top-60 ||
      b.y>gameBottom+60
    ){
      enemyBullets.splice(i,1);
    }
  }


  /* XP */

  for(let i=xpOrbs.length-1;i>=0;i--){
    const o=xpOrbs[i];

    const dx=player.x-o.x;
    const dy=player.y-o.y;

    const d=Math.hypot(dx,dy);

    if(d<90){
      const pull=180;

      o.x+=dx/d*pull*dt;
      o.y+=dy/d*pull*dt;
    }

    if(d<player.r+o.r+4){
      gainXP(o.value);
      xpOrbs.splice(i,1);
    }
  }
}

/* =========================
   ARENA
========================= */

function drawArena(){
  ctx.fillStyle="#0d1119";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /* map */

  ctx.fillStyle="#121923";

  ctx.fillRect(
    arena.left,
    arena.top,
    arena.right-arena.left,
    gameBottom-arena.top
  );

  /* border */

  ctx.strokeStyle="#293448";
  ctx.lineWidth=2;

  ctx.strokeRect(
    arena.left,
    arena.top,
    arena.right-arena.left,
    gameBottom-arena.top
  );


  /* subtle grid */

  ctx.strokeStyle="#18212e";
  ctx.lineWidth=1;

  const grid=32;

  for(
    let x=arena.left;
    x<arena.right;
    x+=grid
  ){
    ctx.beginPath();
    ctx.moveTo(x,arena.top);
    ctx.lineTo(x,gameBottom);
    ctx.stroke();
  }

  for(
    let y=arena.top;
    y<gameBottom;
    y+=grid
  ){
    ctx.beginPath();
    ctx.moveTo(arena.left,y);
    ctx.lineTo(arena.right,y);
    ctx.stroke();
  }
}

========================= */

      o.value>5

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.r,

      Math.PI*2
    );

    ctx.fill();

/* =========================
   BULLETS
========================= */

function drawBullets(){
  ctx.fillStyle="#e9eef7";

  for(const b of bullets){
    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.fillStyle="#d25d68";

  for(const b of enemyBullets){
    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =========================
   ENEMIES
========================= */

function drawEnemies(){
  for(const e of enemies){
    ctx.fillStyle=
      e.boss
      ? "#8b4652"
      : "#53606d";

    ctx.beginPath();

    ctx.arc(
      e.x,
      e.y,
      e.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(e.boss){
      ctx.strokeStyle="#d0717c";
      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.r+5,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    /* health bar */

    const bw=e.r*2.2;
    const bh=4;

    ctx.fillStyle="#171b22";

    ctx.fillRect(
      e.x-bw/2,
      e.y-e.r-10,
      bw,
      bh
    );

    ctx.fillStyle="#a85b64";

    ctx.fillRect(
      e.x-bw/2,
      e.y-e.r-10,
      bw*Math.max(
        0,
        e.hp/e.maxHp
      ),
      bh
    );
  }
}

/* =========================
   MAIN DRAW
========================= */

function draw(){
  if(screen==="menu"){
    drawMenu();
    return;
  }

  if(screen==="settings"){
    drawSettings();
    return;
  }

  if(screen==="weapons"){
    drawWeapons();
    return;
  }

  if(screen==="game"){
    drawArena();
    drawHUD();
    drawControls();
    drawXP();
    drawBullets();
    drawEnemies();
    drawPlayer();

    if(weaponChoiceOpen){
      drawWeaponChoice();
    }

    if(upgradeOpen){
      drawUpgrade();
    }

    if(paused){
      drawPaused();
    }

    if(gameOver){
      drawGameOver();
    }
  }
}


/* =========================
   LOOP
========================= */

function loop(now){
  const dt=Math.min(
    .033,
    (now-lastTime)/1000
  );

  lastTime=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
