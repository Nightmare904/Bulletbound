// =========================
// BOSS AI
// =========================

function getBossPhase(e){

const ratio=e.hp/e.maxHp;

if(ratio<=.25)return 4;
if(ratio<=.50)return 3;
if(ratio<=.75)return 2;
return 1;

}

function bossStartTelegraph(e,type,angle){

e.bossTelegraphType=type;
e.bossTelegraphAngle=angle===undefined
?Math.atan2(player.y-e.y,player.x-e.x)
:angle;

e.bossTelegraphTimer=
 type==="radial"?.55
:type==="heavy"?.65
:type==="triple"?.45
:.75;

}

function bossRadialFire(e){

const p=e.bossPhase;
const count=12+(p-1)*2;
const speed=105+(p-1)*18;
const damage=p>=3?12:10;

for(let i=0;i<count;i++){

const a=(Math.PI*2/count)*i+e.bossSpiralAngle*.15;

enemyShots.push({
 x:e.x,y:e.y,
 vx:Math.cos(a)*speed,
 vy:Math.sin(a)*speed,
 r:p>=3?7.5:7,
 life:8,
 damage:damage,
 bossShot:true
});

}

e.bossSpiralAngle+=.35;

}

function bossHeavyFire(e){

const a=e.bossTelegraphAngle;
const p=e.bossPhase;
const speed=70+(p-1)*12;

enemyShots.push({
 x:e.x,y:e.y,
 vx:Math.cos(a)*speed,
 vy:Math.sin(a)*speed,
 r:p>=3?16:14,
 life:11,
 damage:50,
 bossShot:false,
 bigBossShot:true
});

}

function bossTripleFire(e){

const a=e.bossTelegraphAngle;
const p=e.bossPhase;
const speed=145+(p-1)*18;
const damage=p>=3?13:11;
const spread=.16;

for(let i=-1;i<=1;i++){
const aa=a+i*spread;
enemyShots.push({
 x:e.x,y:e.y,
 vx:Math.cos(aa)*speed,
 vy:Math.sin(aa)*speed,
 r:6.5,
 life:7,
 damage:damage,
 bossShot:true
});
}

}

function bossSpiralFire(e){

const p=e.bossPhase;
const arms=p>=4?2:1;
const count=18+p*4;
const speed=105+(p-1)*15;

for(let arm=0;arm<arms;arm++){
for(let i=0;i<count;i++){
const a=e.bossSpiralAngle+
arm*Math.PI+
(i/count)*Math.PI*2.25;
const sp=speed+i*1.8;

enemyShots.push({
 x:e.x,y:e.y,
 vx:Math.cos(a)*sp,
 vy:Math.sin(a)*sp,
 r:6.5,
 life:9,
 damage:p>=3?11:10,
 bossShot:true,
 spiralShot:true
});
}
}

e.bossSpiralAngle+=.9;

}

function bossExecuteAttack(e){

switch(e.bossTelegraphType){
case "radial": bossRadialFire(e); break;
case "heavy": bossHeavyFire(e); break;
case "triple": bossTripleFire(e); break;
case "spiral": bossSpiralFire(e); break;
}

e.bossTelegraphType="";

}

function bossChooseAttack(e){

const p=e.bossPhase;
let choices;

if(p===1)choices=["radial","heavy"];
else if(p===2)choices=["radial","heavy","triple"];
else if(p===3)choices=["radial","heavy","triple","spiral"];
else choices=["radial","heavy","triple","spiral","radial","spiral"];

let type;
do{
type=choices[Math.floor(Math.random()*choices.length)];
}while(type===e.bossLastAttack && choices.length>1);

e.bossLastAttack=type;

const a=Math.atan2(player.y-e.y,player.x-e.x);
bossStartTelegraph(e,type,a);

const cooldown=
 p===1 ? 2.7+Math.random()*.5
:p===2 ? 2.05+Math.random()*.45
:p===3 ? 1.55+Math.random()*.35
:1.05+Math.random()*.3;

e.bossAttackTimer=cooldown;

}

function updateBoss(e,dt){

const newPhase=getBossPhase(e);

if(newPhase!==e.bossPhase){
 e.bossPhase=newPhase;
 e.bossPhaseFlash=.75;
 e.bossTelegraphType="";
 e.bossTelegraphTimer=0;
 e.bossAttackTimer=.7;
}

if(e.bossPhaseFlash>0)e.bossPhaseFlash-=dt;

// Orbit the player instead of simply walking straight at them.
const dx=player.x-e.x;
const dy=player.y-e.y;
const d=Math.hypot(dx,dy)||1;
const desired=[0,235,215,195,175][e.bossPhase];
const radial=(d-desired)/100;
const tangentX=-dy/d;
const tangentY=dx/d;
const radialX=dx/d*Math.max(-1,Math.min(1,radial));
const radialY=dy/d*Math.max(-1,Math.min(1,radial));
const orbit=e.bossPhase%2===0?-1:1;
const moveX=tangentX*orbit*.82+radialX*.65;
const moveY=tangentY*orbit*.82+radialY*.65;
const moveLen=Math.hypot(moveX,moveY)||1;
const speeds=[0,27,34,44,58];
const speed=speeds[e.bossPhase];

e.x+=moveX/moveLen*speed*dt;
e.y+=moveY/moveLen*speed*dt;

e.x=Math.max(arena.left+e.r+4,Math.min(arena.right-e.r-4,e.x));
e.y=Math.max(arena.top+e.r+4,Math.min(gameBottom-e.r-4,e.y));

if(e.bossTelegraphTimer>0){
 e.bossTelegraphTimer-=dt;
 if(e.bossTelegraphTimer<=0)bossExecuteAttack(e);
 return;
}

e.bossAttackTimer-=dt;
if(e.bossAttackTimer<=0)bossChooseAttack(e);

}

function drawBossTelegraphs(){

for(const e of enemies){
if(!e.isBoss||e.hp<=0)continue;

if(e.bossPhaseFlash>0){
ctx.save();
ctx.globalAlpha=e.bossPhaseFlash*.55;
ctx.strokeStyle="#fff";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(e.x,e.y,e.r+18+(1-e.bossPhaseFlash)*28,0,Math.PI*2);
ctx.stroke();
ctx.restore();
}

if(e.bossTelegraphTimer<=0)continue;

const progress=1-e.bossTelegraphTimer/
(e.bossTelegraphType==="radial"?.55:e.bossTelegraphType==="heavy"?.65:e.bossTelegraphType==="triple"?.45:.75);
const pulse=.5+.5*Math.sin(progress*Math.PI*8);
ctx.save();
ctx.globalAlpha=.25+.25*pulse;
ctx.strokeStyle="#ffdf4d";
ctx.lineWidth=2;

if(e.bossTelegraphType==="radial"){
ctx.beginPath();
ctx.arc(e.x,e.y,e.r+10+progress*18,0,Math.PI*2);
ctx.stroke();
for(let i=0;i<12+(e.bossPhase-1)*2;i++){
const a=i*(Math.PI*2/(12+(e.bossPhase-1)*2));
ctx.beginPath();
ctx.moveTo(e.x+Math.cos(a)*(e.r+4),e.y+Math.sin(a)*(e.r+4));
ctx.lineTo(e.x+Math.cos(a)*(e.r+55),e.y+Math.sin(a)*(e.r+55));
ctx.stroke();
}
}
else{
const a=e.bossTelegraphAngle;
const spread=e.bossTelegraphType==="triple"?.16:0;
const lines=e.bossTelegraphType==="triple"?[-1,0,1]:[0];
for(const i of lines){
const aa=a+i*spread;
ctx.beginPath();
ctx.moveTo(e.x+Math.cos(aa)*e.r,e.y+Math.sin(aa)*e.r);
ctx.lineTo(e.x+Math.cos(aa)*Math.max(W,H),e.y+Math.sin(aa)*Math.max(W,H));
ctx.stroke();
}
if(e.bossTelegraphType==="spiral"){
for(let i=0;i<10;i++){
const aa=a+i*.5;
ctx.beginPath();
ctx.moveTo(e.x+Math.cos(aa)*e.r,e.y+Math.sin(aa)*e.r);
ctx.lineTo(e.x+Math.cos(aa)*160,e.y+Math.sin(aa)*160);
ctx.stroke();
}
}
}
ctx.restore();
}

}


// =========================
// JOYSTICK POSITIONS
// =========================

function joystickPos(){

const controlY=H-72;
joy.x=76;
joy.y=controlY;

}


function aimJoystickPos(){

const controlY=H-72;
aimJoy.x=W-76;
aimJoy.y=controlY;

}


// =========================
// MOVE JOYSTICK
// =========================

function setJoystick(px,py){

joystickPos();

let dx=px-joy.x;
let dy=py-joy.y;

let l=Math.hypot(dx,dy)||1;

if(l>joy.r){

dx=dx/l*joy.r;
dy=dy/l*joy.r;

}

joy.dx=dx/joy.r;
joy.dy=dy/joy.r;

joy.tx=joy.x+dx;
joy.ty=joy.y+dy;

}


// =========================
// AIM JOYSTICK
// =========================

function setAimJoystick(px,py){

aimJoystickPos();

let dx=px-aimJoy.x;
let dy=py-aimJoy.y;

let l=Math.hypot(dx,dy)||1;

if(l>aimJoy.r){

dx=dx/l*aimJoy.r;
dy=dy/l*aimJoy.r;

}

aimJoy.dx=dx/aimJoy.r;
aimJoy.dy=dy/aimJoy.r;

aimJoy.tx=aimJoy.x+dx;
aimJoy.ty=aimJoy.y+dy;


if(
Math.abs(aimJoy.dx)>.01||
Math.abs(aimJoy.dy)>.01
){

player.aimTarget=
Math.atan2(
aimJoy.dy,
aimJoy.dx
);

}

}

const bx=(W-bw)/2;
const by=H/2-25;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}

function pointInSettingsBack(x,y){

const bw=Math.min(180,W-60);
const bh=50;
const bx=(W-bw)/2;
const by=H-85;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}

function pointInBackButton(x,y){

const bw=Math.min(180,W-60);
const bh=50;

const bx=(W-bw)/2;
const by=H-85;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}


function pointInPause(x,y){

return(
x>=W-110&&
x<=W-16&&
y>=12&&
y<=44
);

}


function pointInCard(x,y,i){

const gap=16;

const cardW=Math.min(
300,
(W-32-gap)/2
);

const totalW=
cardW*2+gap;

const startX=
(W-totalW)/2;

const cardY=
H/2-75;

const xx=
startX+
i*(cardW+gap);

return(
x>=xx&&
x<=xx+cardW&&
y>=cardY&&
y<=cardY+150
);

}

// SINGLE UPGRADE CARD
// =========================

function pointInSingleUpgradeCard(x,y){

const cardW=Math.min(
360,
W-50
);

const cardH=180;

const cardX=(W-cardW)/2;
const cardY=H/2-75;

return(
x>=cardX&&
x<=cardX+cardW&&
y>=cardY&&
y<=cardY+cardH
);

}


// =========================
// AUTO SHOOT
// =========================

function getClosestEnemy(){

let closest=null;
let best=Infinity;

for(const e of enemies){

if(e.hp<=0) continue;

const d=Math.hypot(
e.x-player.x,
e.y-player.y
);

if(d<best){
best=d;
closest=e;
}

}

return closest;

}

function updateAutoShoot(){

if(!autoShoot || aimJoy.on)
return;

const target=getClosestEnemy();

if(!target)
return;

player.aimTarget=Math.atan2(
target.y-player.y,
target.x-player.x
);

player.aim=player.aimTarget;

if(player.weapon===null){

if(shoot<=0)
fireBase();

}

else if(player.weapon==="fast"){

if(shoot<=0 && !player.reloading)
fireFast();

}

else if(player.weapon==="scatter"){

if(shoot<=0)
fireScatter();

}

}


// =========================
// FIRE BASE
// =========================

function fireBase(){

if(player.weapon!==null)
return;

if(shoot>0)
return;


const a=player.aim;

shots.push({

x:player.x,
y:player.y,

vx:Math.cos(a)*player.bulletSpeed,
vy:Math.sin(a)*player.bulletSpeed,

r:5,

life:1.5,

damage:10,

pierceLeft:0

});

shoot=player.fireRate;

}


// =========================
// FIRE FAST
// =========================

function fireFast(){

if(player.weapon!=="fast")
return;

if(player.reloading)
return;

if(player.ammo<=0){

startFastReload();

return;

}


const a=player.aim;

for(
let i=0;
i<player.shots;
i++
){

const aa=
a+
(
i-(player.shots-1)/2
)*.18;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage,

pierceLeft:0

});

}


player.ammo--;

shoot=player.fireRate;


if(player.ammo<=0){

startFastReload();

}

}


// =========================
// FAST RELOAD
// =========================

function startFastReload(){

player.ammo=0;

player.reloading=true;

player.reloadTimer=player.reloadTime;

}


// =========================
// FIRE SCATTER
// =========================

function fireScatter(){

if(player.weapon!=="scatter")
return;

if(shoot>0)
return;


const a=player.aim;

const spread=.055;


for(
let i=0;
i<player.shots;
i++
){

const offset=
(
i-(player.shots-1)/2
)*spread;

const aa=a+offset;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.scatterDamage,

pierceLeft:
player.scatterPierce?1:0

});

}


shoot=player.scatterFireRate;

}

// =========================
// UPDATE
// =========================

function update(dt){

if(
!started||
gameOver||
paused||
upgradeOpen||
weaponChoiceOpen
)
return;


// MOVEMENT

if(
Math.hypot(
joy.dx,
joy.dy
)>.05
){

player.x+=joy.dx*player.speed*dt;
player.y+=joy.dy*player.speed*dt;

}


player.x=Math.max(
arena.left+18,
Math.min(
arena.right-18,
player.x
)
);

player.y=Math.max(
arena.top+18,
Math.min(
H-arena.bottom-18,
player.y
)
);


// AIM

if(aimJoy.on){

let diff=
player.aimTarget-player.aim;

while(diff>Math.PI)
diff-=Math.PI*2;

while(diff<-Math.PI)
diff+=Math.PI*2;

player.aim+=
diff*
Math.min(
1,
dt*10*player.aimSensitivity
);

}


// WAVE BREAK

if(waveBreakTimer>0){

waveBreakTimer-=dt;

if(waveBreakTimer<=0){

startWave();

}

}


// SPAWN

if(
waveBreakTimer<=0&&
waveSpawned<waveTotal
){

waveSpawnTimer-=dt;

if(waveSpawnTimer<=0){

const normalCount=getWaveNormalCount(wave);

if(
isBossWave(wave)&&
waveSpawned===normalCount
){

spawnBoss();

}
else{

spawnEnemy();

}

waveSpawned++;

waveSpawnTimer=
getWaveSpawnSpeed(wave);

}

}


// WAVE COMPLETE

if(
waveBreakTimer<=0&&
waveSpawned===waveTotal&&
enemies.length===0
){

completeWave();

}


// FAST RELOAD

if(
player.weapon==="fast"&&
player.reloading
){

player.reloadTimer-=dt;

if(player.reloadTimer<=0){

player.reloadTimer=0;

player.ammo=
player.maxAmmo;

player.reloading=false;

}

}


// AUTO SHOOT

updateAutoShoot();

// FIRE TIMER

shoot-=dt;


// BASE

if(
player.weapon===null&&
aimJoy.on&&
shoot<=0
){

fireBase();

}


// FAST

if(
player.weapon==="fast"&&
aimJoy.on&&
shoot<=0&&
!player.reloading
){

fireFast();

}


// SCATTER

if(
player.weapon==="scatter"&&
aimJoy.on&&
shoot<=0
){

fireScatter();

}


// ENEMIES

for(const e of enemies){

const a=
Math.atan2(
player.y-e.y,
player.x-e.x
);

e.x+=Math.cos(a)*e.speed*dt;
e.y+=Math.sin(a)*e.speed*dt;

if(e.isBoss){

updateBoss(e,dt);

}
else{

e.shoot-=dt;

if(e.shoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*130,
vy:Math.sin(a)*130,

r:6,
life:5,

damage:15

});

e.shoot=2.5;

}

}


if(
Math.hypot(
e.x-player.x,
e.y-player.y
)
<
e.r+player.r
){

player.hp-=(e.isBoss?18+e.bossPhase*5:25);

e.x-=Math.cos(a)*25;
e.y-=Math.sin(a)*25;

}

}


// PLAYER SHOTS

for(const s of shots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
s.x<arena.left||
s.x>arena.right||
s.y<arena.top||
s.y>gameBottom
){

s.life=0;

}

}


// ENEMY SHOTS

for(const s of enemyShots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
Math.hypot(
s.x-player.x,
s.y-player.y
)
<
s.r+player.r
){

player.hp-=
s.damage!==undefined
?s.damage
:15;

s.life=0;

}

}


// COLLISIONS

for(const s of shots){

if(s.life<=0)
continue;

for(const e of enemies){

if(
e.hp>0&&
Math.hypot(
s.x-e.x,
s.y-e.y
)
<
s.r+e.r
){

e.hp-=s.damage;


// PIERCE

if(s.pierceLeft>0){

s.damage*=.5;

s.pierceLeft--;

continue;

}

s.life=0;

break;

}

}

}


// DEATHS

for(const e of enemies){

if(
e.hp<=0&&
!e.dead
){

e.dead=true;

score+=e.isBoss?100:10;

orbs.push({

x:e.x,
y:e.y

});

// Boss rewards more XP.
if(e.isBoss){

for(let i=0;i<4;i++){

orbs.push({

x:e.x+(Math.random()-.5)*30,
y:e.y+(Math.random()-.5)*30

});

}

}

}

}


// CLEANUP

shots=shots.filter(
s=>
s.life>0&&
s.x>arena.left&&
s.x<arena.right&&
s.y>arena.top&&
s.y<gameBottom
);

enemyShots=enemyShots.filter(
s=>s.life>0
);

enemies=enemies.filter(
e=>e.hp>0
);


// XP

for(const o of orbs){

const dist=
Math.hypot(
o.x-player.x,
o.y-player.y
);

const maxDistance=
Math.hypot(W,H);

const closeness=
1-Math.min(
1,
dist/maxDistance
);

const speed=
25+
Math.pow(
closeness,
2
)*475;

if(dist>.1){

o.x+=(player.x-o.x)/dist*speed*dt;
o.y+=(player.y-o.y)/dist*speed*dt;

}


if(dist<18){

o.dead=true;

xp+=25;


while(xp>=xpNext){

xp-=xpNext;

level++;

xpNext=
Math.floor(
xpNext*1.25
);


// LEVEL 2

if(level===2){

if(!player.weapon){

openWeaponChoice();

return;

}

else{

openUpgrades();

return;

}

}


// LEVEL 3+

if(level>2){

openUpgrades();

return;

}

}

}

}


orbs=orbs.filter(
o=>!o.dead
);


// GAME OVER

if(player.hp<=0){

gameOver=true;

}

}


// =========================
// WEAPON CHOICE
// =========================

function openWeaponChoice(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=true;

paused=false;

}


function chooseWeapon(i){

if(!weaponChoiceOpen)
return;

if(i===0){

equipScatterBlaster();

}
else{

equipFastPewPew();

}

weaponChoiceOpen=false;

upgradeOpen=false;

upgradeChoices=[];

shoot=0;

}


// =========================
// OPEN UPGRADES
// =========================

function openUpgrades(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;


// =========================
// SCATTER
// =========================

if(player.weapon==="scatter"){

const nextTier=
player.scatterTier+1;

const nextUpgrade=
scatterTierUpgrades.find(
u=>u.tier===nextTier
);


// Only ONE Scatter upgrade exists at a time.

if(nextUpgrade){

upgradeChoices.push(
nextUpgrade
);

upgradeOpen=true;

}

return;

}


// =========================
// FAST
// =========================

if(player.weapon==="fast"){

let pool=[
...fastPewPewUpgrades
];

while(
upgradeChoices.length<2&&
pool.length>0
){

const i=
Math.floor(
Math.random()*pool.length
);

upgradeChoices.push(
pool[i]
);

pool.splice(i,1);

}

upgradeOpen=true;

}

}


// =========================
// CHOOSE UPGRADE
// =========================

function chooseUpgrade(i){

if(
!upgradeOpen||
!upgradeChoices[i]
)
return;


upgradeChoices[i].apply();

shots=[];
enemyShots=[];

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;

shoot=0;

}

// PAUSE
// =========================

function togglePause(){

if(
!started||
gameOver||
upgradeOpen||
weaponChoiceOpen
)
return;

paused=!paused;

}

ctx.font="bold 38px system-ui";

ctx.fillText(
"GAME OVER",
W/2,
H/2-45
);

ctx.fillStyle="#fff";

ctx.font="bold 18px system-ui";

ctx.fillText(
"SCORE "+score,
W/2,
H/2
);

ctx.fillStyle="#9aa6b8";

ctx.font="14px system-ui";

ctx.fillText(
"Tap to restart",
W/2,
H/2+45
);

}


ctx.textAlign="left";

}


// =========================
// GAME LOOP
// =========================

function loop(t){

const dt=
Math.min(
.033,
(t-last)/1000||0
);

last=t;

update(dt);

draw();

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
