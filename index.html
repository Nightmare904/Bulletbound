"use strict";

/* =========================================================
   CANVAS
========================================================= */

const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W=0;
let H=0;
let dpr=1;

function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;
    H=window.innerHeight;
    c.width=Math.floor(W*dpr);
    c.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    updateArena();
    joystickPos();
    aimJoystickPos();
}

window.addEventListener("resize",resize);


/* =========================================================
   MEASUREMENT SYSTEM
   1 UNIT = the size (width) of a normal enemy.
   Normal enemies have a radius of ENEMY_R, so one unit is
   ENEMY_R*2 world pixels (measured before the camera zoom).
   Use units(n) to express any distance in units.
========================================================= */

const ENEMY_R=14;
const UNIT=ENEMY_R*2;

function units(n){
    return n*UNIT;
}


/* =========================================================
   ARENA
========================================================= */

const arena={left:14,right:0,top:72,bottom:0};

let gameBottom=0;
let controlTop=0;

/* Screen-space top margin where the play viewport begins (below the
   HUD). Fixed UI elements (pause button etc) anchor to this, not to
   the zoomed-out world-space arena.top. */
const VIEW_TOP=72;

/* CAMERA / ZOOM
   The world is rendered at CAMERA_SCALE (<1 = zoomed out), so
   everything looks smaller/farther away, but the play viewport still
   fills the same on-screen rectangle. To compensate, the world-space
   arena bounds are enlarged by 1/CAMERA_SCALE around the viewport's
   center, so there's proportionally more room to move in - movement
   speed, sizes, damage etc all stay numerically the same. */

const CAMERA_SCALE=0.72;

let camCenterX=0;
let camCenterY=0;

function updateArena(){
    const controlHeight=Math.min(185,Math.max(150,H*.23));
    controlTop=H-controlHeight;

    /* On-screen play viewport (unscaled screen pixels) */
    const viewLeft=14;
    const viewRight=W-14;
    const viewTop=VIEW_TOP;
    const viewBottom=controlTop-8;

    camCenterX=(viewLeft+viewRight)/2;
    camCenterY=(viewTop+viewBottom)/2;

    const halfW=(viewRight-viewLeft)/2/CAMERA_SCALE;
    const halfH=(viewBottom-viewTop)/2/CAMERA_SCALE;

    /* World-space arena bounds (larger than the viewport) */
    arena.left=camCenterX-halfW;
    arena.right=camCenterX+halfW;
    arena.top=camCenterY-halfH;

    gameBottom=camCenterY+halfH;
}

   PLAYER
========================================================= */

/* =========================================================
   JOYSTICKS
========================================================= */

const joy={on:false,x:0,y:0,tx:0,ty:0,dx:0,dy:0,r:29,knobR:12};
const aimJoy={on:false,x:0,y:0,tx:0,ty:0,dx:1,dy:0,r:29,knobR:12};

let moveTouchId=null;
let aimTouchId=null;

function joystickPos(){
    const controlHeight=H-controlTop;
    const controlY=controlTop+controlHeight/2;
    const side=joy.r+10;
    joy.x=side;
    joy.y=controlY;
}

function aimJoystickPos(){
    const controlHeight=H-controlTop;
    const controlY=controlTop+controlHeight/2;
    const side=aimJoy.r+10;
    aimJoy.x=W-side;
    aimJoy.y=controlY;
}

function resetJoysticks(){
    moveTouchId=null;
    aimTouchId=null;

    joy.on=false;
    joy.tx=0;joy.ty=0;
    joy.dx=0;joy.dy=0;

    aimJoy.on=false;
    aimJoy.tx=0;aimJoy.ty=0;
    aimJoy.dx=1;aimJoy.dy=0;
}


/* =========================================================
   WEAPONS
========================================================= */

/* Scatter cone: radians between neighbouring pellets.
   Originally .055, now reduced by 25%. */
const SCATTER_SPREAD=.055*.75;

function equipScatterBlaster(){
    player.weapon="scatter";
    player.shots=1;
    player.damage=20;
    player.scatterTier=1;
    player.scatterPierce=false;
    player.scatterDamage=20;
    player.scatterFireRate=3;
    player.fireRate=3;
    player.bulletSpeed=480;
    shoot=0;
}

/* FAST PEW PEW
   Auto = default cooldown, Semi = half speed (double cooldown). */

const FAST_BASE_COOLDOWN=.40;

function fastCooldown(){
    /* Tier 6 doubles attack speed (halves cooldown) in both modes */
    const tierMult=player.fastTier>=6?.5:1;
    return FAST_BASE_COOLDOWN*(player.fireMode==="semi"?2:1)*tierMult;
}

function equipFastPewPew(){
    player.weapon="fast";
    player.fastTier=1;
    player.shots=1;
    player.damage=10;
    player.fireRate=fastCooldown();
    player.bulletSpeed=480;
    player.maxAmmo=5;
    player.ammo=5;
    player.reloadTime=2;
    player.reloadTimer=0;
    player.reloading=false;
    shoot=0;
}

function applyEquippedWeapon(){
    if(equippedWeapon==="scatter") equipScatterBlaster();
    if(equippedWeapon==="fast") equipFastPewPew();
}

/* =========================================================
   WALK SPEED UPGRADES (both weapons)
   Tier 6 also unlocks the DASH button.
========================================================= */

const BASE_WALK_SPEED=110;

/* index = tier. NOTE: tier 4 wasn't specified, so it sits
   halfway between tier 3 (45%) and tier 5 (60%). */
const WALK_BONUS=[0,.15,.30,.45,.525,.60,.60];

const DASH_TIME=.16;       /* seconds the dash lasts (= immunity) */
const DASH_SPEED=950;      /* px/sec, about 150px total */
const DASH_COOLDOWN=2.5;   /* seconds between dashes */

function makeWalkTier(t,desc){
    return{
        tier:t,
        name:"Walk Speed Tier "+t,
        desc:desc,
        apply:()=>{
            player.walkTier=t;
            player.speed=BASE_WALK_SPEED*(1+WALK_BONUS[t]);
        }
    };
}

const walkSpeedUpgrades=[
    makeWalkTier(1,"Increase walk speed by 15%."),
    makeWalkTier(2,"Walk speed bonus increases from 15% to 30%."),
    makeWalkTier(3,"Walk speed bonus increases from 30% to 45%."),
    makeWalkTier(4,"Walk speed bonus increases from 45% to 52.5%."),
    makeWalkTier(5,"Walk speed bonus increases from 52.5% to 60%."),
    makeWalkTier(6,"Unlocks a DASH button. Rush forward in your movement direction, passing through bullets and enemies unharmed until the dash ends.")
];

function nextWalkUpgrade(){
    return walkSpeedUpgrades[player.walkTier]||null;
}


/* =========================================================
   DASH
========================================================= */

function tryDash(){

    if(player.walkTier<6) return false;
    if(!started||gameOver||paused||upgradeOpen||weaponChoiceOpen) return false;
    if(player.dashTimer>0||player.dashCd>0) return false;

    let dx=joy.dx;
    let dy=joy.dy;
    const m=Math.hypot(dx,dy);

    if(m>.1){
        dx/=m;
        dy/=m;
    }
    else if(player.lastMoveX!==0||player.lastMoveY!==0){
        dx=player.lastMoveX;
        dy=player.lastMoveY;
    }
    else{
        dx=Math.cos(player.aim);
        dy=Math.sin(player.aim);
    }

    player.dashDx=dx;
    player.dashDy=dy;
    player.dashFromX=player.x;
    player.dashFromY=player.y;

    player.dashTimer=DASH_TIME;
    player.dashCd=DASH_COOLDOWN;

    return true;
}

/* Dash button sits just left of the aim stick */
/* Button layout: compact buttons packed tightly beside each stick.
   Right side, moving away from the aim stick: LIGHTNING, then DASH.
   Left side: FIRE MODE. Slots are fixed so buttons never shift. */
const BTN_R=30;
const BTN_GAP=8;
const BTN_SLOP=4;

function getLightningButton(){
    return{x:aimJoy.x-aimJoy.r-BTN_GAP-BTN_R,y:aimJoy.y,r:BTN_R};
}

function getDashButton(){
    return{x:aimJoy.x-aimJoy.r-BTN_GAP-BTN_R-(BTN_R*2+BTN_GAP),y:aimJoy.y,r:BTN_R};
}

function hitDashButton(x,y){
    if(player.walkTier<6) return false;
    const b=getDashButton();
    return Math.hypot(x-b.x,y-b.y)<=b.r+BTN_SLOP;
}

function hitLightningButton(x,y){
    if(!started||player.lightTier<=0) return false;
    const b=getLightningButton();
    return Math.hypot(x-b.x,y-b.y)<=b.r+BTN_SLOP;
}

function toggleLightningMode(){
    if(!started||player.lightTier<=0) return false;
    player.lightMode=player.lightMode==="enemy"?"bullet":"enemy";
    return true;
}


/* =========================================================
   FIRE MODE BUTTON (Fast Pew Pew only)
   Sits just right of the movement stick.
========================================================= */

function toggleFireMode(){
    if(player.weapon!=="fast") return false;
    player.fireMode=player.fireMode==="auto"?"semi":"auto";
    player.fireRate=fastCooldown();
    return true;
}

function getFireModeButton(){
    return{x:joy.x+joy.r+BTN_GAP+BTN_R,y:joy.y,r:BTN_R};
}

function hitFireModeButton(x,y){
    if(!started||player.weapon!=="fast") return false;
    const b=getFireModeButton();
    return Math.hypot(x-b.x,y-b.y)<=b.r+BTN_SLOP;
}


/* =========================================================
   LIGHTNING
   Instant line-flash "bolts". Two modes (toggle button):
   ENEMY  - damages + stuns the nearest enemy, then chains to every
            enemy touching it (no chain limit, never the same enemy
            twice per bolt).
   BULLET - destroys the nearest enemy bullet, then every bullet hit
            checks 2 UNITS around itself and chains to any bullet in
            that range (bullets don't have to touch). Each newly hit
            bullet repeats the check, so a chain can cross the whole
            map. Large boss bullets chain the same way (with a slightly
            larger range) and are destroyed too. No damage / no stun.

   MAGNETIZE - from Lightning tier 4 up, every enemy a bolt hits is
            magnetized for 5 seconds. Bullets near a magnetized enemy
            are pulled toward it, but keep flying in the direction
            they were fired, so only their final destination shifts.
========================================================= */

/* Fixed distance (world px), roughly 3.6 units. Intentionally NOT
   tied to the Spike Ring's orbit distance, so ring upgrades never
   change lightning range. */
const LIGHTNING_RANGE=100;

const LIGHTNING_TOUCH_PAD=3;         /* slack (px) for "touching" (enemy mode) */
const LIGHTNING_BULLET_CHAIN=units(2);  /* bullet mode: chain range = 2 units */
const LIGHTNING_BIG_BULLET_CHAIN=60;    /* large boss bullets: old magnet range (120) cut by 50% */

/* Magnetized enemies (Lightning tier 4+) */
const MAGNET_MIN_TIER=4;
const MAGNET_DURATION=5;                /* seconds */
const MAGNET_RANGE=units(4);            /* how far a magnetized enemy pulls bullets */
const MAGNET_ACCEL=900;                 /* pull strength (fades toward the edge of the range) */
const MAGNET_PULL_MAX=160;              /* cap on the sideways pull speed */
const LIGHTNING_STUN_LOCK=2;         /* seconds after a stun ends before re-stun */
const LIGHTNING_FLASH=.22;           /* how long a bolt stays on screen */

let lightningBolts=[];

function newBolt(bullet){
    return{lines:[],life:LIGHTNING_FLASH,maxLife:LIGHTNING_FLASH,bullet:bullet};
}

function addBoltLine(bolt,x1,y1,x2,y2){

    const pts=[{x:x1,y:y1}];

    const dx=x2-x1;
    const dy=y2-y1;
    const len=Math.hypot(dx,dy)||1;
    const segs=Math.max(2,Math.round(len/14));
    const nx=-dy/len;
    const ny=dx/len;

    for(let i=1;i<segs;i++){
        const t=i/segs;
        const off=(Math.random()-.5)*12;
        pts.push({x:x1+dx*t+nx*off,y:y1+dy*t+ny*off});
    }

    pts.push({x:x2,y:y2});

    bolt.lines.push(pts);
}

function lightningHitEnemy(e){

    if(e.hp<=0) return;

    e.hp-=player.lightDamage;

    /* Magnetize (tier 4+): every hit refreshes the full duration */
    if(player.lightTier>=MAGNET_MIN_TIER){
        e.magnet=MAGNET_DURATION;
        if(e.sparkSeed===undefined) e.sparkSeed=Math.random()*100;
    }

    /* Stun: can't be re-stunned until 2s after the previous stun ends */
    if(player.lightStun>0 && !(e.stunLock>0)){
        e.stun=player.lightStun;
        e.stunLock=player.lightStun+LIGHTNING_STUN_LOCK;
    }

    if(e.hp<=0){

        score+=e.isBoss?100:10;

        orbs.push({x:e.x,y:e.y,r:6,value:20});

        if(e.isBoss){
            for(let i=0;i<4;i++){
                orbs.push({
                    x:e.x+(Math.random()-.5)*50,
                    y:e.y+(Math.random()-.5)*50,
                    r:6,
                    value:20
                });
            }
        }
    }
}

/* Returns how many bolts were fired */
function lightningStrikeEnemies(){

    let fired=0;

    for(let b=0;b<player.lightBolts;b++){

        /* Closest living enemy in range. Damage is instant, so an enemy
           an earlier bolt killed is already dead and the next bolt
           picks a different target instead of wasting damage. Bolts
           can still stack on one enemy while it survives. */

        let best=null;
        let bestD=Infinity;

        for(const e of enemies){

            if(e.hp<=0) continue;

            const d=Math.hypot(e.x-player.x,e.y-player.y);

            if(d-e.r>LIGHTNING_RANGE) continue;

            if(d<bestD){
                bestD=d;
                best=e;
            }
        }

        if(!best) break;

        fired++;

        const bolt=newBolt(false);

        addBoltLine(bolt,player.x,player.y,best.x,best.y);
        lightningHitEnemy(best);

        const visited=new Set([best]);
        const queue=[best];

        while(queue.length){

            const cur=queue.shift();

            for(const o of enemies){

                if(visited.has(o) || o.hp<=0) continue;

                const d=Math.hypot(o.x-cur.x,o.y-cur.y);

                if(d<cur.r+o.r+LIGHTNING_TOUCH_PAD){

                    visited.add(o);

                    addBoltLine(bolt,cur.x,cur.y,o.x,o.y);
                    lightningHitEnemy(o);

                    queue.push(o);
                }
            }
        }

        lightningBolts.push(bolt);
    }

    return fired;
}

function lightningStrikeBullets(){

    let fired=0;

    /* Every bullet a bolt reaches (large boss bullets included) is
       destroyed and then checks a circle around itself for more
       bullets. Regular bullets check 2 units; large boss bullets check
       a slightly larger range. Bullets only need to be in range, not
       touching. Every newly hit bullet repeats the check, so the chain
       keeps going as long as bullets are within range of each other. */

    function chainRange(sh){
        return sh.bigBossShot?LIGHTNING_BIG_BULLET_CHAIN:LIGHTNING_BULLET_CHAIN;
    }

    function nearestBullet(ox,oy){

        let best=null;
        let bestD=Infinity;

        for(const sh of enemyShots){

            if(sh.life<=0 || sh.bouncer) continue;

            const d=Math.hypot(sh.x-ox,sh.y-oy);

            if(d>LIGHTNING_RANGE) continue;

            if(d<bestD){
                bestD=d;
                best=sh;
            }
        }

        return best;
    }

    function zapChain(bolt,first,fromX,fromY){

        addBoltLine(bolt,fromX,fromY,first.x,first.y);
        first.life=0;

        const visited=new Set([first]);
        const queue=[first];

        while(queue.length){

            const cur=queue.shift();
            const range=chainRange(cur);

            for(const o of enemyShots){

                if(visited.has(o) || o.life<=0 || o.bouncer) continue;

                const d=Math.hypot(o.x-cur.x,o.y-cur.y);

                if(d<=range){

                    visited.add(o);

                    addBoltLine(bolt,cur.x,cur.y,o.x,o.y);
                    o.life=0;

                    queue.push(o);
                }
            }
        }
    }

    for(let b=0;b<player.lightBolts;b++){

        const best=nearestBullet(player.x,player.y);

        if(!best) break;

        fired++;

        const bolt=newBolt(true);

        zapChain(bolt,best,player.x,player.y);

        lightningBolts.push(bolt);
    }

    /* Destroyed bullets go away immediately */
    enemyShots=enemyShots.filter(sh=>sh.life>0);

    return fired;
}

function updateLightning(dt){

    for(const b of lightningBolts) b.life-=dt;
    lightningBolts=lightningBolts.filter(b=>b.life>0);

    if(player.lightTier<=0) return;

    if(player.lightCd>0) player.lightCd-=dt;
    if(player.lightCd>0) return;

    player.lightCd=0;

    const fired=player.lightMode==="bullet"
        ? lightningStrikeBullets()
        : lightningStrikeEnemies();

    /* Only spend the cooldown if something was actually zapped */
    if(fired>0) player.lightCd=player.lightCooldown;
}

/* Lightning is its own upgrade track. Tier 1 unlocks it. */

function makeLightningTier(t,name,desc,dmg,cd,stun,bolts){
    return{
        tier:t,
        name:name,
        desc:desc,
        apply:()=>{
            player.lightTier=t;
            player.lightDamage=dmg;
            player.lightCooldown=cd;
            player.lightStun=stun;
            player.lightBolts=bolts;
            player.lightCd=Math.min(player.lightCd,cd);
        }
    };
}

const BOSS_PHASE3_HP=BOSS_MAX_HP*.50;   /* 5000 - phase 3 starts at or below this */
const BOSS_PHASE4_HP=BOSS_MAX_HP*.25;   /* 2500 - phase 4: the boss splits in two */

/* =========================================================
   BOSS AI
========================================================= */

/* Boss large bullets are twice their old size (radius 7 -> 14).
   Phase 3 large bullets home in on the player. They are no longer
   magnetic - magnetism now belongs to lightning-magnetized enemies. */
const BOSS_BIG_R=14;
const BOSS_BIG_SPEED=90;         /* phase 1-2 large bullet speed */
const BOSS_HOMING_SPEED=45;      /* was 90 - now half as fast */
const BOSS_HOMING_TURN=1.1;      /* rad/sec - limited so it can be dodged */
const BOSS_HOMING_LIFE=6;        /* seconds (also destroyed at the arena edge) */
const BOSS_HOMING_SPREAD=.35;    /* radians between the 3 balls */

/* BOUNCERS
   After every phase the boss spawns one. Twice the size of a large
   bullet, same speed as the large bullets of that phase, infinite
   life. They bounce off the walls, ignore lightning and can only be
   destroyed once the boss is dead. Every 6s each one fires a burst of
   5 bullets in all directions. Touching one hurts, with a short
   cooldown per bouncer so it can't shred you in a single frame. */
const BOUNCER_R=BOSS_BIG_R*2;
const BOUNCER_DAMAGE=50;
const BOUNCER_HIT_COOLDOWN=1.5;   /* seconds between hits from the same bouncer */
const BOUNCER_FIRE_INTERVAL=6;    /* seconds between bursts */
const BOUNCER_BURST=5;            /* bullets per burst */
const BOUNCER_BULLET_SPEED=110;
const BOUNCER_BULLET_R=4;

/* PHASE 4 SPLIT: two smaller copies with a fixed health each */
const BOSS_COPY_HP=1250;
const BOSS_COPY_R=20;             /* original boss is 28 */
const BOSS_COPY_OFFSET=36;        /* how far apart they appear */

/* Large bullets move at 90 in phases 1-2 and 45 (homing) from phase 3 */
function bigBulletSpeed(phase){
    return phase>=3?BOSS_HOMING_SPEED:BOSS_BIG_SPEED;
}

function bossBullet(e,a,speed,r,dmg,big){

    const b={
        x:e.x,
        y:e.y,
        vx:Math.cos(a)*speed,
        vy:Math.sin(a)*speed,
        r:r,
        life:9,
        damage:dmg,
        bossShot:!big,
        bigBossShot:!!big,
        src:e
    };

    enemyShots.push(b);

    return b;
}

/* Ring with a gap the player has to find */
function bossRing(e,count,speed){
    const start=Math.random()*Math.PI*2;
    for(let i=3;i<count;i++){   /* skips 3 bullets = the gap */
        bossBullet(e,start+(Math.PI*2/count)*i,speed,3.5,10,false);
    }
}

function spawnBouncer(e,phase){

    const a=Math.atan2(player.y-e.y,player.x-e.x);
    const sp=bigBulletSpeed(phase);

    enemyShots.push({
        x:e.x,
        y:e.y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        r:BOUNCER_R,
        life:Infinity,
        damage:BOUNCER_DAMAGE,
        bossShot:false,
        bigBossShot:false,
        bouncer:true,
        fireTimer:BOUNCER_FIRE_INTERVAL,
        hitCd:1          /* brief grace period right after spawning */
    });
}

function fireBouncerBurst(b){

    const start=Math.random()*Math.PI*2;

    for(let i=0;i<BOUNCER_BURST;i++){

        const a=start+i*(Math.PI*2/BOUNCER_BURST);

        enemyShots.push({
            x:b.x+Math.cos(a)*b.r,
            y:b.y+Math.sin(a)*b.r,
            vx:Math.cos(a)*BOUNCER_BULLET_SPEED,
            vy:Math.sin(a)*BOUNCER_BULLET_SPEED,
            r:BOUNCER_BULLET_R,
            life:9,
            damage:10,
            bossShot:true,
            bigBossShot:false
        });
    }
}

/* Phase 4: the boss is replaced by two smaller copies. They behave
   like the phase 4 boss (same attacks, no summons) with a set health. */
function splitBoss(e){

    const a=Math.atan2(player.y-e.y,player.x-e.x)+Math.PI/2;

    for(const side of [-1,1]){

        enemies.push({
            x:e.x+Math.cos(a)*side*BOSS_COPY_OFFSET,
            y:e.y+Math.sin(a)*side*BOSS_COPY_OFFSET,
            r:BOSS_COPY_R,

            hp:BOSS_COPY_HP,
            maxHp:BOSS_COPY_HP,

            speed:32,

            color:e.color,
            isBoss:true,
            isCopy:true,

            phase:4,
            fanTimer:1.5,
            ringTimer:4,
            bigTimer:3,
            chargeTimer:4,
            summonTimer:0,
            spiralA:Math.random()*Math.PI*2,
            spiralClock:0,
            spiralTimer:0,
            charging:0,
            dashing:0,
            dashA:0,
            dashHit:false
        });
    }

    /* the original is gone (no score / orbs - it didn't die, it split) */
    e.hp=0;
}

function bossUpdate(e,dt){

    const phase=e.hp>BOSS_PHASE2_HP?1:(e.hp>BOSS_PHASE3_HP?2:(e.hp>BOSS_PHASE4_HP?3:4));

    /* Phase change: burst + reset timers + a new bouncer */
    if(phase!==e.phase){
        e.phase=phase;
        e.charging=0;
        e.dashing=0;
        e.fanTimer=1.5;
        e.ringTimer=4;
        e.bigTimer=3;
        e.chargeTimer=4;
        e.summonTimer=6;
        bossRing(e,32,120);

        /* After every phase the boss spawns a bouncer */
        spawnBouncer(e,phase);

        /* Phase 4: no summons - the boss splits into two copies */
        if(phase===4 && !e.isCopy){
            splitBoss(e);
            return;
        }
    }

    const dx=player.x-e.x;
    const dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    const toPlayer=Math.atan2(dy,dx);

    /* ---------- MOVEMENT ---------- */

    if(e.charging>0){                       /* telegraph: frozen, locked aim */
        e.charging-=dt;
        if(e.charging<=0){
            e.dashing=.6;
            e.dashHit=false;
        }
    }
    else if(e.dashing>0){                   /* the actual dash */
        e.dashing-=dt;
        e.x+=Math.cos(e.dashA)*460*dt;
        e.y+=Math.sin(e.dashA)*460*dt;

        if(!e.dashHit && player.dashTimer<=0 && d<e.r+player.r){
            player.hp-=35;
            e.dashHit=true;
        }
    }
    else{
        /* Stops closing in once nearly on top of the player, so its
           bullets don't all spawn stacked on top of them */
        if(d>e.r*.9){
            const sp=[0,32,42,54,54][phase];
            e.x+=dx/d*sp*dt;
            e.y+=dy/d*sp*dt;
        }
    }

    e.x=Math.max(arena.left+e.r,Math.min(arena.right-e.r,e.x));
    e.y=Math.max(arena.top+e.r,Math.min(gameBottom-e.r,e.y));

    if(e.charging>0||e.dashing>0) return;   /* no shooting mid-charge */

    /* ---------- ATTACKS ---------- */

    const rate=[0,1,1.3,1.7,1.7][phase];

    /* Aimed fan: 3 / 5 / 7 bullets */
    e.fanTimer-=dt;
    if(e.fanTimer<=0){
        const n=[0,3,5,7,7][phase];
        for(let i=0;i<n;i++){
            bossBullet(e,toPlayer+(i-(n-1)/2)*.22,150,3,10,false);
        }
        e.fanTimer=2/rate;
    }

    /* Ring with a gap */
    e.ringTimer-=dt;
    if(e.ringTimer<=0){
        bossRing(e,28,105);
        e.ringTimer=4.5/rate;
    }

    /* Big slow shot (50 dmg).
       Phase 2+: fires twice as fast.
       Phase 3+: fires 3 at a time; they home in on the player (turn rate
       is limited) and move at half the old speed. They only die at the
       arena edge or when their life runs out. All large bullets are 2x
       their old size. */
    e.bigTimer-=dt;
    if(e.bigTimer<=0){

        if(phase>=3){

            for(let i=-1;i<=1;i++){
                const b=bossBullet(e,toPlayer+i*BOSS_HOMING_SPREAD,BOSS_HOMING_SPEED,BOSS_BIG_R,50,true);
                b.homing=true;
                b.life=BOSS_HOMING_LIFE;
            }
        }
        else{
            bossBullet(e,toPlayer,BOSS_BIG_SPEED,BOSS_BIG_R,50,true);
        }

        e.bigTimer=(phase>=2?1.5:3)/rate;
    }

    /* Phase 2+: spiral bursts (2.5s on, 3.5s off) */
    if(phase>=2){

        e.spiralClock+=dt;
        e.spiralTimer-=dt;

        if((e.spiralClock%6)<2.5 && e.spiralTimer<=0){
            bossBullet(e,e.spiralA,130,3,10,false);
            bossBullet(e,e.spiralA+Math.PI,130,3,10,false);
            e.spiralA+=.42;
            e.spiralTimer=.09;
        }

        /* Telegraphed charge */
        e.chargeTimer-=dt;
        if(e.chargeTimer<=0){
            e.charging=.9;
            e.dashA=toPlayer;               /* aim locks at the start */
            e.chargeTimer=phase>=3?5:7;
        }
    }

    /* Phase 3 only: summon adds (phase 4 splits instead) */
    if(phase===3){
        e.summonTimer-=dt;
        if(e.summonTimer<=0){
            for(let i=0;i<3;i++){
                enemies.push({
                    x:e.x+(Math.random()-.5)*80,
                    y:e.y+(Math.random()-.5)*80,
                    r:ENEMY_R,
                    hp:100,
                    maxHp:100,
                    speed:getWaveEnemySpeed(wave)*1.5,
                    shoot:1,
                    color:"#a66cff",
                    isBoss:false
                });
            }
            e.summonTimer=12;
        }
    }
}


/* =========================================================
   CLOSEST ENEMY
========================================================= */

function getClosestEnemy(){

    let best=null;
    let bestD=Infinity;

    for(const e of enemies){
        const dx=e.x-player.x;
        const dy=e.y-player.y;
        const d=dx*dx+dy*dy;
        if(d<bestD){
            bestD=d;
            best=e;
        }
    }

    return best;
}


/* =========================================================
   FIRING
========================================================= */

function fireBase(){

    if(shoot>0) return;

    const a=player.aim;

    shots.push({
        x:player.x+Math.cos(a)*14,
        y:player.y+Math.sin(a)*14,
        vx:Math.cos(a)*player.bulletSpeed,
        vy:Math.sin(a)*player.bulletSpeed,
        r:5,
        life:1.5,
        damage:player.damage,
        pierceLeft:0
    });

    shoot=player.fireRate;
}

function startFastReload(){

    if(player.reloading) return;

    player.ammo=0;
    player.reloading=true;
    player.reloadTimer=player.reloadTime;
}

function fireFast(){

    if(player.weapon!=="fast") return;
    if(player.reloading) return;
    if(shoot>0) return;

    if(player.ammo<=0){
        startFastReload();
        return;
    }

    const count=player.shots;

    for(let i=0;i<count;i++){

        let offset=0;

        if(count>1){
            offset=(i-(count-1)/2)*.18;
        }

        const a=player.aim+offset;

        shots.push({
            x:player.x+Math.cos(a)*14,
            y:player.y+Math.sin(a)*14,
            vx:Math.cos(a)*player.bulletSpeed,
            vy:Math.sin(a)*player.bulletSpeed,
            r:5,
            life:1.5,
            damage:player.damage,
            pierceLeft:0
        });
    }

    player.ammo--;

    shoot=fastCooldown();

    if(player.ammo<=0){
        startFastReload();
    }
}

function fireScatter(){

    if(player.weapon!=="scatter") return;
    if(shoot>0) return;

    const count=player.shots;

    for(let i=0;i<count;i++){

        let offset=0;

        if(count>1){
            offset=(i-(count-1)/2)*SCATTER_SPREAD;
        }

        const a=player.aim+offset;

        shots.push({
            x:player.x+Math.cos(a)*14,
            y:player.y+Math.sin(a)*14,
            vx:Math.cos(a)*player.bulletSpeed,
            vy:Math.sin(a)*player.bulletSpeed,
            r:5,
            life:1.5,
            damage:player.scatterDamage,
            pierceLeft:player.scatterPierce?1:0
        });
    }

    shoot=player.scatterFireRate;
}

function fireCurrentWeapon(){
    if(player.weapon==="fast") fireFast();
    else if(player.weapon==="scatter") fireScatter();
    else fireBase();
}


/* =========================================================
   TOUCH HELPERS
========================================================= */

function setJoystick(j,touch){

    let dx=touch.clientX-j.x;
    let dy=touch.clientY-j.y;

    const d=Math.hypot(dx,dy);

    if(d>j.r){
        dx/=d;
        dy/=d;
        dx*=j.r;
        dy*=j.r;
    }

    j.tx=dx;
    j.ty=dy;

    if(d>4){
        j.dx=dx/j.r;
        j.dy=dy/j.r;
    }
    else{
        j.dx=0;
        j.dy=0;
    }
}

function beginAimTouch(touch){

    const dx=touch.clientX-aimJoy.x;
    const dy=touch.clientY-aimJoy.y;

    if(Math.hypot(dx,dy)>aimJoy.r+30){
        return false;
    }

    aimTouchId=touch.identifier;

    aimJoy.on=true;

    setJoystick(aimJoy,touch);

    player.aimTarget=Math.atan2(aimJoy.dy,aimJoy.dx);

    fireCurrentWeapon();

    return true;
}

function beginMoveTouch(touch){

    const dx=touch.clientX-joy.x;
    const dy=touch.clientY-joy.y;

    if(Math.hypot(dx,dy)>joy.r+30){
        return false;
    }

    moveTouchId=touch.identifier;

    joy.on=true;

    setJoystick(joy,touch);

    return true;
}

function getWeaponCardRects(){

    const portrait=H>W;
    const count=WEAPON_KEYS.length;

    if(portrait){

        const w=Math.min(330,W-40);
        const gap=10;
        const available=Math.max(300,H-130);
        let h=(available-gap*(count-1))/count;
        h=Math.max(120,Math.min(175,h));
        const total=h*count+gap*(count-1);

        const rects=[];
        for(let i=0;i<count;i++){
            rects.push({x:(W-w)/2,y:startY+i*(h+gap),w:w,h:h});
        }
        return rects;
    }

    const gap=14;
    const w=Math.min(230,(W-70-gap*(count-1))/count);
    const h=175;
    const total=w*count+gap*(count-1);
    const startX=(W-total)/2;
    const y=(H-h)/2+15;

    const rects=[];
    for(let i=0;i<count;i++){
        rects.push({x:startX+i*(w+gap),y:y,w:w,h:h});
    }
    return rects;
}

function pointInRect(x,y,r){
    return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;
}

function pointInCard(x,y,card){
    return pointInRect(x,y,card);
}

function getUpgradeCardRects(){

    const n=upgradeChoices.length;

    if(n<=1){

        const w=Math.min(430,W-40);
        const h=190;

        return[{x:(W-w)/2,y:(H-h)/2,w:w,h:h}];
    }

    const portrait=H>W;

    if(portrait){

        const w=Math.min(360,W-40);
        const gap=12;
        const available=Math.max(280,H-140);
        let h=(available-gap*(n-1))/n;
        h=Math.max(n>=4?120:130,Math.min(190,h));
        const total=h*n+gap*(n-1);
        const startY=Math.max(96,(H-total)/2);

        const rects=[];
        for(let i=0;i<n;i++){
            rects.push({x:(W-w)/2,y:startY+i*(h+gap),w:w,h:h});
        }
        return rects;
    }

    const gap=14;
    const w=Math.min(270,(W-70-gap*(n-1))/n);
    const h=190;
    const total=w*n+gap*(n-1);
    const startX=(W-total)/2;

    const rects=[];
    for(let i=0;i<n;i++){
        rects.push({x:startX+i*(w+gap),y:(H-h)/2,w:w,h:h});
    }
    return rects;
}

function pointInUpgradeCard(x,y,card){
    return pointInRect(x,y,card);
}

function getPauseRect(){
    return{x:W-62,y:VIEW_TOP+10,w:46,h:34};
}

function getGameOverRect(){
    return{x:W/2-130,y:H/2+35,w:260,h:55};
}

/* =========================================================
   UPGRADES
========================================================= */

function openUpgrades(){

    upgradeChoices=[];

    weaponChoiceOpen=false;

    /* Four independent upgrade tracks: your weapon, walk speed,
       the Spike Ring, and Lightning. One offer from each track shows up per
       level (skipped if that track is maxed out or unavailable). */

    if(player.weapon==="scatter"){

        const next=scatterTierUpgrades.find(
            u=>u.tier===player.scatterTier+1
        );

        if(next) upgradeChoices.push(next);
    }
    else if(player.weapon==="fast"){

        /* Branching: only the tier right after your current one */
        const next=fastTierUpgrades.find(
            u=>u.tier===player.fastTier+1
        );

        if(next) upgradeChoices.push(next);
    }

    const walk=nextWalkUpgrade();
    if(walk) upgradeChoices.push(walk);

    const ring=nextRingUpgrade();
    if(ring) upgradeChoices.push(ring);

    const lightning=nextLightningUpgrade();
    if(lightning) upgradeChoices.push(lightning);

    if(upgradeChoices.length>0){
        upgradeOpen=true;
    }
}

function chooseUpgrade(i){

    const choice=upgradeChoices[i];

    if(!choice) return;

    choice.apply();

    shots=[];
    enemyShots=enemyShots.filter(s=>s.bouncer);   /* bouncers only die with the boss */

    upgradeChoices=[];
    upgradeOpen=false;

    shoot=0;
}

/* =========================================================
   ENEMY MAGNETS
   Enemies hit by Lightning tier 4+ are magnetized for 5 seconds.
   Bullets in range are pulled toward them. The pull is a separate
   drift (pvx/pvy) added on top of the bullet's own velocity, so the
   bullet still travels the way it was fired - it just ends up
   somewhere else. A bullet is never pulled by the enemy that fired it.
========================================================= */

function pullBullet(s,e,dt){

    if(s.life<=0 || s.src===e || s.bouncer) return;

    const dx=e.x-s.x;
    const dy=e.y-s.y;
    const d=Math.hypot(dx,dy);

    if(d>=MAGNET_RANGE || d<1) return;

    /* stronger the closer the bullet is */
    const strength=1-d/MAGNET_RANGE;

    s.pvx=(s.pvx||0)+dx/d*MAGNET_ACCEL*strength*dt;
    s.pvy=(s.pvy||0)+dy/d*MAGNET_ACCEL*strength*dt;

    const sp=Math.hypot(s.pvx,s.pvy);

    if(sp>MAGNET_PULL_MAX){
        s.pvx*=MAGNET_PULL_MAX/sp;
        s.pvy*=MAGNET_PULL_MAX/sp;
    }
}

function updateEnemyMagnets(dt){

    for(const e of enemies){

        if(!(e.magnet>0) || e.hp<=0) continue;

        for(const s of shots) pullBullet(s,e,dt);
        for(const s of enemyShots) pullBullet(s,e,dt);
    }
}


/* =========================================================
   PROJECTILE UPDATE
   (independent of wave breaks)
========================================================= */

function updateProjectiles(dt){

    /* PLAYER PROJECTILES */

    for(const s of shots){

        s.x+=(s.vx+(s.pvx||0))*dt;
        s.y+=(s.vy+(s.pvy||0))*dt;

        s.life-=dt;

        for(const e of enemies){

            if(e.hp<=0) continue;

            const dx=e.x-s.x;
            const dy=e.y-s.y;

            const d=Math.hypot(dx,dy);

            if(d<e.r+s.r){

                e.hp-=s.damage;

                if(s.pierceLeft>0){
                    s.pierceLeft--;
                    s.damage*=.5;
                }
                else{
                    s.life=0;
                }

                if(e.hp<=0){

                    score+=e.isBoss?100:10;

                    orbs.push({x:e.x,y:e.y,r:6,value:20});

                    if(e.isBoss){
                        for(let i=0;i<4;i++){
                            orbs.push({
                                x:e.x+(Math.random()-.5)*50,
                                y:e.y+(Math.random()-.5)*50,
                                r:6,
                                value:20
                            });
                        }
                    }
                }

                break;
            }
        }
    }


    /* ENEMY PROJECTILES */

    for(const s of enemyShots){

        /* Homing: keeps turning toward the player (even after passing
           them) at a limited turn rate */
        if(s.homing){

            const sp=Math.hypot(s.vx,s.vy)||1;
            const cur=Math.atan2(s.vy,s.vx);
            const want=Math.atan2(player.y-s.y,player.x-s.x);

            let dif=want-cur;

            while(dif>Math.PI) dif-=Math.PI*2;
            while(dif<-Math.PI) dif+=Math.PI*2;

            const maxTurn=BOSS_HOMING_TURN*dt;

            const na=cur+Math.max(-maxTurn,Math.min(maxTurn,dif));

            s.vx=Math.cos(na)*sp;
            s.vy=Math.sin(na)*sp;
        }

        s.x+=(s.vx+(s.pvx||0))*dt;
        s.y+=(s.vy+(s.pvy||0))*dt;

        s.life-=dt;

        /* Homing balls are destroyed when they hit the arena barrier */
        if(s.homing && (s.x<arena.left || s.x>arena.right || s.y<arena.top || s.y>gameBottom)){
            s.life=0;
        }

        /* Bouncers: bounce off the walls, charge up, fire bursts */
        if(s.bouncer){

            if(s.x-s.r<arena.left){ s.x=arena.left+s.r; s.vx=Math.abs(s.vx); }
            if(s.x+s.r>arena.right){ s.x=arena.right-s.r; s.vx=-Math.abs(s.vx); }
            if(s.y-s.r<arena.top){ s.y=arena.top+s.r; s.vy=Math.abs(s.vy); }
            if(s.y+s.r>gameBottom){ s.y=gameBottom-s.r; s.vy=-Math.abs(s.vy); }

            if(s.hitCd>0) s.hitCd-=dt;

            s.fireTimer-=dt;

            if(s.fireTimer<=0){
                fireBouncerBurst(s);
                s.fireTimer=BOUNCER_FIRE_INTERVAL;
            }
        }

        const dx=player.x-s.x;
        const dy=player.y-s.y;

        const d=Math.hypot(dx,dy);

        if(player.dashTimer<=0 && d<player.r+s.r){

            if(s.bouncer){

                /* bouncers are never used up by hitting you */
                if(s.hitCd<=0){
                    player.hp-=s.damage;
                    s.hitCd=BOUNCER_HIT_COOLDOWN;
                }
            }
            else{
                player.hp-=s.damage;
                s.life=0;
            }
        }
    }


    /* CLEANUP */

    shots=shots.filter(
        s=>s.life>0 && s.x>arena.left-100 && s.x<arena.right+100 && s.y>arena.top-100 && s.y<gameBottom+100
    );

    enemyShots=enemyShots.filter(
        s=>s.life>0 && s.x>arena.left-150 && s.x<arena.right+150 && s.y>arena.top-150 && s.y<gameBottom+150
    );
}


/* =========================================================
   SPIKE RING
========================================================= */

const RING_BASE_SPIN=2.6;      /* rad/sec at tiers 1-3 */
const RING_BALL_RADIUS=9;
const RING_HIT_COOLDOWN=.2;    /* seconds a ball can't re-hit the same enemy */

function setRingCount(n){

    const balls=[];

    for(let i=0;i<n;i++){
        balls.push({
            offset:i*(Math.PI*2/n),
            hits:new Map()
        });
    }

    player.ringCount=n;
    player.ringBalls=balls;
}

/* Spike Ring is its own upgrade track (like Walk Speed), independent
   of whichever weapon is equipped. Tier 1 unlocks it. Index i in this
   array corresponds to tier i+1, mirroring walkSpeedUpgrades. */

const ringTierUpgrades=[
{
    tier:1,
    name:"Spike Ring",
    desc:"Unlocks the Spike Ring. A spiked ball orbits you, damaging any enemy it touches.",
    apply:()=>{
        player.ringTier=1;
        player.ringDamage=20;
        player.ringSpinSpeed=RING_BASE_SPIN;
        player.ringRadius=RING_START_RADIUS;
        setRingCount(1);
    }
},
{
    tier:2,
    name:"Spike Ring Tier 2",
    desc:"+1 spiked ball orbits the player.",
    apply:()=>{
        player.ringTier=2;
        setRingCount(2);
    }
},
{
    tier:3,
    name:"Spike Ring Tier 3",
    desc:"+1 spiked ball orbits the player.",
    apply:()=>{
        player.ringTier=3;
        setRingCount(3);
    }
},
{
    tier:4,
    name:"Spike Ring Tier 4",
    desc:"Damage increases from 20 to 50. Spin speed increases by 50%.",
    apply:()=>{
        player.ringTier=4;
        player.ringDamage=50;
        player.ringSpinSpeed=RING_BASE_SPIN*1.5;
    }
},
{
    tier:5,
    name:"Spike Ring Tier 5",
    desc:"+1 spiked ball orbits the player.",
    apply:()=>{
        player.ringTier=5;
        setRingCount(4);
    }
},
{
    tier:6,
    name:"Spike Ring Tier 6",
    desc:"+1 spiked ball orbits the player. Spin speed bonus increases from 50% to 100%. Damage increases from 50 to 60.",
    apply:()=>{
        player.ringTier=6;
        setRingCount(5);
        player.ringDamage=60;
        player.ringSpinSpeed=RING_BASE_SPIN*2;
    }
}
];

function nextRingUpgrade(){
    return ringTierUpgrades[player.ringTier]||null;
}

function updateRing(dt){

    player.ringAngle+=player.ringSpinSpeed*dt;

    const count=player.ringCount;

    for(let i=0;i<count;i++){

        const ball=player.ringBalls[i];

        if(!ball) continue;

        const angle=player.ringAngle+ball.offset;
        const bx=player.x+Math.cos(angle)*player.ringRadius;
        const by=player.y+Math.sin(angle)*player.ringRadius;

        for(const e of enemies){

            if(e.hp<=0) continue;

            const dx=e.x-bx;
            const dy=e.y-by;

            const d=Math.hypot(dx,dy);

            if(d<e.r+RING_BALL_RADIUS){

                const cd=ball.hits.get(e)||0;

                if(cd<=0){

                    e.hp-=player.ringDamage;

                    ball.hits.set(e,RING_HIT_COOLDOWN);

                    if(e.hp<=0){

                        score+=e.isBoss?100:10;

                        orbs.push({x:e.x,y:e.y,r:6,value:20});

                        if(e.isBoss){
                            for(let k=0;k<4;k++){
                                orbs.push({
                                    x:e.x+(Math.random()-.5)*50,
                                    y:e.y+(Math.random()-.5)*50,
                                    r:6,
                                    value:20
                                });
                            }
                        }
                    }
                }
            }
        }

        /* tick down / clean up this ball's per-enemy cooldowns */
        for(const [enemyRef,timer] of ball.hits){

            const nv=timer-dt;

            if(nv<=0 || enemyRef.hp<=0){
                ball.hits.delete(enemyRef);
            }
            else{
                ball.hits.set(enemyRef,nv);
            }
        }
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!started || gameOver || paused || upgradeOpen || weaponChoiceOpen){
        return;
    }


    /* ---------- MOVEMENT ---------- */

    let mx=joy.dx;
    let my=joy.dy;

    const md=Math.hypot(mx,my);

    if(md>1){
        mx/=md;
        my/=md;
    }

    const mm=Math.hypot(mx,my);

    if(mm>.1){
        player.lastMoveX=mx/mm;
        player.lastMoveY=my/mm;
    }

    if(player.dashCd>0) player.dashCd-=dt;

    if(player.dashTimer>0){

        /* Dashing: joystick ignored, immune to damage */

        player.dashTimer-=dt;

        player.x+=player.dashDx*DASH_SPEED*dt;
        player.y+=player.dashDy*DASH_SPEED*dt;
    }
    else{

        player.x+=mx*player.speed*dt;
        player.y+=my*player.speed*dt;
    }

    player.x=Math.max(arena.left+player.r,Math.min(arena.right-player.r,player.x));
    player.y=Math.max(arena.top+player.r,Math.min(gameBottom-player.r,player.y));


    /* ---------- AIM ---------- */

    if(aimJoy.on){

        if(Math.abs(aimJoy.dx)>.01 || Math.abs(aimJoy.dy)>.01){
            player.aimTarget=Math.atan2(aimJoy.dy,aimJoy.dx);
        }
    }
    else if(autoShoot){

        const target=getClosestEnemy();

        if(target){
            player.aimTarget=Math.atan2(target.y-player.y,target.x-player.x);
        }
    }

    let diff=player.aimTarget-player.aim;

    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;

    player.aim+=diff*Math.min(1,dt*10*player.aimSensitivity);


    /* ---------- WAVE BREAK ---------- */

    let waveBreaking=false;

    if(waveBreakTimer>0){

        waveBreaking=true;

        waveBreakTimer-=dt;

        if(waveBreakTimer<=0){
            waveBreakTimer=0;
            startWave();
            waveBreaking=false;
        }
    }


    /* ---------- SPAWNING ---------- */

    if(!waveBreaking){

        if(waveSpawned<waveTotal){

            if(isBossWave(wave) && waveSpawned===waveTotal-1){

                /* Boss only spawns once EVERY other enemy is dead */

                if(enemies.length===0){

                    bossDelay-=dt;

                    if(bossDelay<=0){
                        spawnBoss();
                        waveSpawned++;
                    }
                }
            }
            else{

                waveSpawnTimer-=dt;

                if(waveSpawnTimer<=0){

                    spawnNormalEnemy();

                    waveSpawned++;

                    waveSpawnTimer=getWaveSpawnSpeed(wave);
                }
            }
        }
    }


    /* ---------- FAST RELOAD ---------- */

    if(player.reloading){

        player.reloadTimer-=dt;

        if(player.reloadTimer<=0){
            player.reloading=false;
            player.ammo=player.maxAmmo;
        }
    }


    /* ---------- SHOOTING ---------- */

    shoot-=dt;

    if(autoShoot){

        if(player.weapon==="fast"){
            if(!player.reloading) fireFast();
        }
        else if(player.weapon==="scatter"){
            fireScatter();
        }
        else{
            fireBase();
        }
    }

    if(aimJoy.on){
        fireCurrentWeapon();
    }


    /* ---------- ENEMIES ---------- */

    if(!waveBreaking){

        for(const e of enemies){

            const dx=player.x-e.x;
            const dy=player.y-e.y;

            const d=Math.hypot(dx,dy);

            if(e.stun>0) e.stun-=dt;
            if(e.stunLock>0) e.stunLock-=dt;
            if(e.magnet>0) e.magnet-=dt;

            const frozen=e.stun>0;

            if(e.isBoss){

                if(!frozen) bossUpdate(e,dt);

            }
            else if(!frozen){

                if(d>0){
                    e.x+=dx/d*e.speed*dt;
                    e.y+=dy/d*e.speed*dt;
                }

                e.shoot-=dt;

                if(e.shoot<=0){
                    enemyFireAtPlayer(e);
                    e.shoot=1+Math.random()*2;
                }
            }


            /* contact damage */

            const pdx=player.x-e.x;
            const pdy=player.y-e.y;

            const pd=Math.hypot(pdx,pdy);

            if(player.dashTimer<=0 && pd<player.r+e.r){
                player.hp-=(e.isBoss?25:18)*dt;
            }
        }
    }


    /* ---------- SPIKE RING (always runs, like projectiles) ---------- */

    if(player.ringTier>0){
        updateRing(dt);
    }


    /* ---------- LIGHTNING ---------- */

    updateLightning(dt);


    /* ---------- PROJECTILES (always runs) ---------- */

    updateEnemyMagnets(dt);
    updateProjectiles(dt);


    /* ---------- ENEMY CLEANUP ---------- */

    if(!waveBreaking){
        enemies=enemies.filter(e=>e.hp>0);
    }

    /* Bouncers are destroyed once the boss (and its copies) are dead */
    if(!enemies.some(e=>e.isBoss) && enemyShots.some(s=>s.bouncer)){
        enemyShots=enemyShots.filter(s=>!s.bouncer);
    }


    /* ---------- ORBS ---------- */

    for(const o of orbs){

        const dx=player.x-o.x;
        const dy=player.y-o.y;

        const d=Math.hypot(dx,dy);

        if(d<player.magnet){

            if(d>0){

                const pull=d<18?500:220;

                o.x+=dx/d*pull*dt;
                o.y+=dy/d*pull*dt;
            }
        }

        const pdx=player.x-o.x;
        const pdy=player.y-o.y;

        const pd=Math.hypot(pdx,pdy);

        if(pd<player.r+o.r+4){
            xp+=o.value;
            o.collected=true;
        }
    }

    orbs=orbs.filter(o=>!o.collected);


    /* ---------- LEVEL UP ---------- */

    if(!waveBreaking){

        while(xp>=xpNext){

            xp-=xpNext;

            level++;

            xpNext=xpNext+20;

            if(level===2){

                if(!equippedWeapon){
                    openWeaponChoice();
                }
                else{
                    openUpgrades();
                }

                return;
            }

            if(level>2){
                openUpgrades();
                return;
            }
        }
    }


    /* ---------- GAME OVER ---------- */

    if(player.hp<=0){
        player.hp=0;
        gameOver=true;
    }


    /* ---------- WAVE COMPLETE ---------- */

    if(!waveBreaking && waveSpawned>=waveTotal && enemies.length===0){
        completeWave();
    }
}


/* =========================================================
   DRAW HELPERS
========================================================= */

function rect(x,y,w,h,fill,stroke=null,lw=1){

    ctx.fillStyle=fill;

    ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));

    if(stroke){
        ctx.strokeStyle=stroke;
        ctx.lineWidth=lw;
        ctx.strokeRect(
            Math.round(x)+.5,
            Math.round(y)+.5,
            Math.round(w)-1,
            Math.round(h)-1
        );
    }
}

function text(t,x,y,size,fill="#fff",align="left"){

    ctx.fillStyle=fill;
    ctx.font=`bold ${size}px Arial`;
    ctx.textAlign=align;
    ctx.textBaseline="middle";
    ctx.fillText(t,Math.round(x),Math.round(y));
}

function wrapText(t,x,y,maxWidth,lineHeight){

    const words=t.split(" ");

    let line="";

    for(let n=0;n<words.length;n++){

        const test=line+words[n]+" ";

        if(ctx.measureText(test).width>maxWidth && n>0){
            ctx.fillText(line,x,y);
            line=words[n]+" ";
            y+=lineHeight;
        }
        else{
            line=test;
        }
    }

    ctx.fillText(line,x,y);
}


/* =========================================================
   ICONS
========================================================= */

function drawPhoneIcon(x,y,scale=1){

    ctx.save();
    ctx.translate(x,y);

    ctx.strokeStyle="#dffaff";
    ctx.lineWidth=3*scale;

    ctx.strokeRect(-13*scale,-22*scale,26*scale,44*scale);

    ctx.fillStyle="#dffaff";

    ctx.fillRect(-4*scale,-16*scale,8*scale,2*scale);
    ctx.fillRect(-3*scale,15*scale,6*scale,3*scale);

    ctx.restore();
}

function drawMonitorIcon(x,y,scale=1){

    ctx.save();
    ctx.translate(x,y);

    ctx.strokeStyle="#dffaff";
    ctx.lineWidth=3*scale;

    ctx.strokeRect(-24*scale,-17*scale,48*scale,31*scale);

    ctx.beginPath();
    ctx.moveTo(-8*scale,20*scale);
    ctx.lineTo(8*scale,20*scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,14*scale);
    ctx.lineTo(0,22*scale);
    ctx.stroke();

    ctx.restore();
}

function drawMenu(){

    ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.12;

    for(let x=0;x<W;x+=24){
        ctx.fillStyle="#263044";
        ctx.fillRect(x,0,1,H);

    ctx.shadowColor="#57e9ff";
    ctx.shadowBlur=22;

    text("BULLETBOUND",W/2,H*.28,Math.min(42,W*.095),"#dffaff","center");

    ctx.restore();

    text(
        "SURVIVE. UPGRADE. KEEP SHOOTING.",
        W/2,

/* Screen-space: full background fill + the control panel strip at the
   bottom. Fixed UI, never affected by the camera zoom. */
function drawSceneBackground(){

    ctx.fillStyle="#080c12";
    ctx.fillRect(0,0,W,H);

    rect(0,controlTop,W,H-controlTop,"#090d13");

    ctx.strokeStyle="#25343f";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,controlTop);
    ctx.lineTo(W,controlTop);
    ctx.stroke();
}

/* World-space: the play-field itself (bg, grid, border). Drawn inside
   the camera transform, so it renders smaller/farther away while
   still using the same (now-larger) arena coordinates as gameplay. */
function drawArena(){

    rect(
        arena.left,
        arena.top,
        arena.right-arena.left,
        gameBottom-arena.top,
        "#0b1118"
    );

    ctx.save();

    ctx.beginPath();
    ctx.rect(
        arena.left,
        arena.top,
        arena.right-arena.left,
        gameBottom-arena.top
    );
    ctx.clip();

    ctx.globalAlpha=.13;
    ctx.strokeStyle="#42515e";
    ctx.lineWidth=1;

    for(let x=arena.left;x<arena.right;x+=32){
        ctx.beginPath();
        ctx.moveTo(x,arena.top);
        ctx.lineTo(x,gameBottom);
        ctx.stroke();
    }

    for(let y=arena.top;y<gameBottom;y+=32){
        ctx.beginPath();
        ctx.moveTo(arena.left,y);
        ctx.lineTo(arena.right,y);
        ctx.stroke();
    }

    ctx.restore();

    ctx.strokeStyle="#263742";
    ctx.lineWidth=2;

    ctx.strokeRect(
        arena.left,
        arena.top,
        arena.right-arena.left,
        gameBottom-arena.top
    );
}

/* =========================================================
   SHOTS DRAW
========================================================= */

/* Cheap deterministic 0..1 hash, used so sparks flicker in steps
   instead of jittering every single frame. */
function sparkHash(n){
    const x=Math.sin(n*127.1)*43758.5453;
    return x-Math.floor(x);
}

/* Slight crackle around a magnetized enemy: a few short, jagged
   sparks that flicker on and off. */
function drawMagnetSparks(x,y,r,seedOffset,count){

    const tick=Math.floor(performance.now()/80);
    const base=(seedOffset||0)+tick*13.7;

    ctx.save();

    ctx.strokeStyle="#ffe6f0";
    ctx.shadowColor="#ff6b9a";
    ctx.shadowBlur=6;
    ctx.lineWidth=1.3;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    for(let i=0;i<count;i++){

        const seed=base+i*5.31;

        /* each spark is only lit part of the time */
        if(sparkHash(seed+9.1)<.35) continue;

        const a=sparkHash(seed)*Math.PI*2;
        const len=4+sparkHash(seed+1.7)*6;
        const bend=(sparkHash(seed+3.3)-.5)*1.4;

        const r0=r*.9;
        const r1=r+len*.55;
        const r2=r+len;

        ctx.globalAlpha=.55+sparkHash(seed+6.2)*.4;

        ctx.beginPath();
        ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);
        ctx.lineTo(x+Math.cos(a+bend*.25)*r1,y+Math.sin(a+bend*.25)*r1);
        ctx.lineTo(x+Math.cos(a-bend*.15)*r2,y+Math.sin(a-bend*.15)*r2);
        ctx.stroke();
    }

    ctx.restore();
}

/* Sparks around every magnetized enemy */
function drawEnemyMagnets(){

    for(const e of enemies){

        if(!(e.magnet>0)) continue;

        drawMagnetSparks(e.x,e.y,e.r*1.15,e.sparkSeed||0,e.isBoss?7:4);
    }
}

/* Bouncer: big dark-red ball. Its core swells as the next burst charges. */
function drawBouncer(s){

    const charge=1-Math.max(0,Math.min(1,s.fireTimer/BOUNCER_FIRE_INTERVAL));

    ctx.save();

    ctx.shadowColor="#ff3f55";
    ctx.shadowBlur=14;

    ctx.fillStyle="#7d1a30";

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle="#ff6b7d";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.fillStyle="#ffa3b0";
    ctx.globalAlpha=.3+.4*charge;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r*(.2+.5*charge),0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawShots(){

    for(const s of shots){

        ctx.fillStyle="#f3fbff";

        ctx.fillRect(
            Math.round(s.x-s.r),
            Math.round(s.y-s.r),
            Math.round(s.r*2),
            Math.round(s.r*2)
        );
    }

    for(const s of enemyShots){

        if(s.bouncer){
            drawBouncer(s);
            continue;
        }

        ctx.fillStyle=s.bigBossShot?"#ff6b9a":"#ff9a4a";

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }
}


/* =========================================================
   SPIKE RING DRAW
========================================================= */

function drawSpikeBall(x,y,r){

    ctx.save();
    ctx.translate(x,y);

    ctx.shadowColor="#ffb347";
    ctx.shadowBlur=10;

    const spikes=8;

    ctx.fillStyle="#ffcf79";

    ctx.beginPath();

    for(let i=0;i<spikes*2;i++){
        const a=(Math.PI*2/(spikes*2))*i;
        const rad=i%2===0?r*1.9:r*.85;
        const px=Math.cos(a)*rad;
        const py=Math.sin(a)*rad;
        if(i===0) ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }

    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#c97a2b";

    ctx.beginPath();
    ctx.arc(0,0,r*.55,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawRing(){

    if(player.ringTier<=0) return;

    const count=player.ringCount;

    for(let i=0;i<count;i++){

        const ball=player.ringBalls[i];

        if(!ball) continue;

        const angle=player.ringAngle+ball.offset;
        const bx=player.x+Math.cos(angle)*player.ringRadius;
        const by=player.y+Math.sin(angle)*player.ringRadius;

        drawSpikeBall(bx,by,RING_BALL_RADIUS);
    }
}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

    const dashing=player.dashTimer>0;

    /* Dash streak */
    if(dashing){

        ctx.save();

        ctx.globalAlpha=.25;
        ctx.strokeStyle="#57e9ff";
        ctx.lineWidth=player.r*2;
        ctx.lineCap="round";

        ctx.beginPath();
        ctx.moveTo(player.dashFromX,player.dashFromY);
        ctx.lineTo(player.x,player.y);
        ctx.stroke();

        ctx.restore();
    }

    ctx.save();

    ctx.globalAlpha=dashing?.5:1;

    ctx.shadowColor="#43e5ff";
    ctx.shadowBlur=12;

    ctx.fillStyle="#35cfe7";

    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    ctx.save();

    ctx.translate(player.x,player.y);
    ctx.rotate(player.aim);

    ctx.fillStyle="#f2fdff";

    ctx.beginPath();
    ctx.moveTo(17,0);
    ctx.lineTo(5,-4);
    ctx.lineTo(5,4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DASH BUTTON DRAW
========================================================= */

function drawDashButton(){

    if(player.walkTier<6) return;

    const b=getDashButton();

    const ready=player.dashCd<=0;

    ctx.save();

    ctx.globalAlpha=ready?.6:.3;

    ctx.fillStyle=ready?"#1d4b57":"#141d24";
    ctx.strokeStyle=ready?"#57e9ff":"#4a5b66";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    /* cooldown ring fills back up */
    if(!ready){

        ctx.globalAlpha=.8;
        ctx.strokeStyle="#57e9ff";
        ctx.lineWidth=3;

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y,
            b.r-4,
            -Math.PI/2,
            -Math.PI/2+Math.PI*2*(1-player.dashCd/DASH_COOLDOWN)
        );
        ctx.stroke();
    }

    ctx.restore();

    text("DASH",b.x,b.y,12,ready?"#e7fbff":"#6f8493","center");
}


/* =========================================================
   FIRE MODE BUTTON DRAW
========================================================= */

function drawFireModeButton(){

    if(player.weapon!=="fast") return;

    const b=getFireModeButton();
    const semi=player.fireMode==="semi";

    ctx.save();

    ctx.globalAlpha=.6;

    ctx.fillStyle=semi?"#4b3a1d":"#1d4b57";
    ctx.strokeStyle=semi?"#ffcf79":"#57e9ff";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    text(semi?"SEMI":"AUTO",b.x,b.y-4,12,"#e7fbff","center");
    text("FIRE MODE",b.x,b.y+12,7,"#8fa4b0","center");
}


/* =========================================================
   LIGHTNING DRAW
========================================================= */

function drawLightning(){

    for(const b of lightningBolts){

        const a=Math.max(0,b.life/b.maxLife);

        ctx.save();

        ctx.globalAlpha=a;
        ctx.lineJoin="round";
        ctx.lineCap="round";

        for(let pass=0;pass<2;pass++){

            if(pass===0){
                ctx.shadowColor=b.bullet?"#d28bff":"#57e9ff";
                ctx.shadowBlur=16;
                ctx.strokeStyle=b.bullet?"#b56cff":"#3fd6ff";
                ctx.lineWidth=5;
            }
            else{
                ctx.shadowBlur=0;
                ctx.strokeStyle="#ffffff";
                ctx.lineWidth=2;
            }

            for(const pts of b.lines){

                ctx.beginPath();
                ctx.moveTo(pts[0].x,pts[0].y);

                for(let i=1;i<pts.length;i++){
                    ctx.lineTo(pts[i].x,pts[i].y);
                }

                ctx.stroke();
            }
        }

        ctx.restore();
    }
}

/* Icy tint on stunned enemies */
function drawStunOverlay(){

    for(const e of enemies){

        if(!(e.stun>0)) continue;

        ctx.save();

        ctx.globalAlpha=.55;
        ctx.fillStyle="#9fe8ff";
        ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);

        ctx.globalAlpha=1;
        ctx.strokeStyle="#e6fbff";
        ctx.lineWidth=2;
        ctx.strokeRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);

        ctx.restore();
    }
}

function drawLightningButton(){

    if(player.lightTier<=0) return;

    const b=getLightningButton();

    const bullet=player.lightMode==="bullet";
    const ready=player.lightCd<=0;

    ctx.save();

    ctx.globalAlpha=.6;

    ctx.fillStyle=bullet?"#3f2a5c":"#1d4b57";
    ctx.strokeStyle=bullet?"#d28bff":"#57e9ff";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    /* cooldown ring fills back up */
    if(!ready){

        ctx.globalAlpha=.85;
        ctx.strokeStyle=bullet?"#d28bff":"#57e9ff";
        ctx.lineWidth=3;

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y,
            b.r-4,
            -Math.PI/2,
            -Math.PI/2+Math.PI*2*(1-player.lightCd/player.lightCooldown)
        );
        ctx.stroke();
    }

    ctx.restore();

    text("ZAP",b.x,b.y-4,12,"#e7fbff","center");
    text(bullet?"BULLET":"ENEMY",b.x,b.y+11,8,"#a9bcc7","center");
}


/* =========================================================
   JOYSTICK DRAW
========================================================= */

function drawStick(j){

    ctx.save();

    ctx.globalAlpha=j.on?.35:.2;

    ctx.strokeStyle="#8ea8b6";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(j.x,j.y,j.r,0,Math.PI*2);
    ctx.stroke();

    ctx.globalAlpha=j.on?.55:.3;

    ctx.fillStyle="#78929f";

    ctx.beginPath();
    ctx.arc(j.x+j.tx,j.y+j.ty,j.knobR,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawJoystick(j){
    drawStick(j);
}

function drawAimJoystick(){
    drawStick(aimJoy);
}


/* =========================================================
   PAUSE BUTTON
========================================================= */

function drawPauseButton(){

    const r=getPauseRect();

    rect(r.x,r.y,r.w,r.h,"#101820","#344954",2);

    rect(r.x+15,r.y+9,5,16,"#c7d6dc");
    rect(r.x+26,r.y+9,5,16,"#c7d6dc");
}


/* =========================================================
   WEAPON CHOICE / UPGRADE OVERLAYS
========================================================= */

function drawWeaponChoice(){

    ctx.fillStyle="rgba(0,0,0,.72)";
    ctx.fillRect(0,0,W,H);

    text("CHOOSE A WEAPON",W/2,55,23,"#e7fbff","center");
    text("Your first upgrade unlocks your weapon",W/2,82,10,"#748894","center");

    const cards=getWeaponCardRects();

    for(let i=0;i<cards.length;i++){
        drawWeaponCard(cards[i],i);
    }
}

function drawUpgradeOverlay(){

    ctx.fillStyle="rgba(0,0,0,.74)";
    ctx.fillRect(0,0,W,H);

    text("UPGRADE",W/2,48,24,"#e7fbff","center");
    text("Choose an upgrade",W/2,75,10,"#748894","center");

    const cards=getUpgradeCardRects();

    for(let i=0;i<upgradeChoices.length;i++){
        drawUpgradeCard(cards[i],upgradeChoices[i]);
    }
}

function drawUpgradeCard(r,u){

    rect(r.x,r.y,r.w,r.h,"#111b24","#57e9ff",2);
    rect(r.x+3,r.y+3,r.w-6,4,"#24515d");

    text(u.name,r.x+18,r.y+34,16,"#e7fbff");

    ctx.fillStyle="#879aa6";
    ctx.font="12px Arial";
    ctx.textAlign="left";
    ctx.textBaseline="top";

    wrapText(u.desc,r.x+18,r.y+62,r.w-36,18);

    text("TAP TO SELECT",r.x+r.w-15,r.y+r.h-16,8,"#4f727d","right");
}


/* =========================================================
   PAUSED / GAME OVER
========================================================= */

function drawPaused(){

    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,W,H);

    text("PAUSED",W/2,H/2-15,30,"#e7fbff","center");
    text("Press P / ESC or tap pause",W/2,H/2+22,11,"#8296a2","center");
}

function drawGameOver(){

    ctx.fillStyle="rgba(0,0,0,.72)";
    ctx.fillRect(0,0,W,H);

    text("GAME OVER",W/2,H/2-70,31,"#ff6274","center");
    text("WAVE "+wave,W/2,H/2-28,15,"#dcecf2","center");
    text("SCORE "+score,W/2,H/2,13,"#8799a5","center");

    const r=getGameOverRect();

    rect(r.x,r.y,r.w,r.h,"#142932","#57e9ff",2);

    text("PLAY AGAIN",W/2,r.y+r.h/2,16,"#e7fbff","center");
}


/* =========================================================
   MAIN DRAW
========================================================= */

function drawGame(){

    drawSceneBackground();

    /* Camera zoom: everything world-space (arena, enemies, shots,
       orbs, ring, player) renders smaller/farther away, but the
       transform is centered so the viewport still lines up with the
       same on-screen rectangle. */
    ctx.save();

    ctx.translate(camCenterX,camCenterY);
    ctx.scale(CAMERA_SCALE,CAMERA_SCALE);
    ctx.translate(-camCenterX,-camCenterY);

    drawArena();
    drawOrbs();
    drawEnemies();
    drawShots();
    drawStunOverlay();
    drawEnemyMagnets();
    drawLightning();
    drawRing();
    drawPlayer();

    ctx.restore();

    /* Fixed screen-space UI, unaffected by the camera zoom */
    drawHUD();
    drawPauseButton();

    drawJoystick(joy);
    drawAimJoystick();
    drawDashButton();
    drawFireModeButton();
    drawLightningButton();

    if(paused) drawPaused();
    if(weaponChoiceOpen) drawWeaponChoice();
    if(upgradeOpen) drawUpgradeOverlay();
    if(gameOver) drawGameOver();
}

function draw(){

    if(!started){

        if(settingsOpen){
            drawSettings();
        }
        else if(loadoutOpen){
            drawLoadout();
        }
        else{
            drawMenu();
        }

        return;
    }

    drawGame();
}


/* =========================================================
   SHARED UI TAP HANDLER
   Returns true if the tap was consumed by a menu / overlay /
   pause button (so joysticks should NOT start).
========================================================= */

function handleUITap(x,y){

    /* ----- Menus ----- */

    if(!started){

        if(settingsOpen){

            const devices=getDeviceRects();

            if(pointInRect(x,y,devices.mobile)){
                selectedDevice="mobile";
                settingsOpen=false;
                return true;
            }

            if(pointInRect(x,y,devices.computer)){
                return true;
            }

            if(pointInRect(x,y,getAutoShootRect())){
                autoShoot=!autoShoot;
                return true;
            }

            if(pointInRect(x,y,getExtraInfoRect())){
                extraInfo=!extraInfo;
                return true;
            }

            if(pointInRect(x,y,getBackRect())){
                settingsOpen=false;
                return true;
            }

            return true;
        }

        if(loadoutOpen){

            const cards=getWeaponCardRects();

            for(let i=0;i<cards.length;i++){

                if(pointInCard(x,y,cards[i])){

                    equippedWeapon=WEAPON_KEYS[i];

                    loadoutOpen=false;

                    applyEquippedWeapon();

                    return true;
                }
            }

            if(x>=18 && x<=90 && y>=18 && y<=52){
                loadoutOpen=false;
            }

            return true;
        }

        if(pointInRect(x,y,getMenuButtonRect(0))){
            startGame();
            return true;
        }

        if(pointInRect(x,y,getMenuButtonRect(1))){
            loadoutOpen=true;
            return true;
        }

        if(pointInRect(x,y,getMenuButtonRect(2))){
            settingsOpen=true;
            return true;
        }

        return true;
    }


    /* ----- Game over ----- */

    if(gameOver){

        if(pointInRect(x,y,getGameOverRect())){
            startGame();
        }

        return true;
    }


    /* ----- Weapon choice ----- */

    if(weaponChoiceOpen){

        const cards=getWeaponCardRects();

        for(let i=0;i<cards.length;i++){

            if(pointInCard(x,y,cards[i])){
                chooseWeapon(i);
                break;
            }
        }

        return true;
    }


    /* ----- Upgrade cards ----- */

    if(upgradeOpen){

        const cards=getUpgradeCardRects();

        for(let i=0;i<upgradeChoices.length;i++){

            if(pointInUpgradeCard(x,y,cards[i])){
                chooseUpgrade(i);
                break;
            }
        }

        return true;
    }


    /* ----- Pause button ----- */

    if(pointInRect(x,y,getPauseRect())){
        togglePause();
        return true;
    }

    if(paused){
        return true;
    }

    return false;
}


/* =========================================================
   TOUCH
========================================================= */

c.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        for(const touch of e.changedTouches){

            const x=touch.clientX;
            const y=touch.clientY;

            if(handleUITap(x,y)) continue;

            if(hitDashButton(x,y)){
                tryDash();
                continue;
            }

            if(hitFireModeButton(x,y)){
                toggleFireMode();
                continue;
            }

            if(hitLightningButton(x,y)){
                toggleLightningMode();
                continue;
            }

            if(aimTouchId===null && beginAimTouch(touch)){
                continue;
            }

            if(moveTouchId===null && beginMoveTouch(touch)){
                continue;
            }
        }
    },
    {passive:false}
);

c.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(const touch of e.changedTouches){

            if(touch.identifier===aimTouchId){

                setJoystick(aimJoy,touch);

                if(Math.abs(aimJoy.dx)>.01 || Math.abs(aimJoy.dy)>.01){
                    player.aimTarget=Math.atan2(aimJoy.dy,aimJoy.dx);
                }
            }

            if(touch.identifier===moveTouchId){
                setJoystick(joy,touch);
            }
        }
    },
    {passive:false}
);

function endTouches(e){

    e.preventDefault();

    for(const touch of e.changedTouches){

        if(touch.identifier===aimTouchId){

            aimTouchId=null;

            aimJoy.on=false;
            aimJoy.tx=0;
            aimJoy.ty=0;
            aimJoy.dx=1;
            aimJoy.dy=0;
        }

        if(touch.identifier===moveTouchId){

            moveTouchId=null;

            joy.on=false;
            joy.tx=0;
            joy.ty=0;
            joy.dx=0;
            joy.dy=0;
        }
    }
}

c.addEventListener("touchend",endTouches,{passive:false});
c.addEventListener("touchcancel",endTouches,{passive:false});


/* =========================================================
   POINTER (mouse)
========================================================= */

let pointerAim=false;
let pointerMove=false;

c.addEventListener(
    "pointerdown",
    e=>{

        if(e.pointerType==="touch"){
            return;
        }

        const x=e.clientX;
        const y=e.clientY;

        if(handleUITap(x,y)) return;

        if(hitDashButton(x,y)){
            tryDash();
            return;
        }

        if(hitFireModeButton(x,y)){
            toggleFireMode();
            return;
        }

        if(hitLightningButton(x,y)){
            toggleLightningMode();
            return;
        }

        const adx=x-aimJoy.x;
        const ady=y-aimJoy.y;

        if(Math.hypot(adx,ady)<=aimJoy.r+30){

            pointerAim=true;

            aimJoy.on=true;

            setJoystick(aimJoy,{clientX:x,clientY:y});

            player.aimTarget=Math.atan2(aimJoy.dy,aimJoy.dx);

            return;
        }

        const mdx=x-joy.x;
        const mdy=y-joy.y;

        if(Math.hypot(mdx,mdy)<=joy.r+30){

            pointerMove=true;

            joy.on=true;

            setJoystick(joy,{clientX:x,clientY:y});
        }
    }
);

c.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerType==="touch"){
            return;
        }

        if(pointerAim){

            setJoystick(aimJoy,{clientX:e.clientX,clientY:e.clientY});

            player.aimTarget=Math.atan2(aimJoy.dy,aimJoy.dx);
        }

        if(pointerMove){
            setJoystick(joy,{clientX:e.clientX,clientY:e.clientY});
        }
    }
);

function pointerEnd(){

    pointerAim=false;
    pointerMove=false;

    aimJoy.on=false;
    aimJoy.tx=0;
    aimJoy.ty=0;
    aimJoy.dx=1;
    aimJoy.dy=0;

    joy.on=false;
    joy.tx=0;
    joy.ty=0;
    joy.dx=0;
    joy.dy=0;
}

window.addEventListener("pointerup",pointerEnd);
window.addEventListener("pointercancel",pointerEnd);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    e=>{
        if(e.key==="p" || e.key==="P" || e.key==="Escape"){
            togglePause();
        }

        if(e.key==="l" || e.key==="L"){
            toggleLightningMode();
        }

        if(e.key===" "){
            e.preventDefault();
            tryDash();
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(t){

    if(!last){
        last=t;
    }

    let dt=(t-last)/1000;

    last=t;

    dt=Math.min(dt,.033);

    update(dt);

    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIALIZE
========================================================= */

resize();

player.x=W/2;
player.y=arena.top+(gameBottom-arena.top)/2;

requestAnimationFrame(loop);

</script>
