<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bulletbound</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
min-height:100dvh;
overflow:hidden;
background:#080a10;
touch-action:none;
-webkit-user-select:none;
user-select:none;

overscroll-behavior:none;

canvas{
display:block;
width:100%;
height:100%;

<body>
<canvas id="c"></canvas>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W=0;
let H=0;
let dpr=1;

function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);

    W=window.innerWidth;
    H=window.innerHeight;

    c.width=Math.floor(W*dpr);
    c.height=Math.floor(H*dpr);

    ctx.setTransform(dpr,0,0,dpr,0,0);

    updateArena();
    joystickPos();
    aimJoystickPos();
}

window.addEventListener("resize",resize);


/* =========================================================
   ARENA
========================================================= */

const arena={
    left:14,
    right:0,
    top:72,
    bottom:0
};

let gameBottom=0;
let controlTop=0;

function updateArena(){
    const controlHeight=Math.min(
        185,
        Math.max(150,H*.23)
    );

    controlTop=H-controlHeight;

    arena.left=14;
    arena.right=W-14;
    arena.top=72;
    arena.bottom=controlHeight;

    gameBottom=controlTop-8;
}


/* =========================================================
   PLAYER
========================================================= */

const player={
    x:0,
    y:0,
    r:11,

    hp:100,
    maxHp:100,

    damage:10,
    speed:110,
    magnet:70,
    bulletSpeed:480,

    fireRate:.28,

    shots:1,

    aim:0,
    aimTarget:0,
    aimSensitivity:.5,

    weapon:null,

    /* Scatter Blaster */
    scatterTier:1,
    scatterPierce:false,
    scatterDamage:20,
    scatterFireRate:1.5,

    /* Fast Pew Pew */
    fastDamageUpgrades:0,
    fastAttackSpeedUpgrades:0,
    fastVelocityUpgrades:0,
    ammoCapacityUpgrades:0,
    reloadTimeUpgrades:0,

    maxAmmo:8,
    ammo:8,

    reloadTime:2,
    reloadTimer:0,
    reloading:false
};


/* =========================================================
   GAME STATE
========================================================= */

let enemies=[];
let shots=[];
let enemyShots=[];
let orbs=[];

let score=0;

let wave=1;
let waveTotal=0;
let waveSpawned=0;
let waveSpawnTimer=0;
let waveBreakTimer=0;

let shoot=0;
let last=0;

let xp=0;
let level=1;
let xpNext=100;

let paused=false;

let upgradeChoices=[];
let upgradeOpen=false;

let weaponChoiceOpen=false;
let loadoutOpen=false;

let gameOver=false;
let started=false;

let equippedWeapon=null;

let settingsOpen=false;

let autoShoot=false;

let selectedDevice="mobile";


/* =========================================================
   JOYSTICKS
========================================================= */

const joy={
    on:false,
    x:0,
    y:0,
    tx:0,
    ty:0,
    dx:0,
    dy:0,
    r:58,
    knobR:24
};

const aimJoy={
    on:false,
    x:0,
    y:0,
    tx:0,
    ty:0,
    dx:1,
    dy:0,
    r:58,
    knobR:24
};

let moveTouchId=null;
let aimTouchId=null;

function joystickPos(){
    const controlHeight=H-controlTop;
    const controlY=controlTop+controlHeight/2;

    const side=Math.max(
        68,
        Math.min(78,W*.19)
    );

    joy.x=side;
    joy.y=controlY;
}

function aimJoystickPos(){
    const controlHeight=H-controlTop;
    const controlY=controlTop+controlHeight/2;

    const side=Math.max(
        68,
        Math.min(78,W*.19)
    );

    aimJoy.x=W-side;
    aimJoy.y=controlY;
}

function resetJoysticks(){
    moveTouchId=null;
    aimTouchId=null;

    joy.on=false;
    joy.dx=0;
    joy.dy=0;

    aimJoy.on=false;
    aimJoy.dx=1;
    aimJoy.dy=0;
}


/* =========================================================
   WEAPONS
========================================================= */

function equipScatterBlaster(){

    player.weapon="scatter";

    player.shots=1;

    player.damage=20;

    player.scatterTier=1;
    player.scatterPierce=false;

    player.scatterDamage=20;
    player.scatterFireRate=1.5;

    player.fireRate=1.5;

    player.bulletSpeed=480;

    shoot=0;
}

function equipFastPewPew(){

    player.weapon="fast";

    player.shots=1;

    player.damage=10;

    player.fireRate=.14;

    player.bulletSpeed=480;

    player.maxAmmo=8;
    player.ammo=8;

    player.reloadTime=2;
    player.reloadTimer=0;
    player.reloading=false;

    shoot=0;
}

function applyEquippedWeapon(){

    if(equippedWeapon==="scatter"){
        equipScatterBlaster();
    }

    if(equippedWeapon==="fast"){
        equipFastPewPew();
    }
}


/* =========================================================
   SCATTER TIER UPGRADES
========================================================= */

const scatterTierUpgrades=[

    {
        tier:2,
        name:"Scatter Blaster Tier 2",
        desc:"+1 shot fired. Damage increases from 20 to 30.",
        apply:()=>{
            player.scatterTier=2;
            player.shots=2;
            player.damage=30;
            player.scatterDamage=30;
        }
    },

    {
        tier:3,
        name:"Scatter Blaster Tier 3",
        desc:"+1 shot fired. Damage increases from 30 to 40.",
        apply:()=>{
            player.scatterTier=3;
            player.shots=3;
            player.damage=40;
            player.scatterDamage=40;
        }
    },

    {
        tier:4,
        name:"Scatter Blaster Tier 4",
        desc:"+1 shot fired. Damage increases from 40 to 50.",
        apply:()=>{
            player.scatterTier=4;
            player.shots=4;
            player.damage=50;
            player.scatterDamage=50;
        }
    },

    {
        tier:5,
        name:"Scatter Blaster Tier 5",
        desc:"+1 shot fired. Bullets pierce 1 enemy and lose half their damage.",
        apply:()=>{
            player.scatterTier=5;
            player.shots=5;
            player.damage=50;
            player.scatterDamage=50;
            player.scatterPierce=true;
        }
    },

    {
        tier:6,
        name:"Scatter Blaster Tier 6",
        desc:"Fire cooldown decreases from 1.5 seconds to 1 second.",
        apply:()=>{
            player.scatterTier=6;
            player.shots=5;
            player.damage=50;
            player.scatterDamage=50;
            player.scatterFireRate=1;
            player.fireRate=1;
            player.scatterPierce=true;
        }
    }

];


/* =========================================================
   FAST PEW PEW UPGRADES
========================================================= */

const fastPewPewUpgrades=[

    {
        name:"Pew Pew Power",
        desc:"Increase damage by 50%",
        apply:()=>{
            player.damage*=1.5;
            player.fastDamageUpgrades++;
        }
    },

    {
        name:"Rapid Fire",
        desc:"Increase attack speed by 25%",
        apply:()=>{
            player.fireRate/=1.25;
            player.fastAttackSpeedUpgrades++;
        }
    },

    {
        name:"Velocity Boost",
        desc:"Increase projectile velocity by 50%",
        apply:()=>{
            player.bulletSpeed*=1.5;
            player.fastVelocityUpgrades++;
        }
    },

    {
        name:"Ammo Capacity",
        desc:"Increase maximum ammo by 2",
        apply:()=>{
            player.maxAmmo+=2;
            player.ammo+=2;
            player.ammo=Math.min(
                player.ammo,
                player.maxAmmo
            );
            player.ammoCapacityUpgrades++;
        }
    },

    {
        name:"Quick Reload",
        desc:"Decrease reload time by 0.2 seconds",
        apply:()=>{
            player.reloadTime=Math.max(
                .2,
                player.reloadTime-.2
            );
            player.reloadTimeUpgrades++;
        }
    }

];


/* =========================================================
   WAVES
========================================================= */

function getWaveEnemyCount(w){
    return 5+(w-1)*2;
}

function getWaveSpawnSpeed(w){
    return Math.max(
        .35,
        1.15-(w-1)*.055
    );
}

function getWaveEnemyHealth(w){
    return 100;
}

function getWaveEnemySpeed(w){
    return (
        (35+Math.random()*20)
        *.5
        *(1+(w-1)*.035)
    );
}

function isBossWave(w){
    return w%10===0;
}

function getWaveNormalCount(w){
    return getWaveEnemyCount(w);
}

function startWave(){

    waveTotal=
        getWaveNormalCount(wave)
        +(isBossWave(wave)?1:0);

    waveSpawned=0;

    waveSpawnTimer=.5;
}

function completeWave(){

    player.hp=player.maxHp;

    wave++;

    waveTotal=0;
    waveSpawned=0;

    waveBreakTimer=1;
}


/* =========================================================
   RESET / START
========================================================= */

function reset(){

    updateArena();

    player.x=W/2;
    player.y=arena.top+
        (gameBottom-arena.top)/2;

    player.hp=100;
    player.maxHp=100;

    player.damage=10;
    player.speed=110;
    player.magnet=70;
    player.bulletSpeed=480;

    player.fireRate=.28;

    player.shots=1;

    player.aim=0;
    player.aimTarget=0;
    player.aimSensitivity=.5;

    player.weapon=null;

    player.scatterTier=1;
    player.scatterPierce=false;
    player.scatterDamage=20;
    player.scatterFireRate=1.5;

    player.fastDamageUpgrades=0;
    player.fastAttackSpeedUpgrades=0;
    player.fastVelocityUpgrades=0;
    player.ammoCapacityUpgrades=0;
    player.reloadTimeUpgrades=0;

    player.maxAmmo=8;
    player.ammo=8;

    player.reloadTime=2;
    player.reloadTimer=0;
    player.reloading=false;

    enemies=[];
    shots=[];
    enemyShots=[];
    orbs=[];

    score=0;

    wave=1;
    waveTotal=0;
    waveSpawned=0;
    waveSpawnTimer=0;
    waveBreakTimer=0;

    shoot=0;

    xp=0;
    level=1;
    xpNext=100;

    paused=false;

    upgradeChoices=[];
    upgradeOpen=false;

    weaponChoiceOpen=false;
    loadoutOpen=false;

    settingsOpen=false;

    gameOver=false;

    resetJoysticks();

    applyEquippedWeapon();
}

function startGame(){

    started=true;
    loadoutOpen=false;

    reset();
    startWave();
}


/* =========================================================
   ENEMIES
========================================================= */

function spawnNormalEnemy(){

    const side=Math.floor(Math.random()*4);

    let x;
    let y;

    if(side===0){
        x=arena.left-30;
        y=arena.top+
            Math.random()*
            (gameBottom-arena.top);
    }

    if(side===1){
        x=arena.right+30;
        y=arena.top+
            Math.random()*
            (gameBottom-arena.top);
    }

    if(side===2){
        x=arena.left+
            Math.random()*
            (arena.right-arena.left);
        y=arena.top-30;
    }

    if(side===3){
        x=arena.left+
            Math.random()*
            (arena.right-arena.left);
        y=gameBottom+30;
    }

    enemies.push({

        x:x,
        y:y,

        r:14,

        hp:getWaveEnemyHealth(wave),
        maxHp:getWaveEnemyHealth(wave),

        speed:getWaveEnemySpeed(wave),

        shoot:1+Math.random()*2,

        color:
            Math.random()<.5
            ?"#ff4f70"
            :"#a66cff",

        isBoss:false
    });
}

function spawnBoss(){

    const side=Math.floor(Math.random()*4);

    let x=W/2;
    let y=arena.top+80;

    if(side===0){
        x=arena.left+80;
    }

    if(side===1){
        x=arena.right-80;
    }

    if(side===2){
        y=arena.top+70;
    }

    if(side===3){
        y=gameBottom-70;
    }

    enemies.push({

        x:x,
        y:y,

        r:56,

        hp:1000,
        maxHp:1000,

        speed:22,

        shoot:1.5,
        radialShoot:5,
        bigShoot:2.5,

        color:"#d83b52",

        isBoss:true
    });
}


/* =========================================================
   ENEMY SHOOTING
========================================================= */

function enemyFireAtPlayer(enemy){

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const a=Math.atan2(dy,dx);

    enemyShots.push({

        x:enemy.x,
        y:enemy.y,

        vx:Math.cos(a)*85,
        vy:Math.sin(a)*85,

        r:5,
        life:7,

        damage:10,

        bossShot:false,
        bigBossShot:false
    });
}

function bossRadialFire(enemy){

    const count=12;

    for(let i=0;i<count;i++){

        const a=
            (Math.PI*2/count)*i;

        enemyShots.push({

            x:enemy.x,
            y:enemy.y,

            vx:Math.cos(a)*95,
            vy:Math.sin(a)*95,

            r:7,
            life:7,

            damage:10,

            bossShot:true,
            bigBossShot:false
        });
    }
}

function bossBigFire(enemy){

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const a=Math.atan2(dy,dx);

    enemyShots.push({

        x:enemy.x,
        y:enemy.y,

        vx:Math.cos(a)*55,
        vy:Math.sin(a)*55,

        r:14,
        life:10,

        damage:50,

        bossShot:false,
        bigBossShot:true
    });
}


/* =========================================================
   CLOSEST ENEMY
========================================================= */

function getClosestEnemy(){

    let best=null;
    let bestD=Infinity;

    for(const e of enemies){

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const d=dx*dx+dy*dy;

        if(d<bestD){
            bestD=d;
            best=e;
        }
    }

    return best;
}


/* =========================================================
   FIRING
========================================================= */

function fireBase(){

    if(shoot>0) return;

    const a=player.aim;

    shots.push({

        x:player.x+
            Math.cos(a)*14,

        y:player.y+
            Math.sin(a)*14,

        vx:Math.cos(a)*player.bulletSpeed,
        vy:Math.sin(a)*player.bulletSpeed,

        r:5,
        life:1.5,

        damage:player.damage,

        pierceLeft:0
    });

    shoot=player.fireRate;
}

function startFastReload(){

    if(player.reloading) return;

    player.ammo=0;

    player.reloading=true;

    player.reloadTimer=
        player.reloadTime;
}

function fireFast(){

    if(player.weapon!=="fast") return;
    if(player.reloading) return;

    if(player.ammo<=0){

        startFastReload();
        return;
    }

    const count=player.shots;

    for(let i=0;i<count;i++){

        let offset=0;

        if(count>1){

            offset=
                (i-(count-1)/2)
                *.18;
        }

        const a=player.aim+offset;

        shots.push({

            x:player.x+
                Math.cos(a)*14,

            y:player.y+
                Math.sin(a)*14,

            vx:Math.cos(a)*player.bulletSpeed,
            vy:Math.sin(a)*player.bulletSpeed,

            r:5,
            life:1.5,

            damage:player.damage,

            pierceLeft:0
        });
    }

    player.ammo--;

    shoot=player.fireRate;

    if(player.ammo<=0){
        startFastReload();
    }
}

function fireScatter(){

    if(player.weapon!=="scatter") return;

    if(shoot>0) return;

    const count=player.shots;

    for(let i=0;i<count;i++){

        let offset=0;

        if(count>1){

            offset=
                (i-(count-1)/2)
                *.055;
        }

        const a=player.aim+offset;

        shots.push({

            x:player.x+
                Math.cos(a)*14,

            y:player.y+
                Math.sin(a)*14,

            vx:Math.cos(a)*player.bulletSpeed,
            vy:Math.sin(a)*player.bulletSpeed,

            r:5,
            life:1.5,

            damage:player.scatterDamage,

            pierceLeft:
                player.scatterPierce?1:0
        });
    }

    shoot=player.scatterFireRate;
}


/* =========================================================
   TOUCH JOYSTICK HELPERS
========================================================= */

function setJoystick(j,touch){

    let dx=touch.clientX-j.x;
    let dy=touch.clientY-j.y;

    const d=Math.hypot(dx,dy);

    if(d>j.r){

        dx/=d;
        dy/=d;

        dx*=j.r;
        dy*=j.r;
    }

    j.tx=dx;
    j.ty=dy;

    if(d>4){

        j.dx=dx/j.r;
        j.dy=dy/j.r;
    }
    else{

        j.dx=0;
        j.dy=0;
    }
}

function beginAimTouch(touch){

    const dx=touch.clientX-aimJoy.x;
    const dy=touch.clientY-aimJoy.y;

    if(Math.hypot(dx,dy)>aimJoy.r+30){
        return false;
    }

    aimTouchId=touch.identifier;

    aimJoy.on=true;

    setJoystick(aimJoy,touch);

    player.aimTarget=
        Math.atan2(
            aimJoy.dy,
            aimJoy.dx
        );

    if(player.weapon==="fast"){
        fireFast();
    }
    else if(player.weapon==="scatter"){
        fireScatter();
    }
    else{
        fireBase();
    }

    return true;
}

function beginMoveTouch(touch){

    const dx=touch.clientX-joy.x;
    const dy=touch.clientY-joy.y;

    if(Math.hypot(dx,dy)>joy.r+30){
        return false;
    }

    moveTouchId=touch.identifier;

    joy.on=true;

    setJoystick(joy,touch);

    return true;
}


/* =========================================================
   UI GEOMETRY
========================================================= */

function getMenuButtonRect(index){

    const bw=Math.min(300,W-50);
    const bh=52;

    const x=(W-bw)/2;

    let y=H/2-15;

    if(index===1){
        y=H/2+58;
    }

    if(index===2){
        y=H/2+120;
    }

    return {
        x:x,
        y:y,
        w:bw,
        h:
            index===0
            ?60
            :bh
    };
}

function getSettingsPanel(){

    const panelW=Math.min(560,W-28);
    const panelH=Math.min(430,H-30);

    return {
        x:(W-panelW)/2,
        y:(H-panelH)/2,
        w:panelW,
        h:panelH
    };
}

function getDeviceRects(){

    const p=getSettingsPanel();

    const gap=12;

    const mobileW=
        Math.min(
            210,
            (p.w-gap)/2
        );

    const computerW=
        Math.min(
            190,
            (p.w-gap)/2
        );

    const total=
        mobileW+
        gap+
        computerW;

    const x=
        p.x+
        (p.w-total)/2;

    return {

        mobile:{
            x:x,
            y:p.y+65,
            w:mobileW,
            h:78
        },

        computer:{
            x:x+mobileW+gap,
            y:p.y+65,
            w:computerW,
            h:78
        }
    };
}

function getAutoShootRect(){

    const p=getSettingsPanel();

    return {
        x:p.x+22,
        y:p.y+175,
        w:p.w-44,
        h:58
    };
}

function getBackRect(){

    const p=getSettingsPanel();

    return {
        x:p.x+22,
        y:p.y+p.h-70,
        w:p.w-44,
        h:48
    };
}

function getWeaponCardRects(){

    const portrait=H>W;

    if(portrait){

        const w=Math.min(330,W-40);
        const h=175;
        const gap=12;

        const total=h*2+gap;
        const startY=
            Math.max(
                120,
                (H-total)/2
            );

        return [

            {
                x:(W-w)/2,
                y:startY,
                w:w,
                h:h
            },

            {
                x:(W-w)/2,
                y:startY+h+gap,
                w:w,
                h:h
            }

        ];
    }

    const gap=14;

    const w=
        Math.min(
            230,
            (W-70-gap)/2
        );

    const h=175;

    const total=w*2+gap;

    const startX=(W-total)/2;
    const y=(H-h)/2+15;

    return [

        {
            x:startX,
            y:y,
            w:w,
            h:h
        },

        {
            x:startX+w+gap,
            y:y,
            w:w,
            h:h
        }

    ];
}

function pointInRect(x,y,r){

    return (
        x>=r.x &&
        x<=r.x+r.w &&
        y>=r.y &&
        y<=r.y+r.h
    );
}

function pointInCard(x,y,card){

    return pointInRect(x,y,card);
}

function getUpgradeCardRects(){

    if(player.weapon==="scatter"){

        const w=Math.min(430,W-40);
        const h=190;

        return [

            {
                x:(W-w)/2,
                y:(H-h)/2,
                w:w,
                h:h
            }

        ];
    }

    const portrait=H>W;

    if(portrait){

        const w=Math.min(360,W-40);
        const h=170;
        const gap=12;

        const total=h*2+gap;

        const startY=
            Math.max(
                110,
                (H-total)/2
            );

        return [

            {
                x:(W-w)/2,
                y:startY,
                w:w,
                h:h
            },

            {
                x:(W-w)/2,
                y:startY+h+gap,
                w:w,
                h:h
            }

        ];
    }

    const gap=14;

    const w=
        Math.min(
            270,
            (W-70-gap)/2
        );

    const h=190;

    const total=w*2+gap;

    const startX=(W-total)/2;

    return [

        {
            x:startX,
            y:(H-h)/2,
            w:w,
            h:h
        },

        {
            x:startX+w+gap,
            y:(H-h)/2,
            w:w,
            h:h
        }

    ];
}

function pointInUpgradeCard(x,y,card){

    return pointInRect(x,y,card);
}

    upgradeChoices=[];

    weaponChoiceOpen=true;
    paused=false;
}

function chooseWeapon(i){

    if(i===0){

        equippedWeapon="scatter";
        equipScatterBlaster();
    }

    if(i===1){

        equippedWeapon="fast";
        equipFastPewPew();
    }

    weaponChoiceOpen=false;

    upgradeChoices=[];

    shoot=0;
}


/* =========================================================
   UPGRADES
========================================================= */

function openUpgrades(){

    upgradeChoices=[];

    weaponChoiceOpen=false;

    if(player.weapon==="scatter"){

        const next=
            scatterTierUpgrades.find(
                u=>u.tier===player.scatterTier+1
            );

        if(next){

            upgradeChoices=[next];

            upgradeOpen=true;
        }

        return;
    }

    if(player.weapon==="fast"){

        const pool=[
            ...fastPewPewUpgrades
        ];

        while(
            upgradeChoices.length<2 &&
            pool.length
        ){

            const i=
                Math.floor(
                    Math.random()*pool.length
                );

            upgradeChoices.push(
                pool.splice(i,1)[0]
            );
        }

        upgradeOpen=true;
    }
}

function chooseUpgrade(i){

    const choice=
        upgradeChoices[i];

    if(!choice) return;

    choice.apply();

    shots=[];
    enemyShots=[];

    upgradeChoices=[];

    upgradeOpen=false;

    shoot=0;
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!started) return;
    if(gameOver) return;
    if(upgradeOpen) return;
    if(weaponChoiceOpen) return;

    paused=!paused;
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !started ||
        gameOver ||
        paused ||
        upgradeOpen ||
        weaponChoiceOpen
    ){
        return;
    }

    /* ---------------------------------------------
       MOVEMENT
    --------------------------------------------- */

    let mx=joy.dx;
    let my=joy.dy;

    const md=Math.hypot(mx,my);

    if(md>1){

        mx/=md;
        my/=md;
    }

    player.x+=mx*player.speed*dt;
    player.y+=my*player.speed*dt;

    player.x=Math.max(
        arena.left+player.r,
        Math.min(
            arena.right-player.r,
            player.x
        )
    );

    player.y=Math.max(
        arena.top+player.r,
        Math.min(
            gameBottom-player.r,
            player.y
        )
    );


    /* ---------------------------------------------
       AIM
    --------------------------------------------- */

    if(aimJoy.on){

        if(
            Math.abs(aimJoy.dx)>0.01 ||
            Math.abs(aimJoy.dy)>0.01
        ){

            player.aimTarget=
                Math.atan2(
                    aimJoy.dy,
                    aimJoy.dx
                );
        }
    }
    else if(autoShoot){

        const target=getClosestEnemy();

        if(target){

            player.aimTarget=
                Math.atan2(
                    target.y-player.y,
                    target.x-player.x
                );
        }
    }

    let diff=
        player.aimTarget-player.aim;

    while(diff>Math.PI){
        diff-=Math.PI*2;
    }

    while(diff<-Math.PI){
        diff+=Math.PI*2;
    }

    player.aim+=
        diff*
        Math.min(
            1,
            dt*10*player.aimSensitivity
        );


    /* ---------------------------------------------
       WAVE BREAK
    --------------------------------------------- */

    if(waveBreakTimer>0){

        waveBreakTimer-=dt;

        if(waveBreakTimer<=0){
            startWave();
        }

        return;
    }


    /* ---------------------------------------------
       SPAWNING
    --------------------------------------------- */

    if(waveSpawned<waveTotal){

        waveSpawnTimer-=dt;

        if(waveSpawnTimer<=0){

            if(
                isBossWave(wave) &&
                waveSpawned===
                waveTotal-1
            ){
                spawnBoss();
            }
            else{
                spawnNormalEnemy();
            }

            waveSpawned++;

            waveSpawnTimer=
                getWaveSpawnSpeed(wave);
        }
    }


    /* ---------------------------------------------
       FAST RELOAD
    --------------------------------------------- */

    if(player.reloading){

        player.reloadTimer-=dt;

        if(player.reloadTimer<=0){

            player.reloading=false;

            player.ammo=
                player.maxAmmo;
        }
    }


    /* ---------------------------------------------
       AUTO SHOOT
    --------------------------------------------- */

    if(autoShoot){

        if(player.weapon==="fast"){

            if(!player.reloading){
                fireFast();
            }
        }
        else if(player.weapon==="scatter"){

            fireScatter();
        }
        else{

            fireBase();
        }
    }


    shoot-=dt;


    /* ---------------------------------------------
       MANUAL SHOOT
    --------------------------------------------- */

    if(aimJoy.on){

        if(player.weapon==="fast"){
            fireFast();
        }
        else if(player.weapon==="scatter"){
            fireScatter();
        }
        else{
            fireBase();
        }
    }


    /* ---------------------------------------------
       ENEMIES
    --------------------------------------------- */

    for(const e of enemies){

        const dx=player.x-e.x;
        const dy=player.y-e.y;

        const d=Math.hypot(dx,dy);

        if(d>0){

            e.x+=
                dx/d*
                e.speed*
                dt;

            e.y+=
                dy/d*
                e.speed*
                dt;
        }


        /* Normal enemy attacks */

        if(!e.isBoss){

            e.shoot-=dt;

            if(e.shoot<=0){

                enemyFireAtPlayer(e);

                e.shoot=
                    1+
                    Math.random()*2;
            }
        }


        /* Boss attacks */

        if(e.isBoss){

            const attackMultiplier=
                e.hp<=250
                ?2
                :1;

            e.radialShoot-=dt;

            if(e.radialShoot<=0){

                bossRadialFire(e);

                e.radialShoot=
                    5/
                    attackMultiplier;
            }

            e.bigShoot-=dt;

            if(e.bigShoot<=0){

                bossBigFire(e);

                e.bigShoot=
                    2.5/
                    attackMultiplier;
            }
        }


        /* Player collision */

        const pdx=player.x-e.x;
        const pdy=player.y-e.y;

        const pd=
            Math.hypot(pdx,pdy);

        if(
            pd<
            player.r+e.r
        ){

            player.hp-=
                (e.isBoss?25:18)*
                dt;
        }
    }


    /* ---------------------------------------------
       PLAYER SHOTS
    --------------------------------------------- */

    for(const s of shots){

        s.x+=s.vx*dt;
        s.y+=s.vy*dt;

        s.life-=dt;

        for(const e of enemies){

            if(e.hp<=0) continue;

            const dx=e.x-s.x;
            const dy=e.y-s.y;

            const d=
                Math.hypot(dx,dy);

            if(
                d<
                e.r+s.r
            ){

                e.hp-=s.damage;

                if(
                    s.pierceLeft>0
                ){

                    s.pierceLeft--;

                    s.damage*=.5;
                }
                else{

                    s.life=0;
                }

                if(e.hp<=0){

                    score+=
                        e.isBoss
                        ?100
                        :10;

                    orbs.push({

                        x:e.x,
                        y:e.y,

                        r:6,

                        value:25
                    });

                    if(e.isBoss){

                        for(let i=0;i<4;i++){

                            orbs.push({

                                x:e.x+
                                    (Math.random()-.5)*50,

                                y:e.y+
                                    (Math.random()-.5)*50,

                                r:6,

                                value:25
                            });
                        }
                    }
                }

                break;
            }
        }
    }


    /* ---------------------------------------------
       ENEMY SHOTS
    --------------------------------------------- */

    for(const s of enemyShots){

        s.x+=s.vx*dt;
        s.y+=s.vy*dt;

        s.life-=dt;

        const dx=
            player.x-s.x;

        const dy=
            player.y-s.y;

        const d=
            Math.hypot(dx,dy);

        if(
            d<
            player.r+s.r
        ){

            player.hp-=s.damage;

            s.life=0;
        }
    }


    /* ---------------------------------------------
       REMOVE DEAD ENEMIES
    --------------------------------------------- */

    enemies=
        enemies.filter(
            e=>e.hp>0
        );

    shots=
        shots.filter(
            s=>
                s.life>0 &&
                s.x>-100 &&
                s.x<W+100 &&
                s.y>-100 &&
                s.y<H+100
        );

    enemyShots=
        enemyShots.filter(
            s=>
                s.life>0 &&
                s.x>-150 &&
                s.x<W+150 &&
                s.y>-150 &&
                s.y<H+150
        );


    /* ---------------------------------------------
       XP ORBS
    --------------------------------------------- */

    for(const o of orbs){

        const dx=player.x-o.x;
        const dy=player.y-o.y;

        const d=
            Math.hypot(dx,dy);

        if(d<player.magnet){

            if(d>0){

                const pull=
                    d<
                    18
                    ?500
                    :220;

                o.x+=
                    dx/d*
                    pull*
                    dt;

                o.y+=
                    dy/d*
                    pull*
                    dt;
            }
        }

        const pdx=player.x-o.x;
        const pdy=player.y-o.y;

        const pd=
            Math.hypot(pdx,pdy);

        if(pd<player.r+o.r+4){

            xp+=o.value;

            o.collected=true;
        }
    }

    orbs=
        orbs.filter(
            o=>!o.collected
        );


    /* ---------------------------------------------
       LEVEL UP
    --------------------------------------------- */

    while(xp>=xpNext){

        xp-=xpNext;

        level++;

        xpNext=
            Math.floor(
                xpNext*1.25
            );

        if(level===2){

            if(!equippedWeapon){

                openWeaponChoice();

            }
            else{

                openUpgrades();
            }

            return;
        }

        if(level>2){

            openUpgrades();

            return;
        }
    }


    /* ---------------------------------------------
       GAME OVER
    --------------------------------------------- */

    if(player.hp<=0){

        player.hp=0;

        gameOver=true;
    }


    /* ---------------------------------------------
       WAVE COMPLETE
    --------------------------------------------- */

    if(
        waveSpawned>=waveTotal &&
        enemies.length===0
    ){

        completeWave();
    }
}


/* =========================================================
   DRAW HELPERS
========================================================= */

function rect(x,y,w,h,fill,stroke=null,lw=1){

    ctx.fillStyle=fill;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );

    if(stroke){

        ctx.strokeStyle=stroke;
        ctx.lineWidth=lw;

        ctx.strokeRect(
            Math.round(x)+.5,
            Math.round(y)+.5,
            Math.round(w)-1,
            Math.round(h)-1
        );
    }
}

function text(t,x,y,size,fill="#fff",align="left"){

    ctx.fillStyle=fill;

    ctx.font=
        `bold ${size}px Arial`;

    ctx.textAlign=align;
    ctx.textBaseline="middle";

    ctx.fillText(
        t,
        Math.round(x),
        Math.round(y)
    );
}

function wrapText(t,x,y,maxWidth,lineHeight){

    const words=t.split(" ");
    let line="";

    for(let n=0;n<words.length;n++){

        const test=
            line+
            words[n]+
            " ";

        if(
            ctx.measureText(test).width>
            maxWidth &&
            n>0
        ){

            ctx.fillText(
                line,
                x,
                y
            );

            line=
                words[n]+
                " ";

            y+=lineHeight;
        }
        else{

            line=test;
        }
    }

    ctx.fillText(
        line,
        x,
        y
    );
}

    ctx.strokeStyle="#dffaff";
    ctx.lineWidth=3*scale;

    ctx.strokeRect(
        -24*scale,
        -17*scale,
        48*scale,

    ctx.moveTo(
        -8*scale,
        20*scale

    rect(
        arena.left,

    ctx.clip();

    ctx.globalAlpha=.13;

    ctx.strokeStyle="#42515e";
    ctx.lineWidth=1;

    for(
        let x=arena.left;
        x<arena.right;
        x+=32
    ){

        ctx.beginPath();
        ctx.moveTo(x,arena.top);
        ctx.lineTo(x,gameBottom);
        ctx.stroke();
    }

    for(
        let y=arena.top;
        y<gameBottom;
        y+=32
    ){

        ctx.beginPath();
        ctx.moveTo(arena.left,y);
        ctx.lineTo(arena.right,y);
        ctx.stroke();
    }

    ctx.restore();


    /* border */

    ctx.strokeStyle="#263742";
    ctx.lineWidth=2;

    ctx.strokeRect(
        arena.left,
        arena.top,
        arena.right-arena.left,
        gameBottom-arena.top
    );


    /* control strip */

    rect(
        0,
        controlTop,
        W,
        H-controlTop,
        "#090d13"
    );

    ctx.strokeStyle="#25343f";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        controlTop
    );

    ctx.lineTo(
        W,
        controlTop
    );

    ctx.stroke();
}

/* =========================================================
   JOYSTICK DRAW
========================================================= */

function drawJoystick(j){

    ctx.save();

    /*
       FIXED BLACK-SCREEN BUG:
       This must use a normal ternary expression.
    */

    ctx.globalAlpha=
        j.on
        ? .35
        : .2;

    ctx.strokeStyle="#8ea8b6";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        j.x,
        j.y,
        j.r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha=
        j.on
        ? .55
        : .3;

    ctx.fillStyle="#78929f";

    ctx.beginPath();

    ctx.arc(
        j.x+j.tx,
        j.y+j.ty,
        j.knobR,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

function drawAimJoystick(){

    ctx.save();

    /*
       Same corrected ternary syntax here.
    */

    ctx.globalAlpha=
        aimJoy.on
        ? .35
        : .2;

    ctx.strokeStyle="#8ea8b6";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        aimJoy.x,
        aimJoy.y,
        aimJoy.r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha=
        aimJoy.on
        ? .55
        : .3;

    ctx.fillStyle="#78929f";

    ctx.beginPath();

    ctx.arc(
        aimJoy.x+aimJoy.tx,
        aimJoy.y+aimJoy.ty,
        aimJoy.knobR,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   TOUCH INPUT
========================================================= */

c.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        for(const touch of e.changedTouches){

            const x=touch.clientX;
            const y=touch.clientY;


            /* -----------------------------------------
               MENU
            ----------------------------------------- */

            if(!started){

                if(settingsOpen){

                    const devices=
                        getDeviceRects();

                    if(
                        pointInRect(
                            x,y,
                            devices.mobile
                        )
                    ){

                        selectedDevice="mobile";

                        settingsOpen=false;

                        continue;
                    }

                    if(
                        pointInRect(
                            x,y,
                            devices.computer
                        )
                    ){

                        continue;
                    }

                    const auto=
                        getAutoShootRect();

                    if(
                        pointInRect(
                            x,y,
                            auto
                        )
                    ){

                        autoShoot=!autoShoot;

                        continue;
                    }

                    const back=
                        getBackRect();

                    if(
                        pointInRect(
                            x,y,
                            back
                        )
                    ){

                        settingsOpen=false;

                        continue;
                    }

                    continue;
                }


                if(loadoutOpen){

                    const cards=
                        getWeaponCardRects();

                    for(
                        let i=0;
                        i<cards.length;
                        i++
                    ){

                        if(
                            pointInCard(
                                x,
                                y,
                                cards[i]
                            )
                        ){

                            equippedWeapon=
                                i===0
                                ?"scatter"
                                :"fast";

                            loadoutOpen=false;

                            applyEquippedWeapon();

                            continue;
                        }
                    }

                    if(
                        x>=18 &&
                        x<=90 &&
                        y>=18 &&
                        y<=52
                    ){

                        loadoutOpen=false;
                    }

                    continue;
                }


                const play=
                    getMenuButtonRect(0);

                const weapons=
                    getMenuButtonRect(1);

                const settings=
                    getMenuButtonRect(2);


                if(
                    pointInRect(
                        x,y,play
                    )
                ){

                    startGame();

                    continue;
                }

                if(
                    pointInRect(
                        x,y,weapons
                    )
                ){

                    loadoutOpen=true;

                    continue;
                }

                if(
                    pointInRect(
                        x,y,settings
                    )
                ){

                    settingsOpen=true;

                    continue;
                }

                continue;
            }


            /* -----------------------------------------
               GAME OVER
            ----------------------------------------- */

            if(gameOver){

                const r={
                    x:W/2-130,
                    y:H/2+35,
                    w:260,
                    h:55
                };

                if(
                    pointInRect(
                        x,y,r
                    )
                ){

                    startGame();
                }

                continue;
            }


            /* -----------------------------------------
               WEAPON CHOICE
            ----------------------------------------- */

            if(weaponChoiceOpen){

                const cards=
                    getWeaponCardRects();

                for(
                    let i=0;
                    i<cards.length;
                    i++
                ){

                    if(
                        pointInCard(
                            x,y,cards[i]
                        )
                    ){

                        chooseWeapon(i);
                        break;
                    }
                }

                continue;
            }


            /* -----------------------------------------
               UPGRADE
            ----------------------------------------- */

            if(upgradeOpen){

                const cards=
                    getUpgradeCardRects();

                for(
                    let i=0;
                    i<upgradeChoices.length;
                    i++
                ){

                    if(
                        pointInUpgradeCard(
                            x,
                            y,
                            cards[i]
                        )
                    ){

                        chooseUpgrade(i);

                        break;
                    }
                }

                continue;
            }


            /* -----------------------------------------
               PAUSE
            ----------------------------------------- */

            const pause=
                getPauseRect();

            if(
                pointInRect(
                    x,y,pause
                )
            ){

                togglePause();

                continue;
            }


            if(paused){
                continue;
            }


            /* -----------------------------------------
               TWO-FINGER CONTROLS
            ----------------------------------------- */

            if(
                aimTouchId===null &&
                beginAimTouch(touch)
            ){

                continue;
            }

            if(
                moveTouchId===null &&
                beginMoveTouch(touch)
            ){

                continue;
            }
        }
    },
    {passive:false}
);


/* =========================================================
   TOUCH MOVE
========================================================= */

c.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(const touch of e.changedTouches){

            if(
                touch.identifier===
                aimTouchId
            ){

                setJoystick(
                    aimJoy,
                    touch
                );

                if(
                    Math.abs(aimJoy.dx)>.01 ||
                    Math.abs(aimJoy.dy)>.01
                ){

                    player.aimTarget=
                        Math.atan2(
                            aimJoy.dy,
                            aimJoy.dx
                        );
                }
            }

            if(
                touch.identifier===
                moveTouchId
            ){

                setJoystick(
                    joy,
                    touch
                );
            }
        }
    },
    {passive:false}
);


/* =========================================================
   TOUCH END
========================================================= */

function endTouches(e){

    e.preventDefault();

    for(const touch of e.changedTouches){

        if(
            touch.identifier===
            aimTouchId
        ){

            aimTouchId=null;

            aimJoy.on=false;

            aimJoy.tx=0;
            aimJoy.ty=0;

            aimJoy.dx=1;
            aimJoy.dy=0;
        }

        if(
            touch.identifier===
            moveTouchId
        ){

            moveTouchId=null;

            joy.on=false;

            joy.tx=0;
            joy.ty=0;

            joy.dx=0;
            joy.dy=0;
        }
    }
}

c.addEventListener(
    "touchend",
    endTouches,
    {passive:false}
);

c.addEventListener(
    "touchcancel",
    endTouches,
    {passive:false}
);

        }


        if(weaponChoiceOpen){

            const cards=
                getWeaponCardRects();

            for(
                let i=0;
                i<cards.length;
                i++
            ){

                if(
                    pointInCard(
                        x,y,cards[i]
                    )
                ){

                    chooseWeapon(i);
                    return;
                }
            }

            return;
        }


        if(upgradeOpen){

            const cards=
                getUpgradeCardRects();

            for(
                let i=0;
                i<upgradeChoices.length;
                i++
            ){

                if(
                    pointInUpgradeCard(
                        x,y,cards[i]
                    )
                ){

                    chooseUpgrade(i);
                    return;
                }
            }

            return;
        }


        if(
            pointInRect(
                x,y,
                getPauseRect()
            )
        ){

            togglePause();
            return;
        }

        if(paused){
            return;
        }


        /* Aim first */

        const adx=x-aimJoy.x;
        const ady=y-aimJoy.y;

        if(
            Math.hypot(adx,ady)
            <=aimJoy.r+30
        ){

            pointerAim=true;

            aimJoy.on=true;

            setJoystick(
                aimJoy,
                {
                    clientX:x,
                    clientY:y
                }
            );

            player.aimTarget=
                Math.atan2(
                    aimJoy.dy,
                    aimJoy.dx
                );

            return;
        }


        /* Movement */

        const mdx=x-joy.x;
        const mdy=y-joy.y;

        if(
            Math.hypot(mdx,mdy)
            <=joy.r+30
        ){

            pointerMove=true;

            joy.on=true;

            setJoystick(
                joy,
                {
                    clientX:x,
                    clientY:y
                }
            );
        }
    }
);

c.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerType==="touch"){
            return;
        }

        if(pointerAim){

            setJoystick(
                aimJoy,
                {
                    clientX:e.clientX,
                    clientY:e.clientY
                }
            );

            player.aimTarget=
                Math.atan2(
                    aimJoy.dy,
                    aimJoy.dx
                );
        }

        if(pointerMove){

            setJoystick(
                joy,
                {
                    clientX:e.clientX,
                    clientY:e.clientY
                }
            );
        }
    }
);

function pointerEnd(){

    pointerAim=false;
    pointerMove=false;

    aimJoy.on=false;

    aimJoy.tx=0;
    aimJoy.ty=0;

    aimJoy.dx=1;
    aimJoy.dy=0;

    joy.on=false;

    joy.tx=0;
    joy.ty=0;

    joy.dx=0;
    joy.dy=0;
}

window.addEventListener(
    "pointerup",
    pointerEnd
);

window.addEventListener(
    "pointercancel",
    pointerEnd
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="p" ||
            e.key==="P" ||
            e.key==="Escape"
        ){

            togglePause();
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(t){

    if(!last){
        last=t;
    }

    let dt=
        (t-last)/1000;

    last=t;

    dt=Math.min(
        dt,
        .033
    );

    update(dt);

    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIALIZE
========================================================= */

resize();

player.x=W/2;

player.y=
    arena.top+
    (gameBottom-arena.top)/2;

requestAnimationFrame(loop);

</script>

</html>
