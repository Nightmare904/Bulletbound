<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bulletbound Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),ctx=c.getContext("2d");let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
const player={x:0,y:0,r:15,hp:100,maxHp:100,shots:1,damage:20,speed:220,magnet:70,bulletSpeed:480,fireRate:.28,aim:0};
let enemies=[],shots=[],enemyShots=[],orbs=[],score=0,wave=1,spawn=0,shoot=0,last=0,xp=0,level=1,xpNext=100,paused=false,upgradeChoices=[],upgradeOpen=false,gameOver=false;
let joy={on:false,x:82,y:0,tx:82,ty:0,dx:0,dy:0,r:58,knobR:24};let aimJoy={on:false,x:0,y:0,tx:0,ty:0,dx:1,dy:0,r:58,knobR:24};
const upgrades=[
{name:"Double Shot",desc:"Fire 2 bullets at a time",apply:()=>player.shots*=2},
{name:"Rapid Fire",desc:"Fire twice as fast",apply:()=>player.fireRate*=.5},
{name:"Triple Velocity",desc:"Bullets move 3× faster",apply:()=>player.bulletSpeed*=3},
{name:"Double Damage",desc:"Bullets deal 2× damage",apply:()=>player.damage*=2}];
function reset(){player.x=W/2;player.y=H/2;player.hp=100;player.maxHp=100;player.shots=1;player.damage=20;player.speed=220;player.magnet=70;player.bulletSpeed=480;player.fireRate=.28;player.aim=0;enemies=[];shots=[];enemyShots=[];orbs=[];score=0;xp=0;level=1;xpNext=100;upgradeChoices=[];upgradeOpen=false;paused=false;wave=1;spawn=.2;shoot=0;gameOver=false;aimJoy.on=false;aimJoy.dx=1;aimJoy.dy=0;for(let i=0;i<3;i++)spawnEnemy()}
function spawnEnemy(){const side=Math.floor(Math.random()*4);let x=side===0?-30:side===1?W+30:Math.random()*W,y=side===2?-30:side===3?H+30:Math.random()*H;enemies.push({x,y,r:14,hp:40+wave*5,speed:35+Math.random()*20,shoot:1+Math.random()*2,color:Math.random()<.5?"#ff4f70":"#a66cff"})}
function joystickPos(){joy.x=82;joy.y=H-82}function aimJoystickPos(){aimJoy.x=W-65;aimJoy.y=H-65}
function setJoystick(px,py){joystickPos();let dx=px-joy.x,dy=py-joy.y,l=Math.hypot(dx,dy)||1,max=joy.r;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.dx=dx/max;joy.dy=dy/max;joy.tx=joy.x+dx;joy.ty=joy.y+dy}
function setAimJoystick(px,py){aimJoystickPos();let dx=px-aimJoy.x,dy=py-aimJoy.y,l=Math.hypot(dx,dy)||1,max=aimJoy.r;if(l>max){dx=dx/l*max;dy=dy/l*max}if(l>.01){aimJoy.dx=dx/max;aimJoy.dy=dy/max;player.aim=Math.atan2(aimJoy.dy,aimJoy.dx)}aimJoy.tx=aimJoy.x+dx;aimJoy.ty=aimJoy.y+dy}
function pointInPause(x,y){return x>=W-110&&x<=W-16&&y>=12&&y<=44}
function pointInUpgrade(x,y,i){const gap=16,cardW=Math.min(300,(W-32-gap)/2),totalW=cardW*2+gap,startX=(W-totalW)/2,cardY=H/2-75,xx=startX+i*(cardW+gap);return x>=xx&&x<=xx+cardW&&y>=cardY&&y<=cardY+150}
c.addEventListener("pointerdown",e=>{if(gameOver){reset();return}if(!upgradeOpen&&pointInPause(e.clientX,e.clientY)){paused=!paused;return}if(upgradeOpen){for(let i=0;i<2;i++)if(pointInUpgrade(e.clientX,e.clientY,i)){chooseUpgrade(i);return}return}joystickPos();aimJoystickPos();const ad=Math.hypot(e.clientX-aimJoy.x,e.clientY-aimJoy.y),jd=Math.hypot(e.clientX-joy.x,e.clientY-joy.y);if(ad<aimJoy.r+20){aimJoy.on=true;setAimJoystick(e.clientX,e.clientY);return}if(jd<joy.r+20){joy.on=true;setJoystick(e.clientX,e.clientY)}});
c.addEventListener("pointermove",e=>{if(joy.on)setJoystick(e.clientX,e.clientY);if(aimJoy.on)setAimJoystick(e.clientX,e.clientY)});addEventListener("pointerup",()=>{joy.on=false;joy.dx=0;joy.dy=0;joystickPos();joy.tx=joy.x;joy.ty=joy.y;aimJoy.on=false;aimJoystickPos();aimJoy.tx=aimJoy.x;aimJoy.ty=aimJoy.y});addEventListener("keydown",e=>{if(e.key.toLowerCase()==="p"||e.key==="Escape")togglePause()});
function update(dt){if(gameOver||paused||upgradeOpen)return;let dx=joy.dx,dy=joy.dy;if(Math.hypot(dx,dy)>.05){player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt}player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(62,Math.min(H-18,player.y));spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.55,1.25-wave*.03)}shoot-=dt;if(shoot<=0&&aimJoy.on){const a=player.aim;for(let i=0;i<player.shots;i++){const aa=a+(i-(player.shots-1)/2)*.18;shots.push({x:player.x,y:player.y,vx:Math.cos(aa)*player.bulletSpeed,vy:Math.sin(aa)*player.bulletSpeed,r:5,life:1.5,damage:player.damage})}shoot=player.fireRate}for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;e.shoot-=dt;if(e.shoot<=0){enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*130,vy:Math.sin(a)*130,r:6,life:5});e.shoot=2.5}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){player.hp-=25;e.x-=Math.cos(a)*25;e.y-=Math.sin(a)*25}}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}for(const s of enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r){player.hp-=15;s.life=0}}for(const s of shots){for(const e of enemies){if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){e.hp-=s.damage;s.life=0;if(e.hp<=0){score+=10;orbs.push({x:e.x,y:e.y})}break}}}shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);enemyShots=enemyShots.filter(s=>s.life>0);enemies=enemies.filter(e=>e.hp>0);for(const o of orbs){if(Math.hypot(o.x-player.x,o.y-player.y)<player.magnet){o.x+=(player.x-o.x)*dt*4;o.y+=(player.y-o.y)*dt*4}if(Math.hypot(o.x-player.x,o.y-player.y)<18){o.dead=true;xp+=25;while(xp>=xpNext){xp-=xpNext;level++;xpNext=Math.floor(xpNext*1.25);openUpgrades();break}}}orbs=orbs.filter(o=>!o.dead);wave=Math.floor(score/100)+1;if(player.hp<=0)gameOver=true}
function openUpgrades(){upgradeOpen=true;paused=false;upgradeChoices=[];const pool=[...upgrades];while(upgradeChoices.length<2){const i=Math.floor(Math.random()*pool.length);upgradeChoices.push(pool.splice(i,1)[0])}}
function chooseUpgrade(i){if(!upgradeOpen||!upgradeChoices[i])return;upgradeChoices[i].apply();upgradeChoices=[];upgradeOpen=false;paused=false;shoot=0}
function togglePause(){if(gameOver||upgradeOpen)return;paused=!paused}
function draw(){ctx.fillStyle="#080a10";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#141a26";ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,50);ctx.lineTo(x,H);ctx.stroke()}for(let y=50;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle="#fff";ctx.font="bold 15px system-ui";ctx.fillText("WAVE "+wave,16,24);ctx.fillText("SCORE "+score,W-100,24);ctx.fillStyle="#65e6ff";ctx.fillRect(16,50,150,7);ctx.fillRect(16,50,150*Math.max(0,xp/xpNext),7);ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.fillText("LV "+level,172,57);ctx.font="10px system-ui";ctx.fillText(Math.floor(xp)+" / "+xpNext+" XP",16,68);ctx.fillStyle="#32141a";ctx.fillRect(16,34,150,10);ctx.fillStyle="#ff914d";ctx.fillRect(16,34,150*Math.max(0,player.hp/player.maxHp),10);for(const o of orbs){ctx.fillStyle="#65e6ff";ctx.beginPath();ctx.arc(o.x,o.y,6,0,Math.PI*2);ctx.fill()}for(const s of enemyShots){ctx.fillStyle="#ff5577";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(const s of shots){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(const e of enemies){ctx.fillStyle=e.color;ctx.fillRect(e.x-14,e.y-14,28,28);ctx.fillStyle="#111";ctx.fillRect(e.x-7,e.y-4,4,5);ctx.fillRect(e.x+3,e.y-4,4,5);ctx.fillStyle="#fff";ctx.fillRect(e.x-5,e.y+5,10,3);ctx.fillStyle="#222";ctx.fillRect(e.x-15,e.y-22,30,4);ctx.fillStyle="#72e68b";ctx.fillRect(e.x-15,e.y-22,30*Math.max(0,e.hp/(40+wave*5)),4)}ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=14;ctx.shadowColor="#42d9ff";ctx.fillStyle="#42d9ff";ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.rotate(player.aim);ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(34,0);ctx.lineTo(18,-9);ctx.lineTo(20,9);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle="#202838";ctx.fillRect(W-110,12,94,32);ctx.strokeStyle="#6fe7ff";ctx.lineWidth=2;ctx.strokeRect(W-110,12,94,32);ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(paused?"RESUME":"PAUSE",W-63,33);aimJoystickPos();ctx.globalAlpha=.75;ctx.fillStyle="#202838";ctx.beginPath();ctx.arc(aimJoy.x,aimJoy.y,aimJoy.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#6fe7ff";ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=.9;ctx.fillStyle="#42d9ff";ctx.beginPath();ctx.arc(aimJoy.tx,aimJoy.ty,aimJoy.knobR,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="bold 10px system-ui";ctx.fillText("AIM",aimJoy.x,aimJoy.y+4);joystickPos();ctx.globalAlpha=.75;ctx.fillStyle="#202838";ctx.beginPath();ctx.arc(joy.x,joy.y,joy.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#6fe7ff";ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=.9;ctx.fillStyle="#42d9ff";ctx.beginPath();ctx.arc(joy.tx,joy.ty,joy.knobR,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="bold 10px system-ui";ctx.fillText("MOVE",joy.x,joy.y+4);ctx.textAlign="left";if(upgradeOpen){ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 26px system-ui";ctx.fillText("LEVEL UP!",W/2,H/2-110);const gap=16,cardW=Math.min(300,(W-32-gap)/2),totalW=cardW*2+gap,startX=(W-totalW)/2,cardY=H/2-75;for(let i=0;i<2;i++){const u=upgradeChoices[i],x=startX+i*(cardW+gap);ctx.fillStyle="#182130";ctx.fillRect(x,cardY,cardW,150);ctx.strokeStyle="#6fe7ff";ctx.lineWidth=2;ctx.strokeRect(x,cardY,cardW,150);ctx.fillStyle="#fff";ctx.font="bold 18px system-ui";ctx.fillText(u.name,x+cardW/2,cardY+52);ctx.font="13px system-ui";ctx.fillText(u.desc,x+cardW/2,cardY+82);ctx.font="11px system-ui";ctx.fillText("TAP TO SELECT",x+cardW/2,cardY+120)}ctx.textAlign="left"}if(paused&&!upgradeOpen){ctx.fillStyle="#0008";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 32px system-ui";ctx.fillText("PAUSED",W/2,H/2);ctx.font="14px system-ui";ctx.fillText("Tap RESUME to continue",W/2,H/2+30);ctx.textAlign="left"}if(gameOver){ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 34px system-ui";ctx.fillText("RUN OVER",W/2,H/2-25);ctx.font="17px system-ui";ctx.fillText("Score: "+score,W/2,H/2+10);ctx.fillText("Tap anywhere to restart",W/2,H/2+45);ctx.textAlign="left"}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
