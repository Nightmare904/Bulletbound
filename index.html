const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W,H,dpr;

function resize(){

dpr=Math.min(devicePixelRatio||1,2);

W=innerWidth;
H=innerHeight;

c.width=W*dpr;
c.height=H*dpr;

ctx.setTransform(dpr,0,0,dpr,0,0);

aimJoystickPos();

}

// =========================
// ARENA
// =========================

const arena={
left:14,
right:0,
top:72,
bottom:0
};

let gameBottom=0;
let controlTop=0;

function updateArena(){

/*
Vertical phone layout.

The bottom section is reserved for controls.
The arena occupies most of the upper screen.
*/

const controlHeight=
Math.min(
185,
Math.max(
150,
H*.23
)
);

controlTop=
H-controlHeight;

arena.left=14;
arena.right=W-14;
arena.top=72;
arena.bottom=controlHeight;

gameBottom=controlTop-8;

}

x:0,
y:0,

tx:0,

dx:1,

// =========================
// WEAPON SETUP
// =========================

function equipScatterBlaster(){

player.weapon="scatter";

player.shots=1;

player.damage=20;

player.scatterTier=1;

player.scatterPierce=false;

player.scatterDamage=20;

player.scatterFireRate=1.5;

player.fireRate=1.5;

player.bulletSpeed=480;

shoot=0;

}


function equipFastPewPew(){

player.weapon="fast";

player.shots=1;

player.damage=10;

player.fireRate=.14;

player.bulletSpeed=480;

player.maxAmmo=8;

player.ammo=8;

player.reloadTime=2;

player.reloadTimer=0;

player.reloading=false;

shoot=0;

}


function applyEquippedWeapon(){

if(equippedWeapon==="scatter"){

equipScatterBlaster();

}

else if(equippedWeapon==="fast"){

equipFastPewPew();

}

}

// =========================

.2,
player.reloadTime-.2

// =========================
// WAVES
// =========================

function getWaveEnemyCount(w){

return 5+(w-1)*2;

}


function getWaveSpawnSpeed(w){

return Math.max(
.35,
1.15-(w-1)*.055
);

}


function getWaveEnemyHealth(w){

return 100;

}


function getWaveEnemySpeed(w){

return(
35+
Math.random()*20
)*
.5*
(
1+
(w-1)*.035
);

}


function isBossWave(w){

return w%10===0;

}


function getWaveNormalCount(w){

return getWaveEnemyCount(w);

}


function startWave(){

waveTotal=
getWaveNormalCount(wave)+
(isBossWave(wave)?1:0);

waveSpawned=0;

waveSpawnTimer=.5;

}


function completeWave(){

player.hp=player.maxHp;

wave++;

waveTotal=0;

waveSpawned=0;

waveSpawnTimer=0;

waveBreakTimer=1;

}


// =========================
// RESET
// =========================

function reset(){

updateArena();

player.x=(arena.left+arena.right)/2;

player.y=
(arena.top+gameBottom)/2;

player.hp=100;
player.maxHp=100;

player.damage=10;
player.speed=110;
player.magnet=70;
player.bulletSpeed=480;
player.fireRate=.28;
player.shots=1;

player.aim=0;
player.aimTarget=0;
player.aimSensitivity=.5;

player.weapon=null;


// Scatter

player.scatterTier=1;
player.scatterPierce=false;
player.scatterDamage=20;
player.scatterFireRate=1.5;


// Fast

player.fastDamageUpgrades=0;
player.fastAttackSpeedUpgrades=0;
player.fastVelocityUpgrades=0;
player.ammoCapacityUpgrades=0;
player.reloadTimeUpgrades=0;

player.maxAmmo=8;
player.ammo=8;

player.reloadTime=2;
player.reloadTimer=0;
player.reloading=false;


// Game

enemies=[];
shots=[];
enemyShots=[];
orbs=[];

score=0;

wave=1;
waveTotal=0;
waveSpawned=0;
waveSpawnTimer=0;
waveBreakTimer=0;

shoot=0;

xp=0;
level=1;
xpNext=100;

paused=false;

upgradeChoices=[];
upgradeOpen=false;
weaponChoiceOpen=false;
settingsOpen=false;

gameOver=false;


// Touch

moveTouchId=null;
aimTouchId=null;

joy.on=false;
joy.dx=0;
joy.dy=0;

aimJoy.on=false;
aimJoy.dx=1;
aimJoy.dy=0;

joystickPos();
aimJoystickPos();

joy.tx=joy.x;
joy.ty=joy.y;

aimJoy.tx=aimJoy.x;
aimJoy.ty=aimJoy.y;


// Apply starting weapon

applyEquippedWeapon();

}


// =========================
// START
// =========================

function startGame(){

/*
No landscape lock.
The game stays vertical inside the browser.
*/

started=true;

loadoutOpen=false;

reset();

startWave();

}


// =========================
// ENEMY
// =========================

Math.floor(Math.random()*4);

let x;
let y;

if(side===0){

x=arena.left-35;

y=
arena.top+
Math.random()*
(gameBottom-arena.top);

}

else if(side===1){

x=arena.right+35;

y=
arena.top+
Math.random()*
(gameBottom-arena.top);

}

else if(side===2){

x=
arena.left+
Math.random()*
(arena.right-arena.left);

y=arena.top-35;

else{

x=
arena.left+
Math.random()*
(arena.right-arena.left);

y=gameBottom+35;

enemies.push({

y:y,

r:14,

// =========================
// JOYSTICK POSITIONS
// =========================

function joystickPos(){

const controlHeight=
H-controlTop;

const controlY=
controlTop+
controlHeight/2;

const side=
Math.max(
68,
Math.min(
78,
W*.19
)
);

joy.x=side;
joy.y=controlY;

}


function aimJoystickPos(){

const controlHeight=
H-controlTop;

const controlY=
controlTop+
controlHeight/2;

const side=
Math.max(
68,
Math.min(
78,
W*.19
)
);

aimJoy.x=W-side;
aimJoy.y=controlY;

}


// =========================
// MOVE JOYSTICK
// =========================

function setJoystick(px,py){

joystickPos();

let dx=px-joy.x;
let dy=py-joy.y;

let l=Math.hypot(dx,dy)||1;

if(l>joy.r){

dx=dx/l*joy.r;
dy=dy/l*joy.r;

}

joy.dx=dx/joy.r;
joy.dy=dy/joy.r;

joy.tx=joy.x+dx;
joy.ty=joy.y+dy;

}


// =========================
// AIM JOYSTICK
// =========================

function setAimJoystick(px,py){

aimJoystickPos();

let dx=px-aimJoy.x;
let dy=py-aimJoy.y;

let l=Math.hypot(dx,dy)||1;

if(l>aimJoy.r){

dx=dx/l*aimJoy.r;
dy=dy/l*aimJoy.r;

}

aimJoy.dx=dx/aimJoy.r;
aimJoy.dy=dy/aimJoy.r;

aimJoy.tx=aimJoy.x+dx;
aimJoy.ty=aimJoy.y+dy;


if(
Math.abs(aimJoy.dx)>.01||
Math.abs(aimJoy.dy)>.01
){

player.aimTarget=
Math.atan2(
aimJoy.dy,
aimJoy.dx
);

}

}


// =========================
// MENU LAYOUT
// =========================

function getMenuButtonRect(index){

const bw=Math.min(300,W-50);
const bh=52;

const bx=(W-bw)/2;

let by;

if(index===0){
by=H/2-15;
}

else if(index===1){
by=H/2+58;
}

else{
by=H/2+120;
}

return{
x:bx,
y:by,
w:bw,
h:index===0?60:bh
};

}


// =========================
// SETTINGS LAYOUT
// =========================

function getSettingsPanel(){

const panelW=
Math.min(
560,
W-28
);

const panelH=
Math.min(
430,
H-30
);

const panelX=
(W-panelW)/2;

const panelY=
(H-panelH)/2;

return{
x:panelX,
y:panelY,
w:panelW,
h:panelH
};

}


function getDeviceRects(){

const panel=
getSettingsPanel();

const gap=10;

const available=
panel.w-32;

let mobileW=
Math.min(
185,
available*.54
);

let computerW=
available-gap-mobileW;

if(computerW<90){

computerW=90;

mobileW=
available-gap-computerW;

}

const deviceH=70;

const total=
mobileW+
gap+
computerW;

const startX=
(W-total)/2;

const y=
panel.y+65;

return{

mobile:{
x:startX,
y:y,
w:mobileW,
h:deviceH
},

computer:{
x:startX+mobileW+gap,
y:y,
w:computerW,
h:deviceH
}

};

}


function getAutoShootRect(){

const panel=
getSettingsPanel();

const autoW=
Math.min(
300,
panel.w-32
);

const autoH=54;

return{
x:(W-autoW)/2,
y:panel.y+170,
w:autoW,
h:autoH
};

}


function getBackRect(){

const backW=
Math.min(
180,
W-50
);

const backH=50;

return{
x:(W-backW)/2,
y:H-75,
w:backW,
h:backH
};

}

// BUTTON HITBOXES
// =========================

function pointInRect(x,y,r){

return(
x>=r.x&&
x<=r.x+r.w&&
y>=r.y&&
y<=r.y+r.h
);

}

Math.min(
330,

);

cardH*2+

h:cardH
},

190
);

cardW*2+gap;

const cardY=

{

w:cardW,
h:cardH
},

{

w:cardW,
h:cardH
}

const cards=
getWeaponCardRects();

if(!cards[i])
return false;

return pointInRect(
x,
y,
cards[i]
);

}

// =========================
// AUTO SHOOT
// =========================

function getClosestEnemy(){

let closest=null;
let best=Infinity;

for(const e of enemies){

if(e.hp<=0)
continue;

const d=Math.hypot(
e.x-player.x,
e.y-player.y
);

if(d<best){

best=d;
closest=e;

}

}

return closest;

}


function updateAutoShoot(){

if(!autoShoot || aimJoy.on)
return;

const target=getClosestEnemy();

if(!target)
return;

player.aimTarget=
Math.atan2(
target.y-player.y,
target.x-player.x
);

player.aim=player.aimTarget;


if(player.weapon===null){

if(shoot<=0)
fireBase();

}

else if(player.weapon==="fast"){

if(shoot<=0&&!player.reloading)
fireFast();

}

else if(player.weapon==="scatter"){

if(shoot<=0)
fireScatter();

}

}


// =========================
// FIRE BASE
// =========================

function fireBase(){

if(player.weapon!==null)
return;

if(shoot>0)
return;

const a=player.aim;

shots.push({

x:player.x,
y:player.y,

vx:Math.cos(a)*player.bulletSpeed,
vy:Math.sin(a)*player.bulletSpeed,

r:5,

life:1.5,

damage:10,

pierceLeft:0

});

shoot=player.fireRate;

}


// =========================
// FIRE FAST
// =========================

function fireFast(){

if(player.weapon!=="fast")
return;

if(player.reloading)
return;

if(player.ammo<=0){

startFastReload();
return;

}


const a=player.aim;

for(
let i=0;
i<player.shots;
i++
){

const aa=
a+
(
i-(player.shots-1)/2
)*.18;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage,

pierceLeft:0

});

}


player.ammo--;

shoot=player.fireRate;


if(player.ammo<=0){

startFastReload();

}

}


// =========================
// FAST RELOAD
// =========================

function startFastReload(){

player.ammo=0;

player.reloading=true;

player.reloadTimer=player.reloadTime;

}


// =========================
// FIRE SCATTER
// =========================

function fireScatter(){

if(player.weapon!=="scatter")
return;

if(shoot>0)
return;

const a=player.aim;

const spread=.055;


for(
let i=0;
i<player.shots;
i++
){

const offset=
(
i-(player.shots-1)/2
)*spread;

const aa=a+offset;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.scatterDamage,

pierceLeft:
player.scatterPierce?1:0

});

}


shoot=player.scatterFireRate;

}


// =========================
// AIM TOUCH
// =========================

function beginAimTouch(touch){

aimJoystickPos();

const x=touch.clientX;
const y=touch.clientY;

const distance=
Math.hypot(
x-aimJoy.x,
y-aimJoy.y
);

if(distance>aimJoy.r+30)
return false;

aimTouchId=touch.identifier;

aimJoy.on=true;

setAimJoystick(x,y);


if(player.weapon===null){

fireBase();

}

else if(
player.weapon==="fast"&&
!player.reloading
){

fireFast();

}

else if(player.weapon==="scatter"){

fireScatter();

}

// =========================
// UPDATE
// =========================

function update(dt){

if(
!started||
gameOver||
paused||
upgradeOpen||
weaponChoiceOpen
)
return;


// MOVEMENT

if(
Math.hypot(
joy.dx,
joy.dy
)>.05
){

player.x+=joy.dx*player.speed*dt;
player.y+=joy.dy*player.speed*dt;

}


player.x=Math.max(
arena.left+18,
Math.min(
arena.right-18,
player.x
)
);

player.y=Math.max(
arena.top+18,
Math.min(
gameBottom-18,
player.y
)
);


// AIM

if(aimJoy.on){

let diff=
player.aimTarget-player.aim;

while(diff>Math.PI)
diff-=Math.PI*2;

while(diff<-Math.PI)
diff+=Math.PI*2;

player.aim+=
diff*
Math.min(
1,
dt*10*player.aimSensitivity
);

}


// WAVE BREAK

if(waveBreakTimer>0){

waveBreakTimer-=dt;

if(waveBreakTimer<=0){

startWave();

}

}


// SPAWN

if(
waveBreakTimer<=0&&
waveSpawned<waveTotal
){

waveSpawnTimer-=dt;

if(waveSpawnTimer<=0){

const normalCount=
getWaveNormalCount(wave);


if(
isBossWave(wave)&&
waveSpawned===normalCount
){

spawnBoss();

}
else{

spawnEnemy();

}

waveSpawned++;

waveSpawnTimer=
getWaveSpawnSpeed(wave);

}

}


// WAVE COMPLETE

if(
waveBreakTimer<=0&&
waveSpawned===waveTotal&&
enemies.length===0
){

completeWave();

}


// FAST RELOAD

if(
player.weapon==="fast"&&
player.reloading
){

player.reloadTimer-=dt;

if(player.reloadTimer<=0){

player.reloadTimer=0;

player.ammo=
player.maxAmmo;

player.reloading=false;

}

}


// AUTO SHOOT

updateAutoShoot();


// FIRE TIMER

shoot-=dt;


// BASE

if(
player.weapon===null&&
aimJoy.on&&
shoot<=0
){

fireBase();

}


// FAST

if(
player.weapon==="fast"&&
aimJoy.on&&
shoot<=0&&
!player.reloading
){

fireFast();

}


// SCATTER

if(
player.weapon==="scatter"&&
aimJoy.on&&
shoot<=0
){

fireScatter();

}


// =========================
// ENEMIES
// =========================

for(const e of enemies){

const a=
Math.atan2(
player.y-e.y,
player.x-e.x
);

e.x+=Math.cos(a)*e.speed*dt;
e.y+=Math.sin(a)*e.speed*dt;


if(e.isBoss){

const attackMultiplier=
e.hp<=250?2:1;

e.radialShoot-=dt;
e.bigShoot-=dt;


if(e.radialShoot<=0){

for(let i=0;i<12;i++){

const aa=
i*(Math.PI*2/12);

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(aa)*95,
vy:Math.sin(aa)*95,

r:7,
life:7,

damage:10,
bossShot:true

});

}

e.radialShoot=
5/attackMultiplier;

}


if(e.bigShoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*55,
vy:Math.sin(a)*55,

r:14,
life:10,

damage:50,
bigBossShot:true

});

e.bigShoot=
5/attackMultiplier;

}

}
else{

e.shoot-=dt;

if(e.shoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*130,
vy:Math.sin(a)*130,

r:6,
life:5,

damage:15

});

e.shoot=2.5;

}

}


if(
Math.hypot(
e.x-player.x,
e.y-player.y
)
<
e.r+player.r
){

player.hp-=25;

e.x-=Math.cos(a)*25;
e.y-=Math.sin(a)*25;

}

}


// =========================
// PLAYER SHOTS
// =========================

for(const s of shots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
s.x<arena.left||
s.x>arena.right||
s.y<arena.top||
s.y>gameBottom
){

s.life=0;

}

}


// =========================
// ENEMY SHOTS
// =========================

for(const s of enemyShots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
Math.hypot(
s.x-player.x,
s.y-player.y
)
<
s.r+player.r
){

player.hp-=
s.damage!==undefined
?s.damage
:15;

s.life=0;

}

}


// =========================
// COLLISIONS
// =========================

for(const s of shots){

if(s.life<=0)
continue;

for(const e of enemies){

if(
e.hp>0&&
Math.hypot(
s.x-e.x,
s.y-e.y
)
<
s.r+e.r
){

e.hp-=s.damage;


if(s.pierceLeft>0){

s.damage*=.5;

s.pierceLeft--;

continue;

}

s.life=0;

break;

}

}

}


// =========================
// DEATHS
// =========================

for(const e of enemies){

if(
e.hp<=0&&
!e.dead
){

e.dead=true;

score+=e.isBoss?100:10;

orbs.push({

x:e.x,
y:e.y

});


if(e.isBoss){

for(let i=0;i<4;i++){

orbs.push({

x:e.x+
(Math.random()-.5)*30,

y:e.y+
(Math.random()-.5)*30

});

}

}

}

}


// =========================
// CLEANUP
// =========================

shots=shots.filter(
s=>
s.life>0&&
s.x>arena.left&&
s.x<arena.right&&
s.y>arena.top&&
s.y<gameBottom
);

enemyShots=enemyShots.filter(
s=>s.life>0
);

enemies=enemies.filter(
e=>e.hp>0
);


// =========================
// XP
// =========================

for(const o of orbs){

const dist=
Math.hypot(
o.x-player.x,
o.y-player.y
);

const maxDistance=
Math.hypot(W,H);

const closeness=
1-Math.min(
1,
dist/maxDistance
);

const speed=
25+
Math.pow(
closeness,
2
)*475;

if(dist>.1){

o.x+=
(player.x-o.x)/dist*
speed*dt;

o.y+=
(player.y-o.y)/dist*
speed*dt;

}


if(dist<18){

o.dead=true;

xp+=25;


while(xp>=xpNext){

xp-=xpNext;

level++;

xpNext=
Math.floor(
xpNext*1.25
);


if(level===2){

if(!player.weapon){

openWeaponChoice();

return;

}
else{

openUpgrades();

return;

}

}


if(level>2){

openUpgrades();

return;

}

}

}

}


orbs=orbs.filter(
o=>!o.dead
);


// GAME OVER

if(player.hp<=0){

gameOver=true;

}

}

// WEAPON CHOICE

function openWeaponChoice(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=true;

paused=false;

}


function chooseWeapon(i){

if(!weaponChoiceOpen)
return;

if(i===0){

equipScatterBlaster();

}
else{

equipFastPewPew();

}

weaponChoiceOpen=false;

upgradeOpen=false;

upgradeChoices=[];

shoot=0;

}


// =========================
// OPEN UPGRADES
// =========================

function openUpgrades(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;


if(player.weapon==="scatter"){

const nextTier=
player.scatterTier+1;

const nextUpgrade=
scatterTierUpgrades.find(
u=>u.tier===nextTier
);


if(nextUpgrade){

upgradeChoices.push(
nextUpgrade
);

upgradeOpen=true;

}

return;

}


if(player.weapon==="fast"){

let pool=[
...fastPewPewUpgrades
];

while(
upgradeChoices.length<2&&
pool.length>0
){

const i=
Math.floor(
Math.random()*pool.length
);

upgradeChoices.push(
pool[i]
);

pool.splice(i,1);

}

upgradeOpen=true;

}

}


// =========================
// CHOOSE UPGRADE
// =========================

function chooseUpgrade(i){

if(
!upgradeOpen||
!upgradeChoices[i]
)
return;


upgradeChoices[i].apply();

shots=[];
enemyShots=[];

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;

shoot=0;

}

draw();

requestAnimationFrame(loop);

}
