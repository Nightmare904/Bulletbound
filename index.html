<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bulletbound Prototype</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080a10;
touch-action:none
}

canvas{
display:block;
width:100%;
height:100%
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W,H,dpr;

function resize(){
dpr=Math.min(devicePixelRatio||1,2);
W=innerWidth;
H=innerHeight;

c.width=W*dpr;
c.height=H*dpr;

ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


// =========================
// ARENA
// =========================

const arena={
left:22,
right:0,
top:72,
bottom:22
};

function updateArena(){
arena.right=W-22;
}


// =========================
// PLAYER
// =========================

const player={
x:0,
y:0,
r:15,

hp:100,
maxHp:100,

damage:20,
speed:110,
magnet:70,
bulletSpeed:480,

fireRate:.28,

shots:1,

aim:0,
aimTarget:0,
aimSensitivity:.5,

weapon:null,

// Scatter Blaster upgrades
scatterPlus2:0,

// Fast Pew Pew upgrades
fastDamageUpgrades:0
};


// =========================
// GAME DATA
// =========================

let enemies=[];
let shots=[];
let enemyShots=[];
let orbs=[];

let score=0;

let wave=1;
let waveTotal=0;
let waveSpawned=0;
let waveSpawnTimer=0;
let waveBreakTimer=0;

let shoot=0;
let last=0;

let xp=0;
let level=1;
let xpNext=100;

let paused=false;

let upgradeChoices=[];
let upgradeOpen=false;

let weaponChoiceOpen=false;

let gameOver=false;


// =========================
// JOYSTICKS
// =========================

let joy={
on:false,
pointerId:null,
x:82,
y:0,
tx:82,
ty:0,
dx:0,
dy:0,
r:58,
knobR:24
};

let aimJoy={
on:false,
pointerId:null,
x:0,
y:0,
tx:0,
ty:0,
dx:1,
dy:0,
r:58,
knobR:24
};


// =========================
// UPGRADES
// =========================

const fastPewPewUpgrades=[

{
name:"Pew Pew Power",
desc:"Increase damage by 50%",
apply:()=>{
player.damage*=1.5;
player.fastDamageUpgrades++;
}
},

{
name:"Double Pew",
desc:"Fire 2 projectiles at a time",
apply:()=>{
player.shots*=2;
}
}

];


const scatterBlasterUpgrades=[

{
name:"+2 Scatter",
desc:"Fire 2 additional projectiles",
apply:()=>{
player.shots+=2;
player.scatterPlus2++;
}
},

{
name:"Double Power",
desc:"Projectiles deal 2× damage",
apply:()=>{
player.damage*=2;
}
}

];


// =========================
// WAVE SYSTEM
// =========================

function getWaveEnemyCount(w){
return 5+(w-1)*2;
}

function getWaveSpawnSpeed(w){
return Math.max(.35,1.15-(w-1)*.055);
}

function getWaveEnemyHealth(w){
return 40+w*7;
}

function getWaveEnemySpeed(w){
return (35+Math.random()*20)*.5*(1+(w-1)*.035);
}

function startWave(){

waveTotal=getWaveEnemyCount(wave);
waveSpawned=0;
waveSpawnTimer=.5;

}

function completeWave(){

player.hp=player.maxHp;

wave++;

waveTotal=0;
waveSpawned=0;
waveSpawnTimer=0;

waveBreakTimer=1;

}


// =========================
// RESET
// =========================

function reset(){

updateArena();

player.x=W/2;
player.y=(arena.top+H-arena.bottom)/2;

player.hp=100;
player.maxHp=100;

player.damage=20;
player.speed=110;
player.magnet=70;
player.bulletSpeed=480;

player.fireRate=.28;
player.shots=1;

player.aim=0;
player.aimTarget=0;
player.aimSensitivity=.5;

player.weapon=null;

player.scatterPlus2=0;
player.fastDamageUpgrades=0;

enemies=[];
shots=[];
enemyShots=[];
orbs=[];

score=0;

wave=1;
waveTotal=0;
waveSpawned=0;
waveSpawnTimer=0;
waveBreakTimer=0;

shoot=0;

xp=0;
level=1;
xpNext=100;

paused=false;

upgradeChoices=[];
upgradeOpen=false;

weaponChoiceOpen=false;

gameOver=false;

joy.on=false;
joy.pointerId=null;
joy.dx=0;
joy.dy=0;

aimJoy.on=false;
aimJoy.pointerId=null;
aimJoy.dx=1;
aimJoy.dy=0;

startWave();

}


// =========================
// ENEMY SPAWNING
// =========================

function spawnEnemy(){

const side=Math.floor(Math.random()*4);

let x;
let y;

if(side===0){
x=arena.left-35;
y=arena.top+Math.random()*(H-arena.top-arena.bottom);
}

else if(side===1){
x=arena.right+35;
y=arena.top+Math.random()*(H-arena.top-arena.bottom);
}

else if(side===2){
x=arena.left+Math.random()*(arena.right-arena.left);
y=arena.top-35;
}

else{
x=arena.left+Math.random()*(arena.right-arena.left);
y=H-arena.bottom+35;
}

enemies.push({

x,
y,

r:14,

hp:getWaveEnemyHealth(wave),

speed:getWaveEnemySpeed(wave),

shoot:1+Math.random()*2,

color:Math.random()<.5?"#ff4f70":"#a66cff"

});

}


// =========================
// JOYSTICKS
// =========================

function joystickPos(){

joy.x=82;
joy.y=H-82;

}

function aimJoystickPos(){

aimJoy.x=W-65;
aimJoy.y=H-65;

}

function setJoystick(px,py){

joystickPos();

let dx=px-joy.x;
let dy=py-joy.y;

let l=Math.hypot(dx,dy)||1;
let max=joy.r;

if(l>max){

dx=dx/l*max;
dy=dy/l*max;

}

joy.dx=dx/max;
joy.dy=dy/max;

joy.tx=joy.x+dx;
joy.ty=joy.y+dy;

}

function setAimJoystick(px,py){

aimJoystickPos();

let dx=px-aimJoy.x;
let dy=py-aimJoy.y;

let l=Math.hypot(dx,dy)||1;
let max=aimJoy.r;

if(l>max){

dx=dx/l*max;
dy=dy/l*max;

}

if(l>.01){

aimJoy.dx=dx/max;
aimJoy.dy=dy/max;

aimJoy.tx=aimJoy.x+dx;
aimJoy.ty=aimJoy.y+dy;

player.aimTarget=Math.atan2(
aimJoy.dy,
aimJoy.dx
);

}

}


// =========================
// BUTTONS
// =========================

function pointInPause(x,y){

return x>=W-110&&
x<=W-16&&
y>=12&&
y<=44;

}


function pointInCard(x,y,i){

const gap=16;

const cardW=Math.min(
300,
(W-32-gap)/2
);

const totalW=cardW*2+gap;

const startX=(W-totalW)/2;

const cardY=H/2-75;

const xx=
startX+i*(cardW+gap);

return x>=xx&&
x<=xx+cardW&&
y>=cardY&&
y<=cardY+150;

}


// =========================
// POINTER CONTROLS
// =========================

c.addEventListener("pointerdown",e=>{

if(gameOver){

reset();
return;

}


// WEAPON CHOICE HAS ABSOLUTE PRIORITY

if(weaponChoiceOpen){

for(let i=0;i<2;i++){

if(pointInCard(
e.clientX,
e.clientY,
i
)){

chooseWeapon(i);
return;

}

}

return;

}


// NORMAL UPGRADE CHOICE

if(upgradeOpen){

for(let i=0;i<2;i++){

if(pointInCard(
e.clientX,
e.clientY,
i
)){

chooseUpgrade(i);
return;

}

}

return;

}


if(pointInPause(
e.clientX,
e.clientY
)){

paused=!paused;
return;

}


if(paused)return;


joystickPos();
aimJoystickPos();

const ad=Math.hypot(
e.clientX-aimJoy.x,
e.clientY-aimJoy.y
);

const jd=Math.hypot(
e.clientX-joy.x,
e.clientY-joy.y
);


if(
ad<aimJoy.r+20&&
!aimJoy.on
){

aimJoy.on=true;

aimJoy.pointerId=e.pointerId;

setAimJoystick(
e.clientX,
e.clientY
);

return;

}


if(
jd<joy.r+20&&
!joy.on
){

joy.on=true;

joy.pointerId=e.pointerId;

setJoystick(
e.clientX,
e.clientY
);

}

});


c.addEventListener("pointermove",e=>{

if(
joy.on&&
e.pointerId===joy.pointerId
){

setJoystick(
e.clientX,
e.clientY
);

}

if(
aimJoy.on&&
e.pointerId===aimJoy.pointerId
){

setAimJoystick(
e.clientX,
e.clientY
);

}

});


function releasePointer(e){

if(
joy.on&&
e.pointerId===joy.pointerId
){

joy.on=false;
joy.pointerId=null;

joy.dx=0;
joy.dy=0;

joystickPos();

joy.tx=joy.x;
joy.ty=joy.y;

}


if(
aimJoy.on&&
e.pointerId===aimJoy.pointerId
){

aimJoy.on=false;
aimJoy.pointerId=null;

aimJoystickPos();

aimJoy.tx=aimJoy.x;
aimJoy.ty=aimJoy.y;

}

}

addEventListener(
"pointerup",
releasePointer
);

addEventListener(
"pointercancel",
releasePointer
);


addEventListener("keydown",e=>{

if(
e.key.toLowerCase()==="p"||
e.key==="Escape"
){

togglePause();

}

});


// =========================
// UPDATE
// =========================

function update(dt){

if(
gameOver||
paused||
upgradeOpen||
weaponChoiceOpen
)return;


// -------------------------
// PLAYER MOVEMENT
// -------------------------

let dx=joy.dx;
let dy=joy.dy;

if(Math.hypot(dx,dy)>.05){

player.x+=
dx*player.speed*dt;

player.y+=
dy*player.speed*dt;

}


player.x=Math.max(
arena.left+18,
Math.min(
arena.right-18,
player.x
)
);

player.y=Math.max(
arena.top+18,
Math.min(
H-arena.bottom-18,
player.y
)
);


// -------------------------
// AIM
// -------------------------

if(aimJoy.on){

let diff=
player.aimTarget-
player.aim;

while(diff>Math.PI)
diff-=Math.PI*2;

while(diff<-Math.PI)
diff+=Math.PI*2;

player.aim+=
diff*
Math.min(
1,
dt*10*player.aimSensitivity
);

}


// -------------------------
// WAVE BREAK
// -------------------------

if(waveBreakTimer>0){

waveBreakTimer-=dt;

if(waveBreakTimer<=0){

startWave();

}

}


// -------------------------
// SPAWN
// -------------------------

if(
waveBreakTimer<=0&&
waveSpawned<waveTotal
){

waveSpawnTimer-=dt;

if(waveSpawnTimer<=0){

spawnEnemy();

waveSpawned++;

waveSpawnTimer=
getWaveSpawnSpeed(wave);

}

}


// -------------------------
// WAVE COMPLETE
// -------------------------

if(
waveBreakTimer<=0&&
waveSpawned===waveTotal&&
enemies.length===0
){

completeWave();

}


// -------------------------
// SHOOTING
// -------------------------

shoot-=dt;

if(
shoot<=0&&
aimJoy.on
){

const a=player.aim;


// SCATTER BLASTER

if(player.weapon==="scatter"){

const spread=.055;

for(
let i=0;
i<player.shots;
i++
){

let offset=
(i-(player.shots-1)/2)*
spread;

const aa=a+offset;

shots.push({

x:player.x,
y:player.y,

vx:
Math.cos(aa)*
player.bulletSpeed,

vy:
Math.sin(aa)*
player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage

});

}

}


// FAST PEW PEW

else{

for(
let i=0;
i<player.shots;
i++
){

const aa=
a+
(i-(player.shots-1)/2)*.18;

shots.push({

x:player.x,
y:player.y,

vx:
Math.cos(aa)*
player.bulletSpeed,

vy:
Math.sin(aa)*
player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage

});

}

}

shoot=player.fireRate;

}


// -------------------------
// ENEMIES
// -------------------------

for(const e of enemies){

let a=Math.atan2(
player.y-e.y,
player.x-e.x
);

e.x+=
Math.cos(a)*
e.speed*
dt;

e.y+=
Math.sin(a)*
e.speed*
dt;

e.shoot-=dt;

if(e.shoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*130,
vy:Math.sin(a)*130,

r:6,
life:5

});

e.shoot=2.5;

}

if(
Math.hypot(
e.x-player.x,
e.y-player.y
)
<
e.r+player.r
){

player.hp-=25;

e.x-=
Math.cos(a)*25;

e.y-=
Math.sin(a)*25;

}

}


// -------------------------
// PLAYER PROJECTILES
// -------------------------

for(const s of shots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;


// Barrier stops projectiles.

if(
s.x<arena.left||
s.x>arena.right||
s.y<arena.top||
s.y>H-arena.bottom
){

s.life=0;

}

}


// -------------------------
// ENEMY PROJECTILES
// -------------------------

for(const s of enemyShots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
Math.hypot(
s.x-player.x,
s.y-player.y
)
<
s.r+player.r
){

player.hp-=15;

s.life=0;

}

}


// -------------------------
// PROJECTILE COLLISIONS
// -------------------------

for(const s of shots){

for(const e of enemies){

if(
e.hp>0&&
Math.hypot(
s.x-e.x,
s.y-e.y
)
<
s.r+e.r
){

e.hp-=s.damage;

s.life=0;

if(e.hp<=0){

score+=10;

orbs.push({
x:e.x,
y:e.y
});

}

break;

}

}

}


// -------------------------
// CLEANUP
// -------------------------

shots=shots.filter(s=>
s.life>0&&
s.x>arena.left&&
s.x<arena.right&&
s.y>arena.top&&
s.y<H-arena.bottom
);

enemyShots=enemyShots.filter(
s=>s.life>0
);

enemies=enemies.filter(
e=>e.hp>0
);


// =========================
// XP ORBS
// =========================

for(const o of orbs){

const dist=Math.hypot(
o.x-player.x,
o.y-player.y
);

const maxDistance=Math.hypot(
W,
H
);

const closeness=
1-Math.min(
1,
dist/maxDistance
);

const speed=
25+
Math.pow(closeness,2)*475;

if(dist>.1){

o.x+=
(player.x-o.x)/
dist*
speed*
dt;

o.y+=
(player.y-o.y)/
dist*
speed*
dt;

}


if(dist<18){

o.dead=true;

xp+=25;


// =========================
// LEVEL-UP HANDLING
// =========================

while(xp>=xpNext){

xp-=xpNext;

level++;

xpNext=
Math.floor(
xpNext*1.25
);


// LEVEL 2 IS A HARD SPECIAL CASE.
//
// The moment Level 2 is reached,
// immediately open the weapon choice
// and STOP THIS ENTIRE UPDATE.
//
// This prevents another XP orb from
// opening the normal upgrade screen
// on top of the weapon choice.

if(level===2){

openWeaponChoice();

// IMPORTANT:
// Do not continue processing XP orbs
// during this frame.

return;

}


// LEVEL 3+ NORMAL UPGRADES

if(level>2){

openUpgrades();

// Stop this update as well so another
// orb cannot open another screen.

return;

}

}

}

}

orbs=orbs.filter(
o=>!o.dead
);


// -------------------------
// GAME OVER
// -------------------------

if(player.hp<=0){

gameOver=true;

}

}


// =========================
// WEAPON CHOICE
// =========================

function openWeaponChoice(){

// Clear any normal upgrade state.

upgradeChoices=[];
upgradeOpen=false;

// Open ONLY the Level 2 weapon choice.

weaponChoiceOpen=true;

paused=false;

}


// =========================
// CHOOSE WEAPON
// =========================

function chooseWeapon(i){

if(!weaponChoiceOpen)return;


if(i===0){

// SCATTER BLASTER

player.weapon="scatter";

player.shots=1;

player.damage=20;

player.fireRate=.28*2;

}

else{

// FAST PEW PEW

player.weapon="fast";

player.shots=1;

player.damage=10;

player.fireRate=.28/2;

}


weaponChoiceOpen=false;

upgradeOpen=false;

upgradeChoices=[];

shoot=0;

}


// =========================
// NORMAL UPGRADES
// =========================

function openUpgrades(){

// Safety:
// If somehow there is no weapon,
// force the Level 2 choice instead.

if(!player.weapon){

openWeaponChoice();
return;

}


upgradeOpen=true;

weaponChoiceOpen=false;

paused=false;

upgradeChoices=[];

let pool;


// SCATTER BLASTER UPGRADES

if(player.weapon==="scatter"){

pool=[...scatterBlasterUpgrades];


// +2 Scatter can appear a maximum
// of two times.

if(player.scatterPlus2>=2){

pool=pool.filter(
u=>u.name!=="+2 Scatter"
);

}

}


// FAST PEW PEW UPGRADES

else{

pool=[...fastPewPewUpgrades];

}


// Safety.

if(pool.length===0){

upgradeOpen=false;
return;

}


// Pick up to two different upgrades.

while(
upgradeChoices.length<2&&
pool.length>0
){

const i=
Math.floor(
Math.random()*pool.length
);

upgradeChoices.push(
pool.splice(i,1)[0]
);

}

}


// =========================
// CHOOSE UPGRADE
// =========================

function chooseUpgrade(i){

if(
!upgradeOpen||
!upgradeChoices[i]
)return;

upgradeChoices[i].apply();

shots=[];
enemyShots=[];

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;

shoot=0;

}


// =========================
// PAUSE
// =========================

function togglePause(){

if(
gameOver||
upgradeOpen||
weaponChoiceOpen
)return;

paused=!paused;

}


// =========================
// DRAW
// =========================

function draw(){

// Background

ctx.fillStyle="#080a10";

ctx.fillRect(
0,
0,
W,
H
);


// Outside vision

ctx.fillStyle="#020308";

ctx.fillRect(
0,
0,
W,
arena.top
);

ctx.fillRect(
0,
H-arena.bottom,
W,
arena.bottom
);

ctx.fillRect(
0,
arena.top,
arena.left,
H-arena.top-arena.bottom
);

ctx.fillRect(
arena.right,
arena.top,
W-arena.right,
H-arena.top-arena.bottom
);


// Arena grid

ctx.save();

ctx.beginPath();

ctx.rect(
arena.left,
arena.top,
arena.right-arena.left,
H-arena.top-arena.bottom
);

ctx.clip();

ctx.strokeStyle="#141a26";
ctx.lineWidth=1;

for(
let x=arena.left;
x<arena.right;
x+=40
){

ctx.beginPath();

ctx.moveTo(x,arena.top);
ctx.lineTo(x,H-arena.bottom);

ctx.stroke();

}

for(
let y=arena.top;
y<H-arena.bottom;
y+=40
){

ctx.beginPath();

ctx.moveTo(arena.left,y);
ctx.lineTo(arena.right,y);

ctx.stroke();

}

ctx.restore();


// Arena barrier

ctx.strokeStyle="#65e6ff";
ctx.lineWidth=3;

ctx.strokeRect(
arena.left,
arena.top,
arena.right-arena.left,
H-arena.top-arena.bottom
);

ctx.strokeStyle="#23394a";
ctx.lineWidth=1;

ctx.strokeRect(
arena.left+5,
arena.top+5,
arena.right-arena.left-10,
H-arena.top-arena.bottom-10
);


// UI

ctx.fillStyle="#fff";
ctx.font="bold 15px system-ui";

ctx.fillText(
"WAVE "+wave,
16,
24
);

ctx.fillText(
"SCORE "+score,
W-100,
24
);


// XP

ctx.fillStyle="#65e6ff";

ctx.fillRect(
16,
50,
150,
7
);

ctx.fillRect(
16,
50,
150*
Math.max(
0,
xp/xpNext
),
7
);

ctx.fillStyle="#fff";

ctx.font="bold 11px system-ui";

ctx.fillText(
"LV "+level,
172,
57
);

ctx.font="10px system-ui";

ctx.fillText(
Math.floor(xp)+" / "+xpNext+" XP",
16,
68
);


// HP

ctx.fillStyle="#32141a";

ctx.fillRect(
16,
34,
150,
10
);

ctx.fillStyle="#ff914d";

ctx.fillRect(
16,
34,
150*
Math.max(
0,
player.hp/player.maxHp
),
10
);


// Wave status

ctx.textAlign="center";

if(waveBreakTimer>0){

ctx.fillStyle="#65e6ff";

ctx.font="bold 11px system-ui";

ctx.fillText(
"WAVE "+wave+" READY",
W/2,
24
);

}

else if(waveSpawned<waveTotal){

ctx.fillStyle="#fff";

ctx.font="bold 10px system-ui";

ctx.fillText(
"ENEMIES "+
waveSpawned+
" / "+
waveTotal,
W/2,
24
);

}

else if(
waveSpawned===waveTotal&&
enemies.length>0
){

ctx.fillStyle="#fff";

ctx.font="bold 10px system-ui";

ctx.fillText(
"ELIMINATE REMAINING",
W/2,
24
);

}

ctx.textAlign="left";


// XP ORBS

for(const o of orbs){

ctx.fillStyle="#65e6ff";

ctx.beginPath();

ctx.arc(
o.x,
o.y,
6,
0,
Math.PI*2
);

ctx.fill();

}


// Enemy projectiles

for(const s of enemyShots){

ctx.fillStyle="#ff5577";

ctx.beginPath();

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);

ctx.fill();

}


// Player projectiles

for(const s of shots){

ctx.fillStyle="#fff";

ctx.beginPath();

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);

ctx.fill();

}
