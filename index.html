let x;
let y;

y=
arena.top+
Math.random()*
(H-arena.top-arena.bottom);

}

else if(side===1){

x=arena.right+35;

y=
arena.top+
Math.random()*
(H-arena.top-arena.bottom);

}

else if(side===2){

x=
arena.left+
Math.random()*
(arena.right-arena.left);

y=arena.top-35;

}

else{

x=
arena.left+
Math.random()*
(arena.right-arena.left);

y=H-arena.bottom+35;

}

y:y,

speed:getWaveEnemySpeed(wave),

shoot:1+Math.random()*2,

Math.random()<.5

:"#a66cff"

});

}


// =========================
// JOYSTICK POSITIONS
// =========================

function joystickPos(){

joy.x=82;
joy.y=H-82;

}


function aimJoystickPos(){

aimJoy.x=W-65;
aimJoy.y=H-65;

}


// =========================
// MOVE JOYSTICK
// =========================

function setJoystick(px,py){

joystickPos();

let dx=px-joy.x;
let dy=py-joy.y;

let l=Math.hypot(dx,dy)||1;

if(l>joy.r){

dx=dx/l*joy.r;
dy=dy/l*joy.r;

}

joy.dx=dx/joy.r;
joy.dy=dy/joy.r;

joy.tx=joy.x+dx;
joy.ty=joy.y+dy;

}


// =========================
// AIM JOYSTICK
// =========================

function setAimJoystick(px,py){

aimJoystickPos();

let dx=px-aimJoy.x;
let dy=py-aimJoy.y;

let l=Math.hypot(dx,dy)||1;

if(l>aimJoy.r){

dx=dx/l*aimJoy.r;
dy=dy/l*aimJoy.r;

}

aimJoy.dx=dx/aimJoy.r;
aimJoy.dy=dy/aimJoy.r;

aimJoy.tx=aimJoy.x+dx;
aimJoy.ty=aimJoy.y+dy;


if(
Math.abs(aimJoy.dx)>.01||
Math.abs(aimJoy.dy)>.01
){

player.aimTarget=
Math.atan2(
aimJoy.dy,
aimJoy.dx
);

}

}


// =========================
// BUTTONS
// =========================

function pointInPlay(x,y){

const bw=Math.min(260,W-60);
const bh=64;

const bx=(W-bw)/2;
const by=H/2+5;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}


function pointInLoadoutButton(x,y){

const bw=Math.min(260,W-60);
const bh=54;

const bx=(W-bw)/2;
const by=H/2+82;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}


function pointInBackButton(x,y){

const bw=Math.min(180,W-60);
const bh=50;

const bx=(W-bw)/2;
const by=H-85;

return(
x>=bx&&
x<=bx+bw&&
y>=by&&
y<=by+bh
);

}


function pointInPause(x,y){

return(
x>=W-110&&
x<=W-16&&
y>=12&&
y<=44
);

}


function pointInCard(x,y,i){

const gap=16;

const cardW=Math.min(
300,
(W-32-gap)/2
);

const totalW=
cardW*2+gap;

const startX=
(W-totalW)/2;

const cardY=
H/2-75;

const xx=
startX+
i*(cardW+gap);

return(
x>=xx&&
x<=xx+cardW&&
y>=cardY&&
y<=cardY+150
);

}


// =========================
// SINGLE UPGRADE CARD
// =========================

function pointInSingleUpgradeCard(x,y){

const cardW=Math.min(
360,
W-50
);

const cardH=180;

const cardX=(W-cardW)/2;
const cardY=H/2-75;

return(
x>=cardX&&
x<=cardX+cardW&&
y>=cardY&&
y<=cardY+cardH
);

}


// =========================
// FIRE BASE
// =========================

function fireBase(){

if(player.weapon!==null)
return;

if(shoot>0)
return;


const a=player.aim;

shots.push({

x:player.x,
y:player.y,

vx:Math.cos(a)*player.bulletSpeed,
vy:Math.sin(a)*player.bulletSpeed,

r:5,

life:1.5,

damage:10,

pierceLeft:0

});

shoot=player.fireRate;

}


// =========================
// FIRE FAST
// =========================

function fireFast(){

if(player.weapon!=="fast")
return;

if(player.reloading)
return;

if(player.ammo<=0){

startFastReload();

return;

}


const a=player.aim;

for(
let i=0;
i<player.shots;
i++
){

const aa=
a+
(
i-(player.shots-1)/2
)*.18;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.damage,

pierceLeft:0

});

}


player.ammo--;

shoot=player.fireRate;


if(player.ammo<=0){

startFastReload();

}

}


// =========================
// FAST RELOAD
// =========================

function startFastReload(){

player.ammo=0;

player.reloading=true;

player.reloadTimer=player.reloadTime;

}


// =========================
// FIRE SCATTER
// =========================

function fireScatter(){

if(player.weapon!=="scatter")
return;

if(shoot>0)
return;


const a=player.aim;

const spread=.055;


for(
let i=0;
i<player.shots;
i++
){

const offset=
(
i-(player.shots-1)/2
)*spread;

const aa=a+offset;


shots.push({

x:player.x,
y:player.y,

vx:Math.cos(aa)*player.bulletSpeed,
vy:Math.sin(aa)*player.bulletSpeed,

r:5,

life:1.5,

damage:player.scatterDamage,

pierceLeft:
player.scatterPierce?1:0

});

}


shoot=player.scatterFireRate;

}


// =========================
// AIM TOUCH
// =========================

function beginAimTouch(touch){

aimJoystickPos();

const x=touch.clientX;
const y=touch.clientY;

const distance=
Math.hypot(
x-aimJoy.x,
y-aimJoy.y
);

if(distance>aimJoy.r+30)
return false;

aimTouchId=touch.identifier;

aimJoy.on=true;

setAimJoystick(x,y);


if(player.weapon===null){

fireBase();

}
else if(
player.weapon==="fast"&&
!player.reloading
){

fireFast();

}
else if(player.weapon==="scatter"){

fireScatter();

}

return true;

}


// =========================
// MOVE TOUCH
// =========================

function beginMoveTouch(touch){

joystickPos();

const x=touch.clientX;
const y=touch.clientY;

const distance=
Math.hypot(
x-joy.x,
y-joy.y
);

if(distance>joy.r+30)
return false;

moveTouchId=touch.identifier;

joy.on=true;

setJoystick(x,y);

return true;

}

// =========================
// TOUCH MOVE
// =========================

c.addEventListener(
"touchmove",
e=>{

e.preventDefault();

for(const touch of e.changedTouches){

if(
aimTouchId===touch.identifier
){

setAimJoystick(
touch.clientX,
touch.clientY
);

}

if(
moveTouchId===touch.identifier
){

setJoystick(
touch.clientX,
touch.clientY
);

}

}

{passive:false}
);


// =========================
// TOUCH END
// =========================

function endTouch(touch){

if(
aimTouchId===touch.identifier
){

aimTouchId=null;

aimJoy.on=false;

aimJoy.dx=1;
aimJoy.dy=0;

aimJoystickPos();

aimJoy.tx=aimJoy.x;
aimJoy.ty=aimJoy.y;

}


if(
moveTouchId===touch.identifier
){

moveTouchId=null;

joy.on=false;

joy.dx=0;
joy.dy=0;

joystickPos();

joy.tx=joy.x;
joy.ty=joy.y;

}

}


c.addEventListener(
"touchend",
e=>{

e.preventDefault();

for(const touch of e.changedTouches){

endTouch(touch);

}

},
{passive:false}
);


c.addEventListener(
"touchcancel",
e=>{

e.preventDefault();

for(const touch of e.changedTouches){

endTouch(touch);

}

},
{passive:false}
);

}


player.x=Math.max(
arena.left+18,
Math.min(
arena.right-18,
player.x
)
);

player.y=Math.max(
arena.top+18,
Math.min(
H-arena.bottom-18,
player.y
)
);


// AIM

if(aimJoy.on){

let diff=
player.aimTarget-player.aim;

while(diff>Math.PI)
diff-=Math.PI*2;

while(diff<-Math.PI)
diff+=Math.PI*2;

player.aim+=
diff*
Math.min(
1,
dt*10*player.aimSensitivity
);

}


// WAVE BREAK

if(waveBreakTimer>0){

waveBreakTimer-=dt;

if(waveBreakTimer<=0){

startWave();

}

}


// SPAWN

if(
waveBreakTimer<=0&&
waveSpawned<waveTotal
){

waveSpawnTimer-=dt;

if(waveSpawnTimer<=0){

spawnEnemy();

waveSpawned++;

waveSpawnTimer=
getWaveSpawnSpeed(wave);

}

}


// WAVE COMPLETE

if(
waveBreakTimer<=0&&
waveSpawned===waveTotal&&
enemies.length===0
){

completeWave();

}


// FAST RELOAD

if(
player.weapon==="fast"&&
player.reloading
){

player.reloadTimer-=dt;

if(player.reloadTimer<=0){

player.reloadTimer=0;

player.ammo=
player.maxAmmo;

player.reloading=false;

}

}


// FIRE TIMER

shoot-=dt;


// BASE

if(
player.weapon===null&&
aimJoy.on&&
shoot<=0
){

fireBase();

}


// FAST

if(
player.weapon==="fast"&&
aimJoy.on&&
shoot<=0&&
!player.reloading
){

fireFast();

}


// SCATTER

if(
player.weapon==="scatter"&&
aimJoy.on&&
shoot<=0
){

fireScatter();

}


// ENEMIES

for(const e of enemies){

const a=
Math.atan2(
player.y-e.y,
player.x-e.x
);

e.x+=Math.cos(a)*e.speed*dt;
e.y+=Math.sin(a)*e.speed*dt;

e.shoot-=dt;

if(e.shoot<=0){

enemyShots.push({

x:e.x,
y:e.y,

vx:Math.cos(a)*130,
vy:Math.sin(a)*130,

r:6,
life:5

});

e.shoot=2.5;

}


if(
Math.hypot(
e.x-player.x,
e.y-player.y
)
<
e.r+player.r
){

player.hp-=25;

e.x-=Math.cos(a)*25;
e.y-=Math.sin(a)*25;

}

}


// PLAYER SHOTS

for(const s of shots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
s.x<arena.left||
s.x>arena.right||
s.y<arena.top||
s.y>H-arena.bottom
){

s.life=0;

}

}


// ENEMY SHOTS

for(const s of enemyShots){

s.x+=s.vx*dt;
s.y+=s.vy*dt;

s.life-=dt;

if(
Math.hypot(
s.x-player.x,
s.y-player.y
)
<
s.r+player.r
){

player.hp-=15;

s.life=0;

}

}


// COLLISIONS

for(const s of shots){

if(s.life<=0)
continue;

for(const e of enemies){

if(
e.hp>0&&
Math.hypot(
s.x-e.x,
s.y-e.y
)
<
s.r+e.r
){

e.hp-=s.damage;


// PIERCE

if(s.pierceLeft>0){

s.damage*=.5;

s.pierceLeft--;

continue;

}

s.life=0;

break;

}

}

}


// DEATHS

for(const e of enemies){

if(
e.hp<=0&&
!e.dead
){

e.dead=true;

score+=10;

orbs.push({

x:e.x,
y:e.y

});

}

}


// CLEANUP

shots=shots.filter(
s=>
s.life>0&&
s.x>arena.left&&
s.x<arena.right&&
s.y>arena.top&&
s.y<H-arena.bottom
);

enemyShots=enemyShots.filter(
s=>s.life>0
);

enemies=enemies.filter(
e=>e.hp>0
);


// XP

for(const o of orbs){

const dist=
Math.hypot(
o.x-player.x,
o.y-player.y
);

const maxDistance=
Math.hypot(W,H);

const closeness=
1-Math.min(
1,
dist/maxDistance
);

const speed=
25+
Math.pow(
closeness,
2
)*475;

if(dist>.1){

o.x+=(player.x-o.x)/dist*speed*dt;
o.y+=(player.y-o.y)/dist*speed*dt;

}


if(dist<18){

o.dead=true;

xp+=25;


while(xp>=xpNext){

xp-=xpNext;

level++;

xpNext=
Math.floor(
xpNext*1.25
);


// LEVEL 2

if(level===2){

if(!player.weapon){

openWeaponChoice();

return;

}

else{

openUpgrades();

return;

}

}


// LEVEL 3+

if(level>2){

openUpgrades();

return;

}

}

}

}


orbs=orbs.filter(
o=>!o.dead
);


// GAME OVER

if(player.hp<=0){

gameOver=true;

}

}


// =========================

// =========================

function openWeaponChoice(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=true;

paused=false;

}


function chooseWeapon(i){

if(!weaponChoiceOpen)
return;

if(i===0){

equipScatterBlaster();

}
else{

equipFastPewPew();

}

weaponChoiceOpen=false;

upgradeOpen=false;

upgradeChoices=[];

shoot=0;

}


// =========================
// OPEN UPGRADES
// =========================

function openUpgrades(){

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;


// =========================
// SCATTER
// =========================

if(player.weapon==="scatter"){

const nextTier=
player.scatterTier+1;

const nextUpgrade=
scatterTierUpgrades.find(
u=>u.tier===nextTier
);


// Only ONE Scatter upgrade exists at a time.

if(nextUpgrade){

upgradeChoices.push(
nextUpgrade
);

upgradeOpen=true;

}

return;

}


// =========================
// FAST
// =========================

if(player.weapon==="fast"){

let pool=[
...fastPewPewUpgrades
];

while(
upgradeChoices.length<2&&
pool.length>0
){

const i=
Math.floor(
Math.random()*pool.length
);

upgradeChoices.push(
pool[i]
);

pool.splice(i,1);

}

upgradeOpen=true;

}

}


// =========================
// CHOOSE UPGRADE
// =========================

function chooseUpgrade(i){

if(
!upgradeOpen||
!upgradeChoices[i]
)
return;


upgradeChoices[i].apply();

shots=[];
enemyShots=[];

upgradeChoices=[];

upgradeOpen=false;

weaponChoiceOpen=false;

paused=false;

shoot=0;

}


// =========================
// PAUSE
// =========================

function togglePause(){

if(
!started||
gameOver||
upgradeOpen||
weaponChoiceOpen
)
return;

paused=!paused;

}

line+" "+word:
word;

if(

cardW-40
){

lines.push(line);

line=word;

else{

}

if(line)
lines.push(line);

let j=0;

j++
){

lines[j],

);

ctx.fillStyle="#65e6ff";

ctx.fillText(

);

else{

);

cardW*2+gap;

);

);

cardY+128
);

}

}

if(

);

);

);
